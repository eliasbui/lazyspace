[package]
name = "lazyspace"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
description = "A file manager for macOS with panes, archives, remote servers and a stash shelf"
repository = "https://github.com/eliasbui/lazyspace"
license = "MIT"

[[bin]]
name = "lazyspace"
path = "src/main.rs"

[dependencies]
# The window and its web page, and the menu bar; the versions Lanes ships.
tao = "0.37"
wry = "0.57"
muda = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The native layer: the glass behind the page, the web view's own settings, and work that must run on the main thread.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["objc2-uniform-type-identifiers"] }
objc2-web-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
# The icon of a file type and its name in words ("JPEG image"), and thumbnails of pictures, films and PDFs.
objc2-uniform-type-identifiers = "0.3"
# Without the default features, which would bring UIKit's bindings in as well.
objc2-quick-look-thumbnailing = { version = "0.3", default-features = false, features = ["std", "QLThumbnailGenerator", "QLThumbnailGenerationRequest", "QLThumbnailRepresentation", "bitflags", "block2", "objc2-app-kit", "objc2-core-foundation", "objc2-core-graphics"] }
# Quick Look's panel on Space.
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "QLPreviewItem", "QLPreviewPanel", "objc2-app-kit"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
# A folder on screen follows what changes in it (FSEvents), a few changes at a time.
notify = "8"
notify-debouncer-full = "0.7"
# The update check: blocking HTTP, and the SHA-256 that GitHub publishes for a release.
ureq = "3.4"
sha2 = "0.10"
# The hashes of files: MD5, SHA-1, the SHA-2 family (with sha2 above) and CRC32, read in one pass.
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
# The window icon is decoded from PNG at startup; the home and the well-known folders.
png = "0.18"
dirs = "7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
