<script>
// Commands of the user's own (src/features/actions.rs): written in Settings, offered in the context menu for the items
// they fit, run with the items as their arguments; what they print comes back as a toast.
LZ.words({
  vi: {
    actionsTitle: "Lệnh của bạn", "m.actions": "Lệnh",
    actionsHint: "Mỗi lệnh là một dòng zsh. Các mục đang chọn là tham số của nó (\"$@\", $1) và nó chạy trong thư mục chứa chúng; $LAZYSPACE_FOLDER là thư mục đó. Tên tệp không bao giờ bị chạy thành lệnh.",
    actionName: "Tên", actionCommand: "Dòng lệnh, ví dụ: code \"$@\"", addAction: "Thêm lệnh", removeAction: "Xóa lệnh này",
    "when.any": "Mọi mục", "when.files": "Chỉ tệp", "when.folders": "Chỉ thư mục", "when.none": "Không chọn gì",
    "out.toast": "Hiện kết quả", "out.terminal": "Chạy trong Terminal", "out.none": "Chạy im lặng", actionDone: "Xong: {0}",
  },
  en: {
    actionsTitle: "Your Commands", "m.actions": "Commands",
    actionsHint: "Each command is a line of zsh. The items selected are its arguments (\"$@\", $1) and it runs in the folder they are in; $LAZYSPACE_FOLDER is that folder. No file name is ever run as a command.",
    actionName: "Name", actionCommand: "Command, for example: code \"$@\"", addAction: "Add Command", removeAction: "Remove This Command",
    "when.any": "Any item", "when.files": "Files only", "when.folders": "Folders only", "when.none": "Nothing selected",
    "out.toast": "Show the output", "out.terminal": "Run in Terminal", "out.none": "Run quietly", actionDone: "Done: {0}",
  },
});

(() => {
  let actions = [];
  const load = () => LZ.call("actions.list").then((list) => (actions = list), () => actions);

  // Whether a command is offered for what the menu is about.
  const fits = (a, ctx) =>
    a.when === "none" ? ctx.count === 0 : ctx.count > 0 && (a.when === "any" || ctx.entries.every((e) => (a.when === "folders" ? e.isDir : !e.isDir)));
  // The folder a command runs in: the pane's, or the folder of the first item when the pane is not one of this Mac.
  const folderOf = (ctx) => (isLocal(ctx.tab.uri) ? ctx.tab.uri : ctx.entries[0]?.uri.slice(0, ctx.entries[0].uri.lastIndexOf("/")));
  LZ.menu.add({
    id: "actions",
    label: "m.actions",
    icon: "terminal",
    group: 70,
    order: 1,
    when: (ctx) => actions.some((a) => fits(a, ctx)) && !!folderOf(ctx) && ctx.entries.every((e) => isLocal(e.uri)),
    submenu: (ctx) =>
      actions
        .filter((a) => fits(a, ctx))
        .map((a) => ({ id: `action.${a.id}`, label: () => a.name, run: (c) => LZ.call("actions.run", { id: a.id, folder: folderOf(c), uris: c.count ? c.entries.map((e) => e.uri) : [] }).catch(LZ.say) })),
  });
  LZ.on("jobs.finished", (d) => {
    if (!d.ok || d.data?.action == null) return;
    const out = String(d.data.output || "").trim();
    LZ.toast(out ? (out.length > 300 ? `${out.slice(0, 300)}...` : out) : t("actionDone", d.data.action));
  });

  // Settings: the commands as rows of fields, kept as they are typed.
  const group = LZ.settings.section({
    id: "actions",
    title: "actionsTitle",
    build(el) {
      el.innerHTML = `<div class="item"><div class="label"><small data-t="actionsHint"></small></div></div><div class="act-list"></div>
        <div class="item"><div class="control"><button class="push" data-act="add" data-t="addAction"></button></div></div>`;
    },
  });
  const listEl = group.querySelector(".act-list");
  const option = (prefix, value, current) => `<option value="${value}"${value === current ? " selected" : ""}>${LZ.esc(t(`${prefix}.${value}`))}</option>`;
  function paint() {
    listEl.innerHTML = actions
      .map(
        (a, i) => `<div class="act-row" data-i="${i}">
          <input class="act-name" data-f="name" value="${LZ.esc(a.name)}" placeholder="${LZ.esc(t("actionName"))}" spellcheck="false">
          <input class="act-command" data-f="command" value="${LZ.esc(a.command)}" placeholder="${LZ.esc(t("actionCommand"))}" spellcheck="false">
          <select data-f="when">${["any", "files", "folders", "none"].map((v) => option("when", v, a.when)).join("")}</select>
          <select data-f="output">${["toast", "terminal", "none"].map((v) => option("out", v, a.output)).join("")}</select>
          <button class="act-remove" data-act="remove" title="${LZ.esc(t("removeAction"))}">${icon("xmark")}</button>
        </div>`,
      )
      .join("");
  }
  let timer;
  const keep = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const ready = actions.filter((a) => a.name.trim() && a.command.trim());
      LZ.call("actions.save", { actions: ready }).catch(LZ.say);
    }, 400);
  };
  group.addEventListener("input", (e) => {
    const row = e.target.closest(".act-row");
    const field = e.target.dataset.f;
    if (!row || !field) return;
    actions[Number(row.dataset.i)][field] = e.target.value;
    keep();
  });
  group.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (act === "add") {
      actions.push({ id: `a${Date.now().toString(36)}`, name: "", command: "", when: "any", output: "toast" });
      paint();
      listEl.querySelector(".act-row:last-child .act-name")?.focus();
    } else if (act === "remove") {
      actions.splice(Number(e.target.closest(".act-row").dataset.i), 1);
      paint();
      keep();
    }
  });
  group.addEventListener("keydown", (e) => e.stopPropagation());
  LZ.on("app.hello", () => load().then(paint));
  LZ.on("settings.changed", paint);
})();
</script>

<script>
// What a folder holds by size, drawn as rectangles as DaisyDisk draws it, and the files in it that are the same
// (src/features/disk.rs). Both start from the folder selected, or the pane's own, in the context menu or the palette.
LZ.words({
  vi: {
    diskMap: "Xem dung lượng", findTwins: "Tìm tệp trùng lặp", diskTitle: "Dung lượng của \"{0}\"", measuring: "Đang đo...", diskUp: "Lên trên",
    diskHint: "Bấm vào một thư mục để xem sâu hơn; nhấp đúp vào một mục để hiện nó trong cửa sổ.",
    twinsTitle: "Tệp trùng lặp trong \"{0}\"", twinsNone: "Không có tệp nào trùng nhau.", twinsSum: "{0} nhóm, có thể giải phóng {1}",
    twinsGroup: "{0} x {1}, thừa {2}", pickExtra: "Chọn các bản thừa", pickNone: "Bỏ chọn", trashPicked: "Chuyển {0} mục vào Thùng rác", finding: "Đang so sánh tệp...",
  },
  en: {
    diskMap: "Show Disk Usage", findTwins: "Find Duplicate Files", diskTitle: "What \"{0}\" Holds", measuring: "Measuring...", diskUp: "Up",
    diskHint: "Click a folder to look inside; double-click an item to show it in the window.",
    twinsTitle: "Duplicate Files in \"{0}\"", twinsNone: "No files are the same.", twinsSum: "{0} groups, {1} to free",
    twinsGroup: "{0} x {1}, {2} extra", pickExtra: "Select the Extra Copies", pickNone: "Deselect", trashPicked: "Move {0} Items to the Trash", finding: "Comparing files...",
  },
});

const Disk = (() => {
  // The folder an action is for: the one folder selected, or the pane's own.
  const folderOf = (pane) => {
    const one = pane.tab.selCount() === 1 ? pane.tab.selectedEntries()[0] : null;
    return one?.isDir && isLocal(one.uri) ? one.uri : isLocal(pane.tab.uri) ? pane.tab.uri : null;
  };
  const jobs = new Map();
  LZ.on("jobs.finished", (d) => {
    const done = jobs.get(d.id);
    if (!done) return;
    jobs.delete(d.id);
    if (d.ok) done(d.data);
  });
  const start = (method, uri, done) => LZ.call(method, { uri }).then((d) => jobs.set(d.job, done), LZ.say);

  // The map: the folders shown, the deepest last, each with the items under it two levels down.
  const map = LZ.sheet.create("diskSheet");
  map.classList.add("disk-panel");
  map.innerHTML = `<header class="disk-head"><button class="push" data-a="up"></button><div class="disk-what"><h2></h2><small></small></div><button class="push primary" data-a="done"></button></header>
    <div class="disk-map"></div><p class="disk-hint"></p>`;
  const area = map.querySelector(".disk-map");
  let shown = [];

  // Rectangles for items of sizes `sizes` (largest first) in a box, as squares as they can be (Bruls, Huizing and van
  // Wijk's squarified treemap): rows are laid along the shorter side while that keeps their shapes squarer.
  function squarify(sizes, x, y, w, h) {
    const total = sizes.reduce((a, b) => a + b, 0);
    const out = [];
    if (!total || w <= 0 || h <= 0) return out;
    const scale = (w * h) / total;
    let rest = sizes.map((s) => s * scale);
    let box = { x, y, w, h };
    while (rest.length) {
      const side = Math.min(box.w, box.h);
      let row = [];
      let worst = Infinity;
      for (const area of rest) {
        const next = [...row, area];
        const sum = next.reduce((a, b) => a + b, 0);
        const ratio = Math.max(...next.map((a) => Math.max((side * side * a) / (sum * sum), (sum * sum) / (side * side * a))));
        if (ratio > worst) break;
        row = next;
        worst = ratio;
      }
      rest = rest.slice(row.length);
      const sum = row.reduce((a, b) => a + b, 0);
      const thick = sum / side;
      let at = 0;
      for (const area of row) {
        const len = area / thick;
        out.push(box.w >= box.h ? { x: box.x, y: box.y + at, w: thick, h: len } : { x: box.x + at, y: box.y, w: len, h: thick });
        at += len;
      }
      box = box.w >= box.h ? { x: box.x + thick, y: box.y, w: box.w - thick, h: box.h } : { x: box.x, y: box.y + thick, w: box.w, h: box.h - thick };
    }
    return out;
  }

  // The colour of an item by what it is.
  const KINDS = [
    [/^(png|jpe?g|gif|heic|webp|tiff?|bmp|raw|dng|psd|svg)$/, 30],
    [/^(mov|mp4|m4v|mkv|avi|webm)$/, 280],
    [/^(mp3|m4a|aac|wav|flac|aiff|ogg)$/, 330],
    [/^(zip|7z|rar|tar|gz|tgz|xz|bz2|dmg|iso|pkg)$/, 20],
    [/^(pdf|docx?|xlsx?|pptx?|pages|numbers|key|txt|md|rtf)$/, 180],
    [/^(rs|js|ts|tsx|py|go|swift|c|h|cpp|java|kt|rb|php|cs|sh|html|css|json)$/, 130],
  ];
  function colour(node, i) {
    if (node.other) return "var(--track)";
    if (node.dir) return `hsl(212, 62%, ${46 + (i % 5) * 6}%)`;
    const ext = node.name.includes(".") ? node.name.split(".").pop().toLowerCase() : "";
    const hue = KINDS.find(([re]) => re.test(ext))?.[1];
    return hue == null ? `hsl(220, 6%, ${52 + (i % 4) * 6}%)` : `hsl(${hue}, 65%, ${50 + (i % 3) * 5}%)`;
  }

  function paint() {
    const node = shown[shown.length - 1];
    map.querySelector('[data-a="up"]').hidden = shown.length < 2;
    map.querySelector("h2").textContent = node ? t("diskTitle", node.name) : t("measuring");
    map.querySelector("small").textContent = node ? fmtSize(node.size) : "";
    if (!node) return (area.innerHTML = `<p class="disk-wait">${esc(t("measuring"))}</p>`);
    const { width, height } = area.getBoundingClientRect();
    const children = node.children.filter((c) => c.size > 0);
    const rects = squarify(children.map((c) => c.size), 0, 0, width, height);
    area.innerHTML = rects
      .map((r, i) => {
        const c = children[i];
        const inner = c.dir && r.w > 90 && r.h > 54 ? squarify(c.children.filter((k) => k.size > 0).map((k) => k.size), 3, 20, r.w - 6, r.h - 23) : [];
        const kids = inner.map((k, j) => `<i style="left:${k.x}px;top:${k.y}px;width:${k.w}px;height:${k.h}px;background:${colour(c.children.filter((x) => x.size > 0)[j], j)}"></i>`).join("");
        const label = r.w > 46 && r.h > 18 ? `<b>${esc(c.name)}</b>${r.h > 34 && !kids ? `<small>${esc(fmtSize(c.size))}</small>` : ""}` : "";
        return `<div class="disk-cell${c.dir ? " dir" : ""}" data-i="${i}" title="${esc(`${c.name} - ${fmtSize(c.size)}`)}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;--c:${colour(c, i)}">${kids}${label}</div>`;
      })
      .join("");
  }
  new ResizeObserver(() => map.closest(".modal.open") && paint()).observe(area);

  function measure(uri) {
    LZ.sheet.open("diskSheet");
    paint();
    start("disk.map", uri, (data) => {
      shown.push(data.map);
      paint();
    });
  }
  area.addEventListener("click", (e) => {
    const node = shown[shown.length - 1]?.children.filter((c) => c.size > 0)[Number(e.target.closest(".disk-cell")?.dataset.i)];
    if (!node?.dir) return;
    shown.push({ ...node, children: node.children });
    paint();
    start("disk.map", fileUri(node.path), (data) => {
      if (shown[shown.length - 1]?.path === data.map.path) shown[shown.length - 1] = data.map;
      paint();
    });
  });
  area.addEventListener("dblclick", (e) => {
    const node = shown[shown.length - 1]?.children.filter((c) => c.size > 0)[Number(e.target.closest(".disk-cell")?.dataset.i)];
    const pane = Panes.focused();
    if (!node?.path || !pane) return;
    closeSheets();
    pane.navigate(fileUri(node.path.slice(0, node.path.lastIndexOf("/")) || "/"), { select: [node.name] });
  });
  map.addEventListener("click", (e) => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (a === "done") closeSheets();
    if (a === "up" && shown.length > 1) {
      shown.pop();
      paint();
    }
  });

  // The twins: each group with its files to tick, the first of each left unticked by "Select the Extra Copies".
  const twins = LZ.sheet.create("twinsSheet");
  twins.classList.add("twins-panel");
  twins.innerHTML = `<h2></h2><p class="twins-sum"></p><div class="twins-list"></div>
    <div class="buttons"><button class="push" data-a="extra"></button><button class="push" data-a="none"></button><button class="push" data-a="trash"></button><button class="push primary" data-a="done"></button></div>`;
  const list = twins.querySelector(".twins-list");
  let groups = [];
  const picked = () => [...list.querySelectorAll("input:checked")].map((c) => c.dataset.uri);
  function paintTwins(folder) {
    if (folder) twins.querySelector("h2").textContent = t("twinsTitle", nameOf(folder));
    const free = groups.reduce((sum, g) => sum + g.size * (g.uris.length - 1), 0);
    twins.querySelector(".twins-sum").textContent = groups.length ? t("twinsSum", groups.length, fmtSize(free)) : t("twinsNone");
    list.innerHTML = groups
      .map(
        (g) => `<div class="tw-group"><div class="tw-head">${esc(t("twinsGroup", fmtSize(g.size), g.uris.length, fmtSize(g.size * (g.uris.length - 1))))}</div>${g.uris
          .map((uri) => `<label class="tw-row"><input type="checkbox" data-uri="${esc(uri)}"><img src="${esc(`lazy://icon/${16 * pixelRatio()}/${encodeURIComponent(`path:${pathOf(uri)}`)}`)}" alt=""><span>${esc(placeLabel(uri))}</span></label>`)
          .join("")}</div>`,
      )
      .join("");
    count();
  }
  function count() {
    const n = picked().length;
    const b = twins.querySelector('[data-a="trash"]');
    b.textContent = t("trashPicked", n);
    b.disabled = !n;
  }
  list.addEventListener("change", count);
  twins.addEventListener("click", (e) => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (a === "done") closeSheets();
    if (a === "extra" || a === "none") {
      for (const group of list.querySelectorAll(".tw-group")) [...group.querySelectorAll("input")].forEach((c, i) => (c.checked = a === "extra" && i > 0));
      count();
    }
    if (a === "trash") {
      const uris = picked();
      LZ.call("fs.trash", { uris })
        .then((d) =>
          jobs.set(d.job, () => {
            groups = groups.map((g) => ({ ...g, uris: g.uris.filter((u) => !uris.includes(u)) })).filter((g) => g.uris.length > 1);
            paintTwins();
          }),
        )
        .catch(LZ.say);
    }
  });
  function findTwins(uri) {
    groups = [];
    twins.querySelector("h2").textContent = t("twinsTitle", nameOf(uri));
    twins.querySelector(".twins-sum").textContent = t("finding");
    list.innerHTML = "";
    LZ.sheet.open("twinsSheet");
    start("disk.twins", uri, (data) => {
      groups = data.twins;
      paintTwins(data.folder);
    });
  }

  Object.assign(Panes.actions, {
    diskMap(pane) {
      const uri = folderOf(pane);
      if (!uri) return;
      shown = [];
      measure(uri);
    },
    findTwins(pane) {
      const uri = folderOf(pane);
      if (uri) findTwins(uri);
    },
  });
  const fits = (ctx) => (ctx.count === 1 ? ctx.entry?.isDir && isLocal(ctx.entry.uri) : ctx.count === 0 && isLocal(ctx.tab.uri));
  LZ.menu.add({ id: "diskMap", label: "diskMap", icon: "chart.pie", group: 70, order: 2, when: fits, run: (c) => Panes.action("diskMap", c.pane) });
  LZ.menu.add({ id: "findTwins", label: "findTwins", icon: "doc.on.doc", group: 70, order: 3, when: fits, run: (c) => Panes.action("findTwins", c.pane) });
  LZ.on("app.hello", () => {
    for (const [sel, word] of [['[data-a="up"]', "diskUp"], ['[data-a="done"]', "done"]]) map.querySelector(sel).textContent = t(word);
    map.querySelector(".disk-hint").textContent = t("diskHint");
    for (const [sel, word] of [['[data-a="extra"]', "pickExtra"], ['[data-a="none"]', "pickNone"], ['[data-a="done"]', "done"]]) twins.querySelector(sel).textContent = t(word);
  });
})();
</script>

<script>
// Comparing and syncing two folders (W3), in a sheet: the differences with what each would do, every line's action
// changeable, and nothing done until Sync is pressed and confirmed.
LZ.words({
  vi: {
    syncTitle: "So sánh và đồng bộ", syncMenu: "So sánh và đồng bộ...", comparePanes: "So sánh với khung bên cạnh", modeLtr: "Trái sang phải", modeRtl: "Phải sang trái",
    modeBoth: "Hai chiều", byTime: "Kích thước và ngày", byContent: "Nội dung", ignoreHidden: "Bỏ qua tệp ẩn", mirror: "Xóa mục thừa ở đích (vào Thùng rác; trên máy chủ thì xóa hẳn)",
    compare: "So sánh", doSync: "Đồng bộ", syncSummary: "{0} giống nhau, {1} khác biệt", syncTruncated: "Chỉ liệt kê 20.000 mục khác biệt đầu tiên.",
    "s.leftNewer": "Trái mới hơn", "s.rightNewer": "Phải mới hơn", "s.leftOnly": "Chỉ bên trái", "s.rightOnly": "Chỉ bên phải", "s.conflict": "Xung đột",
    "a.skip": "Bỏ qua", "a.ltr": "Chép sang phải", "a.rtl": "Chép sang trái", "a.deleteLeft": "Xóa bên trái", "a.deleteRight": "Xóa bên phải",
    syncConfirm: "Đồng bộ {0} mục?", syncConfirmText: "Chép sang phải {0}, chép sang trái {1}, chuyển vào Thùng rác {2}. Mục bị thay sẽ mất bản cũ.",
    comparing: "Đang so sánh...", allSame: "Hai thư mục giống nhau.", swap: "Đổi bên", filterAll: "Tất cả",
  },
  en: {
    syncTitle: "Compare and Sync", syncMenu: "Compare and Sync...", comparePanes: "Compare with the Next Pane", modeLtr: "Left to right", modeRtl: "Right to left",
    modeBoth: "Both ways", byTime: "Size and date", byContent: "Content", ignoreHidden: "Ignore hidden files", mirror: "Remove extra items from the target (to the Trash; on a server for good)",
    compare: "Compare", doSync: "Sync", syncSummary: "{0} the same, {1} different", syncTruncated: "Only the first 20,000 differences are listed.",
    "s.leftNewer": "Left is newer", "s.rightNewer": "Right is newer", "s.leftOnly": "Left only", "s.rightOnly": "Right only", "s.conflict": "Conflict",
    "a.skip": "Skip", "a.ltr": "Copy to the right", "a.rtl": "Copy to the left", "a.deleteLeft": "Remove from the left", "a.deleteRight": "Remove from the right",
    syncConfirm: "Sync {0} items?", syncConfirmText: "{0} copied to the right, {1} to the left, {2} moved to the Trash. Replaced items lose their old version.",
    comparing: "Comparing...", allSame: "The two folders are the same.", swap: "Swap sides", filterAll: "All",
  },
});
LZ.icons.add({
  swap: "arrow.left.arrow.right",
});

const Sync = (() => {
  const SHOWN = 2000;
  const STATES = ["leftNewer", "rightNewer", "leftOnly", "rightOnly", "conflict"];
  const ACTIONS = ["skip", "ltr", "rtl", "deleteLeft", "deleteRight"];
  let left = null;
  let right = null;
  let pairs = [];
  let job = null;
  let filter = "all";
  let options = { mode: "ltr", content: false, ignoreHidden: true, mirror: false };

  const panel = LZ.sheet.create("syncSheet");
  panel.classList.add("sync-panel");
  panel.innerHTML = `
    <h2 data-t="syncTitle"></h2>
    <div class="sync-sides"><span class="sync-left"></span><button class="mini" data-sync="swap">${icon("swap")}</button><span class="sync-right"></span></div>
    <div class="sync-options">
      <div class="segmented" data-opt="mode"><button class="seg" data-v="ltr" data-t="modeLtr"></button><button class="seg" data-v="rtl" data-t="modeRtl"></button><button class="seg" data-v="both" data-t="modeBoth"></button></div>
      <div class="segmented" data-opt="content"><button class="seg" data-v="false" data-t="byTime"></button><button class="seg" data-v="true" data-t="byContent"></button></div>
      <label class="check"><input type="checkbox" data-opt="ignoreHidden"> <span data-t="ignoreHidden"></span></label>
      <label class="check"><input type="checkbox" data-opt="mirror"> <span data-t="mirror"></span></label>
      <button class="push" data-sync="compare" data-t="compare"></button>
    </div>
    <div class="sync-filter"></div>
    <div class="sync-summary"></div>
    <div class="sync-table"></div>
    <div class="buttons"><button class="push" data-sync="close" data-t="done"></button><button class="push primary" data-sync="apply" data-t="doSync" disabled></button></div>`;
  const table = panel.querySelector(".sync-table");
  const summary = panel.querySelector(".sync-summary");

  const side = (s) => (s ? `${s.isDir ? "--" : fmtSize(s.size)}, ${fmtDate(s.mtime)}` : "");

  function paintOptions() {
    panel.querySelector(".sync-left").textContent = pathOf(left);
    panel.querySelector(".sync-right").textContent = pathOf(right);
    for (const seg of panel.querySelectorAll('[data-opt="mode"] .seg')) seg.classList.toggle("on", seg.dataset.v === options.mode);
    for (const seg of panel.querySelectorAll('[data-opt="content"] .seg')) seg.classList.toggle("on", seg.dataset.v === String(options.content));
    panel.querySelector('[data-opt="ignoreHidden"]').checked = options.ignoreHidden;
    const mirror = panel.querySelector('[data-opt="mirror"]');
    mirror.checked = options.mirror && options.mode !== "both";
    mirror.disabled = options.mode === "both";
  }

  function render() {
    const counts = Object.fromEntries(STATES.map((s) => [s, pairs.filter((p) => p.state === s).length]));
    panel.querySelector(".sync-filter").innerHTML = [["all", t("filterAll"), pairs.length], ...STATES.filter((s) => counts[s]).map((s) => [s, t(`s.${s}`), counts[s]])]
      .map(([key, label, n]) => `<button class="chip${filter === key ? " on" : ""}" data-filter="${key}">${LZ.esc(label)} <b>${n}</b></button>`)
      .join("");
    const shown = pairs.map((p, i) => [p, i]).filter(([p]) => filter === "all" || p.state === filter);
    table.innerHTML =
      shown
        .slice(0, SHOWN)
        .map(
          ([p, i]) => `<div class="sr ${p.state}" data-i="${i}">
            <span class="badge">${LZ.esc(t(`s.${p.state}`))}</span>
            <span class="rel" title="${LZ.esc(p.rel)}">${LZ.esc(p.rel)}</span>
            <span class="sd">${side(p.left)}</span>
            <select>${ACTIONS.map((a) => `<option value="${a}"${a === p.action ? " selected" : ""}>${LZ.esc(t(`a.${a}`))}</option>`).join("")}</select>
            <span class="sd">${side(p.right)}</span>
          </div>`,
        )
        .join("") || (job ? "" : `<p class="sync-empty">${LZ.esc(t("allSame"))}</p>`);
    const active = pairs.filter((p) => p.action !== "skip").length;
    const apply = panel.querySelector('[data-sync="apply"]');
    apply.disabled = !active;
    apply.textContent = active ? `${t("doSync")} (${active})` : t("doSync");
  }

  function compare() {
    pairs = [];
    summary.textContent = t("comparing");
    table.innerHTML = "";
    LZ.call("sync.compare", { left, right, options })
      .then((d) => (job = d.job))
      .catch((error) => (summary.textContent = String(error)));
  }

  LZ.on("jobs.finished", (d) => {
    if (d.id !== job) return;
    job = null;
    if (!d.ok) {
      summary.textContent = d.cancelled ? "" : String(d.error || "");
      return;
    }
    if (d.data?.pairs) {
      pairs = d.data.pairs;
      summary.textContent = t("syncSummary", d.data.same, pairs.length) + (d.data.truncated ? ` ${t("syncTruncated")}` : "");
      render();
    } else if (d.data?.done != null) {
      compare();
    }
  });

  panel.addEventListener("click", async (e) => {
    const act = e.target.closest("[data-sync]")?.dataset.sync;
    const seg = e.target.closest(".segmented .seg");
    const chip = e.target.closest("[data-filter]");
    if (seg) {
      const opt = seg.closest("[data-opt]").dataset.opt;
      options[opt] = opt === "content" ? seg.dataset.v === "true" : seg.dataset.v;
      if (opt === "mode" && options.mode === "both") options.mirror = false;
      paintOptions();
      compare();
    } else if (chip) {
      filter = chip.dataset.filter;
      render();
    } else if (act === "swap") {
      [left, right] = [right, left];
      paintOptions();
      compare();
    } else if (act === "compare") compare();
    else if (act === "close") LZ.sheet.close();
    else if (act === "apply") {
      const count = (a) => pairs.filter((p) => p.action === a).length;
      const n = pairs.filter((p) => p.action !== "skip").length;
      const ok = await LZ.confirm(t("syncConfirm", n), t("syncConfirmText", count("ltr"), count("rtl"), count("deleteLeft") + count("deleteRight")), t("doSync"));
      LZ.sheet.open("syncSheet");
      if (!ok) return;
      summary.textContent = t("comparing");
      LZ.call("sync.apply", { left, right, steps: pairs.map((p) => ({ rel: p.rel, action: p.action })) })
        .then((d) => (job = d.job))
        .catch(LZ.say);
    }
  });
  panel.addEventListener("change", (e) => {
    const opt = e.target.dataset.opt;
    if (opt) {
      options[opt] = e.target.checked;
      compare();
      return;
    }
    const row = e.target.closest(".sr");
    if (row && e.target.tagName === "SELECT") {
      pairs[Number(row.dataset.i)].action = e.target.value;
      render();
    }
  });

  function open(a, b) {
    left = a;
    right = b;
    filter = "all";
    paintOptions();
    LZ.sheet.open("syncSheet");
    compare();
  }

  // The focused pane's folder and the next pane's, or the two folders selected.
  function fromPanes(pane = Panes.focused()) {
    const dirs = pane.tab.selectedEntries().filter((e) => e.isDir);
    if (dirs.length === 2) return open(dirs[0].uri, dirs[1].uri);
    const all = Panes.all();
    if (all.length < 2) return;
    const next = all[(all.indexOf(pane) + 1) % all.length];
    open(pane.tab.uri, next.tab.uri);
  }

  Panes.actions.compareFolders = fromPanes;
  Keys.add({ "Cmd+Alt+K": "compareFolders" });
  LZ.menu.add({ id: "sync", label: "syncMenu", icon: "arrow.triangle.2.circlepath", group: 55, order: 5, when: (c) => c.count === 2 && c.entries.length === 2 && c.entries.every((e) => e.isDir), run: (c) => open(c.entries[0].uri, c.entries[1].uri) });
  LZ.menu.add({ id: "comparePanes", label: "comparePanes", icon: "arrow.triangle.2.circlepath", group: 55, order: 6, action: "compareFolders", when: (c) => c.count === 0 && Panes.all().length > 1, run: (c) => fromPanes(c.pane) });
  return { open };
})();
</script>

<script>
// Git in the list (src/features/git.rs): in a folder of a repository each item changed shows a letter after its name, as
// the editors show them (M changed, A added, D gone, R renamed, U new, C in conflict), and the branch shows at the end of
// the path bar. It is asked again whenever the folder changes.
LZ.words({ vi: { gitBranch: "Nhánh git: {0}" }, en: { gitBranch: "Git branch: {0}" } });
LZ.icons.add({ branch: "arrow.triangle.branch" });

(() => {
  const timers = new WeakMap();
  function ask(pane) {
    const tab = pane.tab;
    clearTimeout(timers.get(tab));
    if (!isLocal(tab.uri)) return paint(pane, null);
    timers.set(
      tab,
      setTimeout(() => {
        const uri = tab.uri;
        LZ.call("git.status", { uri })
          .then((state) => {
            if (tab.uri !== uri) return;
            tab.marks = state?.items || null;
            tab.branch = state?.branch || null;
            if (pane.tab === tab) paint(pane, tab);
          })
          .catch(() => {});
      }, 250),
    );
  }

  function paint(pane, tab) {
    let pill = pane.box.querySelector(".git-branch");
    const branch = tab?.branch;
    if (!branch) pill?.remove();
    else {
      if (!pill) {
        pill = document.createElement("span");
        pill.className = "git-branch";
        pane.box.querySelector('[data-act="history"]').before(pill);
      }
      pill.innerHTML = `${icon("branch")}<span>${LZ.esc(branch)}</span>`;
      pill.title = t("gitBranch", branch);
    }
    pane.render();
  }

  LZ.on("view.changed", (d) => {
    const found = Panes.findTab(d.view);
    if (found && found[0].tab === found[1]) ask(found[0]);
  });
  // A tab shown again shows its own state, and asks again in case it moved on.
  Panes.on("render", ({ pane }) => {
    const pill = pane.box.querySelector(".git-branch");
    if (!pane.tab.branch && pill) pill.remove();
    else if (pane.tab.branch && pill?.textContent !== pane.tab.branch) paint(pane, pane.tab);
  });
})();
</script>

  position: absolute; top: 9px; right: 9px; width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center;

/* A disk on its way out of the sidebar. */
.side-item.ejecting { opacity: 0.45; pointer-events: none; }

<script>
// Disks and devices as they come and go (src/features/devices.rs). The sidebar follows a disk mounted, unmounted or
// renamed, and a tab on a disk that went goes home; a note in the corner of the main window in front says what came,
// with what can be done with it: open or eject a disk, install the app a disk image holds and eject the image, or browse
// a phone or a camera, which macOS mounts as no disk, here (ui/parts/33-phones.js) or in the apps that read one.
// Settings can turn the notes off; what an eject the user asked for has to say is shown either way.
LZ.words({
  vi: {
    "dev.kind.usb": "Ổ USB", "dev.kind.card": "Thẻ nhớ", "dev.kind.thunderbolt": "Ổ Thunderbolt", "dev.kind.external": "Ổ ngoài",
    "dev.kind.internal": "Ổ trong", "dev.kind.network": "Ổ mạng", "dev.kind.image": "Ảnh đĩa",

    "dev.eject": "Đẩy ra", "dev.ejecting": "Đang đẩy ra...", "dev.ejectFailed": "Chưa đẩy ra được {0}", "dev.tryAgain": "Thử lại",
    "dev.forceEject": "Đẩy ra bắt buộc", "dev.forceTitle": "Đẩy ra bắt buộc {0}?",
    "dev.forceText": "Ứng dụng đang mở tệp trên ổ này có thể mất phần chưa lưu. Chỉ làm khi đã lưu hết, hoặc không thoát được ứng dụng đó.",
    "dev.notEjectable": "Không có ổ nào đẩy ra được ở đây",
    "dev.inImage": "Trong ảnh đĩa {0}", "dev.appsInImage": "{0} ứng dụng trong ảnh đĩa {1}", "dev.package": "Gói cài đặt trong ảnh đĩa {0}",
    "dev.install": "Cài vào Ứng dụng", "dev.update": "Cập nhật lên {0}", "dev.installThis": "Cài bản {0}", "dev.replace": "Thay bản đang có",
    "dev.hasOlder": "Ứng dụng đang có bản {0}", "dev.hasNewer": "Ứng dụng đang có bản mới hơn ({0})", "dev.hasSame": "Bản này đã có trong Ứng dụng",
    "dev.hasSome": "Đã có một bản trong Ứng dụng", "dev.openApp": "Mở ứng dụng", "dev.runInstaller": "Mở trình cài đặt",
    "dev.installing": "Đang cài...", "dev.installStopped": "Đã dừng cài đặt", "dev.installed": "Đã cài {0}", "dev.installedIn": "Trong {0}.",
    "dev.installedEjected": "Trong {0}. Ảnh đĩa đã được đẩy ra.", "dev.installedNotEjected": "Trong {0}. Chưa đẩy ra được ảnh đĩa: {1}",

    "dev.cameraText": "Thiết bị gửi ảnh qua PTP nên không hiện thành ổ đĩa. Xem và chép ảnh ngay trong LazySpace, hoặc bằng các ứng dụng dưới đây.",
    "dev.mtpText": "Điện thoại chia sẻ tệp qua MTP, macOS không đọc được. Trên điện thoại, chọn chế độ truyền ảnh (PTP) để xem ảnh trong LazySpace hoặc chép bằng ứng dụng dưới đây.",
    "dev.browse": "Xem tệp",
  },
  en: {
    "dev.kind.usb": "USB drive", "dev.kind.card": "Memory card", "dev.kind.thunderbolt": "Thunderbolt drive", "dev.kind.external": "External drive",
    "dev.kind.internal": "Internal volume", "dev.kind.network": "Network volume", "dev.kind.image": "Disk image",
    "dev.ready": "{0}, {1} free of {2}", "dev.open": "Open", "dev.close": "Close",
    "dev.eject": "Eject", "dev.ejecting": "Ejecting...", "dev.ejectFailed": "{0} was not ejected", "dev.tryAgain": "Try Again",
    "dev.forceEject": "Force Eject", "dev.forceTitle": "Force eject {0}?",
    "dev.forceText": "Apps with files open on this disk may lose what they have not saved. Do it only when all is saved, or when the app cannot be quit.",
    "dev.notEjectable": "There is no disk to eject here",
    "dev.inImage": "In the disk image {0}", "dev.appsInImage": "{0} apps in the disk image {1}", "dev.package": "An installer in the disk image {0}",
    "dev.install": "Install in Applications", "dev.update": "Update to {0}", "dev.installThis": "Install {0}", "dev.replace": "Replace the Installed One",
    "dev.hasOlder": "Applications has {0}", "dev.hasNewer": "Applications has a newer one ({0})", "dev.hasSame": "This version is in Applications already",
    "dev.hasSome": "Applications has a copy already", "dev.openApp": "Open the App", "dev.runInstaller": "Open the Installer",
    "dev.installing": "Installing...", "dev.installStopped": "The install was stopped", "dev.installed": "{0} is installed", "dev.installedIn": "In {0}.",
    "dev.installedEjected": "In {0}. The disk image was ejected.", "dev.installedNotEjected": "In {0}. The disk image was not ejected: {1}",
    "dev.launch": "Open {0}", "dev.trashImage": "Move the DMG to the Trash",
    "dev.connected": "{0} connected",
    "dev.appleText": "Browse and copy the photos and videos of the {0} right here, under Devices in the sidebar, or with the apps below. The files of apps are copied in Finder.",
    "dev.cameraText": "It sends pictures over PTP, so it shows as no disk. Browse and copy them right here, or with the apps below.",
    "dev.mtpText": "The phone shares its files over MTP, which macOS cannot read. Set it to transfer photos (PTP) to browse them here or copy them with the app below.",
    "dev.browse": "Browse Files",
  },
});
LZ.icons.add({ iphone: "iphone", ipad: "ipad", camera: "camera", "phone.other": "candybarphone,iphone" });

const Devices = (() => {
  const box = document.createElement("div");
  box.className = "notes";
  box.setAttribute("aria-live", "polite");
  document.body.appendChild(box);
  // key -> { el, key, base (what the note was given), timer }; the oldest first.
  const notes = new Map();
  const MAX = 4;
  // The install jobs that run, by job id, to the key of their note.
  const installs = new Map();
  // The phones and cameras told of in this window: one plugged in every day to charge is told of once.
  const told = new Set();

  const shown = () => S.window.role === "main" && S.settings.notify_devices !== false;
  const iconOf = (path, points = 36) => `lazy://icon/${points * pixelRatio()}/${encodeURIComponent(`path:${path}`)}`;
  const baseName = (path) => String(path).split("/").filter(Boolean).pop() || String(path);
  const imageName = (d) => (d.image ? baseName(d.image) : d.name);
  const folderName = (path) => (path === "/Applications" ? t("applications") : placeLabel(fileUri(path)));
  const nameOf = (path) => Sidebar.volumes().find((v) => v.path === path)?.name || baseName(path);
  const launch = (path) => call("native.open", { uris: [fileUri(path)] }).catch(say);

  // A note: `key` names what it is about, so a newer note of the same thing takes its place. It goes after `life` ms
  // unless the pointer is on it, or stays until closed when `life` is 0 (an eject refused, which waits for an answer).
  function note(key, base) {
    let n = notes.get(key);
    if (!n) {
      const el = document.createElement("div");
      el.className = "note";
      box.prepend(el);
      n = { el, key };
      notes.set(key, n);
      el.addEventListener("mouseenter", () => clearTimeout(n.timer));
      el.addEventListener("mouseleave", () => el.querySelector("button[disabled]") || arm(n));
      while (notes.size > MAX) close(notes.keys().next().value);
    }
    n.base = { symbol: null, img: null, text: "", bad: false, actions: [], rows: [], life: 0, ...base };
    paint(n, n.base);
    arm(n);
    return n;
  }

  function paint(n, o) {
    const head = o.img ? `<img src="${esc(o.img)}" alt="">` : icon(o.symbol);
    const button = (a, attr) => `<button class="push${a.primary ? " primary" : ""}" ${attr}${a.busy ? " disabled" : ""}>${esc(a.label)}</button>`;
    const rows = o.rows.length
      ? `<div class="note-rows">${o.rows
          .map((r, i) => `<div class="note-row"><img src="${esc(r.img)}" alt=""><span>${esc(r.title)}${r.text ? `<small>${esc(r.text)}</small>` : ""}</span>${r.action ? button({ ...r.action, busy: o.busy }, `data-row="${i}"`) : ""}</div>`)
          .join("")}</div>`
      : "";
    const actions = o.actions.length ? `<div class="note-acts">${o.actions.map((a, i) => button({ ...a, busy: o.busy }, `data-act="${i}"`)).join("")}</div>` : "";
    n.el.innerHTML = `<span class="note-ico">${head}</span><b>${esc(o.title)}</b>${o.text ? `<p${o.bad ? ' class="bad"' : ""}>${esc(o.text)}</p>` : ""}${rows}${actions}<button class="note-x" data-close title="${esc(t("dev.close"))}" aria-label="${esc(t("dev.close"))}">${icon("xmark")}</button>`;
    n.el.onclick = (e) => {
      const at = (name) => Number(e.target.closest(`[data-${name}]`)?.dataset[name]);
      if (e.target.closest("[data-close]")) close(n.key);
      else if (e.target.closest("[data-act]")) o.actions[at("act")]?.run();
      else if (e.target.closest("[data-row]")) o.rows[at("row")]?.action?.run();
    };
  }

  function arm(n) {
    clearTimeout(n.timer);
    if (n.base.life) n.timer = setTimeout(() => close(n.key), n.base.life);
  }

  function close(key) {
    const n = notes.get(key);
    if (!n) return;
    notes.delete(key);
    clearTimeout(n.timer);
    n.el.classList.add("leaving");
    setTimeout(() => n.el.remove(), 200);
  }

  // The note waits for what it asked for, its buttons off and a word of what goes on; it stays until that is over, and
  // a failure stays until it is read and closed.
  function busy(key, text) {
    const n = notes.get(key);
    if (!n) return;
    clearTimeout(n.timer);
    paint(n, { ...n.base, busy: true, text: text ?? n.base.text, bad: false });
  }
  function failed(key, error) {
    const n = notes.get(key);
    if (!n) return;
    n.base.life = 0;
    clearTimeout(n.timer);
    paint(n, { ...n.base, text: error, bad: true });
  }

  // Versions as apps write them, part by part, numbers as numbers: 1.10 is after 1.9.
  function compareVersions(a, b) {
    const pa = String(a).split(/[^0-9A-Za-z]+/);
    const pb = String(b).split(/[^0-9A-Za-z]+/);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const x = pa[i] ?? "0";
      const y = pb[i] ?? "0";
      const c = /^\d+$/.test(x) && /^\d+$/.test(y) ? Number(x) - Number(y) : x.localeCompare(y);
      if (c) return Math.sign(c);
    }
    return 0;
  }

  // What a note offers for an app of a disk image, by the version Applications has of it.
  function plan(app) {
    if (app.installed == null) return { text: "", label: t("dev.install"), primary: true };
    if (!app.version || !app.installed) return { text: t("dev.hasSome"), label: t("dev.replace") };
    const order = compareVersions(app.version, app.installed);
    if (order > 0) return { text: t("dev.hasOlder", app.installed), label: t("dev.update", app.version), primary: true };
    if (order < 0) return { text: t("dev.hasNewer", app.installed), label: t("dev.installThis", app.version) };
    return { text: t("dev.hasSame"), label: null };
  }

  const openAction = (d, key) => ({ label: t("dev.open"), run: () => (Panes.focused()?.newTab(d.uri), close(key)) });
  const ejectActions = (d) => (d.ejectable ? [{ label: t("dev.eject"), run: () => eject(d.path, d.name) }] : []);

  function volumeNote(d) {
    const key = `vol:${d.path}`;
    const apps = d.apps || [];
    const packages = d.packages || [];
    const named = (app) => (app.version ? `${app.name} ${app.version}` : app.name);
    if (apps.length === 1) {
      const app = apps[0];
      const p = plan(app);
      const first = p.label ? { label: p.label, primary: p.primary, run: () => install(key, app, true) } : { label: t("dev.openApp"), run: () => launch(app.target) };
      note(key, { img: iconOf(app.path), title: named(app), text: p.text || t("dev.inImage", imageName(d)), actions: [first, openAction(d, key), ...ejectActions(d)], life: 60000 }).volume = d;
    } else if (apps.length > 1) {
      // Each app is installed on its own, and the image stays for the others.
      const rows = apps.map((app) => {
        const p = plan(app);
        return { img: iconOf(app.path, 20), title: named(app), text: p.text, action: p.label ? { label: p.label, primary: p.primary, run: () => install(key, app, false) } : null };
      });
      note(key, { img: iconOf(d.path), title: d.name, text: t("dev.appsInImage", apps.length, imageName(d)), rows, actions: [openAction(d, key), ...ejectActions(d)], life: 60000 }).volume = d;
    } else if (packages.length) {
      const pkg = packages[0];
      const run = { label: t("dev.runInstaller"), primary: true, run: () => call("native.open", { uris: [pkg.uri] }).catch(say) };
      note(key, { img: iconOf(pkg.path), title: pkg.name, text: t("dev.package", imageName(d)), actions: [run, openAction(d, key), ...ejectActions(d)], life: 60000 });
    } else {
      const kind = t(`dev.kind.${d.kind}`);
      const text = d.total > 0 ? t("dev.ready", kind, fmtSize(d.free), fmtSize(d.total)) : kind;
      note(key, { img: iconOf(d.path), title: d.name, text, actions: [{ ...openAction(d, key), primary: true }, ...ejectActions(d)], life: 12000 });
    }
  }

  async function install(key, app, eject) {
    busy(key, t("dev.installing"));
    try {
      const { job } = await call("devices.install", { app: app.path, eject });
      installs.set(job, key);
    } catch (error) {
      failed(key, String(error));
    }
  }

  // Ejects a disk, from its note, the sidebar or Cmd+E. The sidebar dims it meanwhile; a refusal comes as a note, with
  // the apps that hold it when that is why, and a way to force it.
  async function eject(path, name = nameOf(path)) {
    const key = `vol:${path}`;
    const item = [...document.querySelectorAll(".side-item [data-eject]")].find((el) => el.dataset.eject === path)?.closest(".side-item");
    item?.classList.add("ejecting");
    busy(key, t("dev.ejecting"));
    try {
      await call("native.eject", { path });
      close(key);
      Sidebar.loadVolumes();
    } catch (error) {
      item?.classList.remove("ejecting");
      refused(path, name, String(error));
    }
  }

  function refused(path, name, error) {
    note(`vol:${path}`, {
      img: iconOf(path),
      title: t("dev.ejectFailed", name),
      text: error,
      bad: true,
      actions: [
        { label: t("dev.tryAgain"), run: () => eject(path, name) },
        { label: t("dev.forceEject"), run: () => forceEject(path, name) },
      ],
    });
  }

  async function forceEject(path, name) {
    if (!(await LZ.confirm(t("dev.forceTitle", name), t("dev.forceText"), t("dev.forceEject")))) return;
    busy(`vol:${path}`, t("dev.ejecting"));
    call("native.eject", { path, force: true }).then(
      () => {
        close(`vol:${path}`);
        Sidebar.loadVolumes();
      },
      (error) => refused(path, name, String(error)),
    );
  }

  // Tabs on a disk that went go home, as Finder closes the windows of a disk it ejects; on a disk renamed they follow it
  // to its new path.
  function moveTabs(from, to) {
    const under = (uri) => {
      const path = ["file", "search", "archive"].includes(schemeOf(uri)) ? pathOf(uri) : null;
      return path === from || path?.startsWith(`${from}/`) ? path : null;
    };
    for (const pane of Panes.all()) {
      pane.tabs.forEach((tab, i) => {
        const path = under(tab.uri);
        if (path == null) return;
        const uri = to && schemeOf(tab.uri) !== "archive" ? withPath(tab.uri, to + path.slice(from.length)) : S.places.home;
        if (i === pane.active) pane.navigate(uri, { history: false });
        else {
          // A tab in the background lists its new place when it is shown.
          tab.uri = uri;
          tab.requested = false;
        }
      });
    }
    Panes.saveSoon();
  }

  on("volumes.changed", (d) => {
    Sidebar.loadVolumes();
    if (d.kind === "unmounted") {
      close(`vol:${d.path}`);
      moveTabs(d.path, null);
    } else if (d.kind === "renamed") {
      close(`vol:${d.from}`);
      moveTabs(d.from, d.path);
    }
  });
  on("devices.volume", (d) => shown() && volumeNote(d));
  on("devices.device", (d) => {
    const who = `${d.kind}:${d.name}`;
    if (!shown() || told.has(who)) return;
    told.add(who);
    const symbol = d.kind === "apple" ? (/^ipad/i.test(d.name) ? "ipad" : "iphone") : d.kind === "camera" ? "camera" : "phone.other";
    // Browsing it here comes first, except for a phone on MTP, which can only be read once it is set to PTP.
    const key = `dev:${d.id}`;
    const browse = d.uri ? [{ label: t("dev.browse"), run: () => (Panes.focused()?.newTab(d.uri), close(key)) }] : [];
    const helpers = (d.helpers || []).map((h) => ({ label: h.name, run: () => call("devices.open_app", { app: h.id }).catch(say) }));
    const actions = d.kind === "mtp" ? [...helpers, ...browse] : [...browse, ...helpers];
    if (actions[0]) actions[0].primary = true;
    note(key, { symbol, title: t("dev.connected", d.name), text: t(`dev.${d.kind}Text`, d.name), actions, life: 20000 });
  });
  on("devices.removed", (d) => close(`dev:${d.id}`));

  on("devices.installed", (d) => {
    const volumeKey = d.volume ? `vol:${d.volume}` : null;
    const image = volumeKey && notes.get(volumeKey)?.volume;
    // An image with other apps stays, its row of this one now installed.
    if (image && !d.ejected && image.apps.length > 1) {
      for (const app of image.apps) if (app.target === d.path) app.installed = app.version || "";
      volumeNote(image);
    } else if (volumeKey) close(volumeKey);
    const where = folderName(d.folder);
    const text = d.ejected ? t("dev.installedEjected", where) : d.ejectError ? t("dev.installedNotEjected", where, d.ejectError) : t("dev.installedIn", where);
    const key = `app:${d.path}`;
    const actions = [{ label: t("dev.launch", d.name), primary: true, run: () => (launch(d.path), close(key)) }];
    if (d.image) actions.push({ label: t("dev.trashImage"), run: () => call("fs.trash", { uris: [fileUri(d.image)] }).then(() => close(key), say) });
    note(key, { img: iconOf(d.path), title: t("dev.installed", d.name), text, actions, life: 30000 });
  });
  on("jobs.finished", (d) => {
    const key = installs.get(d.id);
    if (key == null) return;
    installs.delete(d.id);
    if (!d.ok) failed(key, d.cancelled ? t("dev.installStopped") : d.error);
  });

  // Eject (Cmd+E, the File menu): the disks selected, as Finder does, else the disk of the place the pane shows.
  Panes.actions.eject = (pane) => {
    const disks = Sidebar.volumes().filter((v) => v.ejectable);
    const chosen = pane.tab.selectedEntries().flatMap((e) => disks.filter((v) => isLocal(e.uri) && pathOf(e.uri) === v.path));
    const here = isLocal(pane.tab.uri) ? pathOf(pane.tab.uri) : "";
    const holding = disks.filter((v) => here === v.path || here.startsWith(`${v.path}/`)).sort((a, b) => b.path.length - a.path.length);
    const targets = chosen.length ? chosen : holding.slice(0, 1);
    if (!targets.length) return toast(t("dev.notEjectable"));
    for (const v of targets) eject(v.path, v.name);
  };
  Keys.add({ "Cmd+E": "eject" }, "mac");

  return { eject, note, close, compareVersions, plan };
})();
</script>
<style>
/* A phone or camera in the sidebar that cannot be read yet (MTP, or not recognised) is drawn fainter; a click still
   opens it, to say why. */
.side-item.dim .label, .side-item.dim .ico { opacity: 0.55; }

<script>
// Phones and cameras as places (src/features/phones.rs): a Devices section under the disks lists each one for as long
// as it is plugged in, those plugged in before the app started too, and a click opens it in the pane as device://,
// its folders and files as Image Capture reads them. A pane on a device lists again once the device has read its whole
// catalog, or is unlocked; one on a device that was unplugged goes home, as a tab on an ejected disk does.
LZ.words({
  vi: {
    "ph.devices": "Thiết bị", "ph.opening": "Đang mở...", "ph.reading": "Đang đọc danh sách tệp ({0}%)", "ph.ready": "Sẵn sàng",
    "ph.locked": "Đang khóa hoặc chưa tin cậy máy Mac này", "ph.failed": "Không mở được", "ph.mtp": "Chia sẻ qua MTP, macOS không đọc được",
    "ph.waiting": "Đang chờ Image Capture nhận ra", "ph.closed": "Bấm để xem tệp", "ph.device": "Thiết bị",
  },
  en: {
    "ph.devices": "Devices", "ph.opening": "Opening...", "ph.reading": "Reading the list of files ({0}%)", "ph.ready": "Ready",
    "ph.locked": "Locked, or does not trust this Mac yet", "ph.failed": "Could not be opened", "ph.mtp": "Shares over MTP, which macOS cannot read",
    "ph.waiting": "Waiting for Image Capture to recognise it", "ph.closed": "Click to see its files", "ph.device": "Device",
  },
});

const Phones = (() => {
  const SCHEME = "device";
  let phones = [];
  const byKey = (key) => phones.find((p) => p.key === key);
  const onDevice = (uri) => schemeOf(uri) === SCHEME;
  const symbolOf = (p) => (p.kind === "apple" ? (/^ipad/i.test(p.name) ? "ipad" : "iphone") : p.kind === "camera" ? "camera" : "phone.other");

  // A device's place is named after the device at its top, then by its folders.
  const rootName = (uri) => byKey(authorityOf(uri))?.name || t("ph.device");
  placeNames[SCHEME] = (uri) => (pathOf(uri) === "/" ? rootName(uri) : nameOf(uri));
  placeCrumbs[SCHEME] = (uri) => {
    const items = [[withPath(uri, "/"), rootName(uri), null]];
    let at = "";
    for (const part of pathOf(uri).split("/").filter(Boolean)) items.push([withPath(uri, (at = `${at}/${part}`)), part, null]);
    return items;
  };

  // What a device is up to, as its tooltip says.
  function status(p) {
    if (!p.readable) return t(p.kind === "mtp" ? "ph.mtp" : "ph.waiting");
    if (p.state === "reading") return t("ph.reading", p.percent);
    return t({ opening: "ph.opening", ready: "ph.ready", locked: "ph.locked", failed: "ph.failed" }[p.state] || "ph.closed");
  }

  const section = LZ.sidebar.section({
    id: "phones",
    render(el) {
      if (S.window.role !== "main" || !phones.length) {
        el.innerHTML = "";
        return;
      }
      el.innerHTML =
        `<div class="side-head"><span>${LZ.esc(t("ph.devices"))}</span></div>` +
        phones
          .map((p) => {
            const symbol = symbolOf(p);
            const count = p.state === "reading" ? `${p.percent}%` : "";
            return `<button class="side-item${p.readable ? "" : " dim"}" data-uri="${LZ.esc(p.uri)}" title="${LZ.esc(`${p.name}: ${status(p)}`)}"><span class="ico" data-ico="${symbol}">${icon(symbol)}</span><span class="label">${LZ.esc(p.name)}</span><span class="side-count">${count}</span></button>`;
          })
          .join("");
      Sidebar.mark();
    },
  });
  // Under the disks, where Finder lists the devices it sees.
  $("sideLocations").after(section.el);
  LZ.on("settings.changed", section.refresh);

  // Every pane showing a place on the device `key`, with each tab of it.
  function each(key, fn) {
    for (const pane of Panes.all()) pane.tabs.forEach((tab, i) => onDevice(tab.uri) && authorityOf(tab.uri) === key && fn(pane, tab, i));
  }

  function set(list) {
    const before = new Map(phones.map((p) => [p.key, p]));
    phones = Array.isArray(list) ? list : [];
    section.refresh();
    const now = new Map(phones.map((p) => [p.key, p]));
    for (const [key, was] of before) {
      const p = now.get(key);
      if (!p) {
        // Unplugged: its tabs go home.
        each(key, (pane, tab, i) => {
          if (i === pane.active) pane.navigate(S.places.home, { history: false });
          else {
            tab.uri = S.places.home;
            tab.requested = false;
          }
        });
        continue;
      }
      // Found by Image Capture, unlocked, or stopped: what its panes said may be out of date.
      const moved = p.readable !== was.readable || (p.state !== was.state && ["locked", "failed", "ready"].some((s) => s === p.state || s === was.state));
      if (moved) each(key, (pane, tab, i) => i === pane.active && pane.refresh());
      if (p.name !== was.name) each(key, (pane, tab, i) => i === pane.active && pane.renderPath());
    }
    Panes.saveSoon();
  }

  LZ.on("devices.phones", set);
  // The files of a device changed or were all read; its panes list again, once for a burst of changes.
  const pending = new Map();
  LZ.on("devices.files", (d) => {
    clearTimeout(pending.get(d.key));
    pending.set(
      d.key,
      setTimeout(() => {
        pending.delete(d.key);
        each(d.key, (pane, tab, i) => i === pane.active && pane.refresh());
      }, 400),
    );
  });
  LZ.on("app.hello", () => LZ.call("devices.phones").then(set).catch(() => {}));

  return { list: () => phones, symbolOf };
})();
</script>

<script>
// The side preview (W4), on the right of the panes or under them: the selected item of the focused pane as a picture,
// a film or a sound that plays, a PDF, text that can be edited and saved, or its Quick Look thumbnail, with what it
// is, its size and dates, and for a film its size, frame rate, data rate and length.
LZ.words({
  vi: {
    preview: "Xem trước", previewToggle: "Bật hoặc tắt khung xem trước", moveBottom: "Đặt khung xem trước bên dưới", moveRight: "Đặt khung xem trước bên phải",
    "pv.kind": "Loại", "pv.size": "Kích thước", "pv.created": "Ngày tạo", "pv.modified": "Ngày sửa đổi", "pv.dims": "Kích thước ảnh", "pv.duration": "Thời lượng",
    "pv.fps": "Tốc độ khung hình", "pv.rate": "Tốc độ dữ liệu", "pv.audio": "Âm thanh", "pv.items": "Số mục", save: "Lưu", saved: "Đã lưu",
    truncated: "Tệp lớn hơn 1 MB: chỉ hiện phần đầu và không sửa được.", dropChanges: "Bỏ thay đổi", nothing: "Chọn một mục để xem trước", many: "Đã chọn {0} mục", unsaved: "Có thay đổi chưa lưu",
  },
  en: {
    preview: "Preview", previewToggle: "Show or hide the preview", moveBottom: "Put the preview below", moveRight: "Put the preview on the right",
    "pv.kind": "Kind", "pv.size": "Size", "pv.created": "Created", "pv.modified": "Modified", "pv.dims": "Dimensions", "pv.duration": "Duration",
    "pv.fps": "Frame rate", "pv.rate": "Data rate", "pv.audio": "Audio", "pv.items": "Items", save: "Save", saved: "Saved",
    truncated: "The file is larger than 1 MB: only its start is shown, and it cannot be edited.", dropChanges: "Drop Changes", nothing: "Select an item to preview it", many: "{0} items selected", unsaved: "Unsaved changes",
  },
});
LZ.icons.add({
  "sidebar.right": "sidebar.right",
  "panel.bottom": "rectangle.bottomthird.inset.filled,rectangle.bottomhalf.inset.filled",
});

const Preview = (() => {
  const slot = document.querySelector('[data-slot="preview"]');
  const workspace = document.querySelector(".workspace");
  const el = document.createElement("div");
  el.className = "preview";
  el.innerHTML = `<div class="pv-grip"></div><div class="pv-head"><span class="pv-title"></span><button class="mini pv-side"></button></div><div class="pv-body"></div>`;
  slot.appendChild(el);
  const body = el.querySelector(".pv-body");
  const title = el.querySelector(".pv-title");
  let shown = null;
  let timer = 0;
  let text = null;

  const on = () => !!S.settings.preview?.on;
  const side = () => (S.settings.preview?.side === "bottom" ? "bottom" : "right");
  const fileUrl = (uri) => `lazy://file/${encodeURIComponent(pathOf(uri))}`;
  const duration = (s) => {
    const t = Math.round(s);
    const h = Math.floor(t / 3600);
    const m = Math.floor((t % 3600) / 60);
    const sec = String(t % 60).padStart(2, "0");
    return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
  };
  const rate = (bits) => (bits >= 1e6 ? `${(bits / 1e6).toLocaleString(locale(), { maximumFractionDigits: 1 })} Mbit/s` : `${Math.round(bits / 1e3)} kbit/s`);

  function apply() {
    slot.hidden = !on();
    workspace.classList.toggle("preview-bottom", side() === "bottom");
    const b = el.querySelector(".pv-side");
    b.innerHTML = icon(side() === "bottom" ? "sidebar.right" : "panel.bottom");
    b.title = t(side() === "bottom" ? "moveRight" : "moveBottom");
    $("tb-preview")?.classList.toggle("on", on());
    if (on()) update(true);
  }

  function rows(list) {
    return `<div class="pv-info">${list
      .filter(([, value]) => value != null && value !== "")
      .map(([label, value]) => `<span>${LZ.esc(t(label))}</span><b>${LZ.esc(value)}</b>`)
      .join("")}</div>`;
  }

  // The selected item of the focused pane, or the folder itself when nothing is selected.
  function update(force = false) {
    if (!on()) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const pane = Panes.focused();
      const tab = pane?.tab;
      if (!tab) return;
      const n = tab.selCount();
      if (n > 1) {
        shown = null;
        title.textContent = t("many", n);
        body.innerHTML = `<div class="pv-empty">${LZ.esc(t("many", n))}</div>`;
        return;
      }
      const entry = n === 1 ? tab.rows.get(tab.lead) || tab.selectedEntries()[0] : null;
      const uri = entry ? entry.uri : tab.uri;
      if (!uri || (!force && shown === uri)) return;
      // Text with changes not saved stays until it is saved or its changes are dropped.
      if (text?.dirty) return;
      shown = uri;
      text = null;
      title.textContent = entry ? entry.name : placeName(uri);
      body.innerHTML = entry ? `<div class="pv-media"><img class="pv-icon" src="${iconUrl(entry, 128)}" alt=""></div>` : "";
      LZ.call("preview.info", { uri }).catch(() => {});
    }, 90);
  }

  LZ.on("preview.ready", (d) => {
    if (d.uri !== shown) return;
    if (d.error) {
      body.innerHTML = `<div class="pv-empty">${LZ.esc(d.error)}</div>`;
      return;
    }
    const e = d.entry;
    const common = [
      ["pv.kind", d.type || e.type || ""],
      ["pv.size", d.kind === "folder" ? null : fmtSize(e.size)],
      ["pv.items", d.kind === "folder" && d.items != null ? String(d.items) : null],
      ["pv.created", fmtDate(e.ctime)],
      ["pv.modified", fmtDate(e.mtime)],
    ];
    // An item inside an archive is shown from its copy on this Mac.
    const src = fileUrl(d.local || d.uri);
    let media = "";
    const extra = [];
    if (d.kind === "image") {
      media = `<img class="pv-picture" src="${src}" alt="">`;
    } else if (d.kind === "video") {
      media = `<video class="pv-video" src="${src}" controls preload="metadata"></video>`;
      const v = d.media?.video;
      if (v) extra.push(["pv.dims", `${v.width} × ${v.height}`], ["pv.fps", `${v.fps} fps`], ["pv.rate", rate(v.dataRate)]);
      if (d.media?.duration) extra.push(["pv.duration", duration(d.media.duration)]);
      if (d.media?.audio) extra.push(["pv.audio", rate(d.media.audio.dataRate)]);
    } else if (d.kind === "audio") {
      media = `<img class="pv-icon" src="${iconUrl(e, 128)}" alt=""><audio class="pv-audio" src="${src}" controls preload="metadata"></audio>`;
      if (d.media?.duration) extra.push(["pv.duration", duration(d.media.duration)]);
      if (d.media?.audio) extra.push(["pv.rate", rate(d.media.audio.dataRate)]);
    } else if (d.kind === "pdf") {
      media = `<embed class="pv-pdf" src="${src}" type="application/pdf">`;
    } else if (d.kind === "text") {
      media = `<div class="pv-textwrap"><textarea class="pv-text" spellcheck="false" readonly></textarea><div class="pv-textbar"><span class="pv-note"></span><span><button class="push pv-drop" hidden>${LZ.esc(t("dropChanges"))}</button> <button class="push primary pv-save" hidden>${LZ.esc(t("save"))}</button></span></div></div>`;
    } else if (d.kind === "folder") {
      media = `<img class="pv-icon" src="${iconUrl(e, 128)}" alt="">`;
    } else {
      const thumb = `lazy://thumb/${512 * pixelRatio()}/${encodeURIComponent(pathOf(d.local || d.uri))}`;
      media = thumbImg(thumb, iconUrl(e, 128), "pv-thumb", "pv-icon");
    }
    body.innerHTML = `<div class="pv-media ${d.kind}">${media}</div>${rows([...common, ...extra])}`;
    if (d.kind === "image") {
      const img = body.querySelector(".pv-picture");
      img.addEventListener("load", () => {
        const info = body.querySelector(".pv-info");
        info.insertAdjacentHTML("beforeend", `<span>${LZ.esc(t("pv.dims"))}</span><b>${img.naturalWidth} × ${img.naturalHeight}</b>`);
      });
    }
    if (d.kind === "text") loadText(d, e);
  });

  // Text is read through the app; a small file of a folder that can be written is editable, and saved only if the
  // file did not change elsewhere since it was read.
  function loadText(d, e) {
    const area = body.querySelector(".pv-text");
    const save = body.querySelector(".pv-save");
    const note = body.querySelector(".pv-note");
    const writable = d.editable && Panes.focused()?.tab.capabilities.write;
    LZ.call("fs.read_text", { uri: d.uri, max: 1048576 })
      .then((r) => {
        if (shown !== d.uri) return;
        area.value = r.text;
        area.readOnly = !writable || r.truncated;
        note.textContent = r.truncated ? t("truncated") : "";
        text = { uri: d.uri, mtime: r.mtime, dirty: false };
      })
      .catch((error) => (note.textContent = String(error)));
    const drop = body.querySelector(".pv-drop");
    area.addEventListener("input", () => {
      if (!text) return;
      text.dirty = true;
      save.hidden = drop.hidden = false;
      note.textContent = t("unsaved");
    });
    drop.addEventListener("click", () => {
      text = null;
      update(true);
    });
    const doSave = () => {
      if (!text?.dirty) return;
      LZ.call("fs.write_text", { uri: text.uri, text: area.value, mtime: text.mtime })
        .then((entry) => {
          text = { ...text, mtime: entry.mtime, dirty: false };
          save.hidden = drop.hidden = true;
          note.textContent = t("saved");
        })
        .catch(LZ.say);
    };
    save.addEventListener("click", doSave);
    area.addEventListener("keydown", (ev) => {
      if (ev.key === "s" && ev.metaKey) {
        ev.preventDefault();
        doSave();
      }
    });
  }

  function toggle() {
    setSetting({ preview: { on: !on() } });
  }

  el.querySelector(".pv-side").addEventListener("click", () => setSetting({ preview: { side: side() === "bottom" ? "right" : "bottom" } }));
  // The preview's width (or height below the panes) follows a drag of its edge.
  el.querySelector(".pv-grip").addEventListener("mousedown", (e) => {
    e.preventDefault();
    const bottom = side() === "bottom";
    const start = bottom ? e.clientY : e.clientX;
    const size = bottom ? slot.getBoundingClientRect().height : slot.getBoundingClientRect().width;
    const move = (m) => {
      const value = Math.min(bottom ? 600 : 720, Math.max(bottom ? 140 : 220, size - ((bottom ? m.clientY : m.clientX) - start)));
      slot.style.setProperty(bottom ? "--pv-h" : "--pv-w", `${value}px`);
    };
    const up = () => {
      removeEventListener("mousemove", move);
      removeEventListener("mouseup", up);
    };
    addEventListener("mousemove", move);
    addEventListener("mouseup", up);
  });

  LZ.toolbar.add({ id: "preview", side: "right", icon: "sidebar.right", label: "previewToggle", run: toggle });
  Panes.actions.togglePreview = toggle;
  Keys.add({ "Cmd+Shift+P": "togglePreview" });
  Panes.on("selection", () => update());
  LZ.on("view.changed", () => update(true));
  LZ.on("settings.changed", apply);
  LZ.on("app.hello", apply);
  return { update, toggle };
})();
</script>

<script>
// Advanced batch rename (W5): a sheet with rules applied in order and a live preview of the new names; names that
// would collide are marked and keep the Rename button off. The rules stay for the next batch of the session.
LZ.words({
  vi: {
    batchRename: "Đổi tên hàng loạt", batchTitle: "Đổi tên {0} mục", addRule: "Thêm quy tắc", doRename: "Đổi tên",

    newExt: "Đuôi mới (để trống là giữ nguyên)", keepCase: "Giữ nguyên", previewSummary: "{0} mục đổi tên, {1} lỗi", moveUp: "Lên", moveDown: "Xuống", removeRule: "Bỏ quy tắc",
  },
  en: {
    batchRename: "Batch Rename", batchTitle: "Rename {0} Items", addRule: "Add Rule", doRename: "Rename",
    "r.replace": "Replace", "r.insert": "Insert", "r.remove": "Remove Characters", "r.number": "Number", "r.parent": "Folder Name", "r.case": "Case", "r.ext": "Extension",
    find: "Find", replaceWith: "Replace with", regex: "Regex", ignoreCase: "Ignore case", scopeName: "Name", scopeExt: "Extension", scopeAll: "Name and extension",
    text: "Text", atStart: "At start", atEnd: "At end", atIndex: "At position", position: "Position", count: "Characters", fromEnd: "From the end",
    start: "Start", step: "Step", digits: "Digits", separator: "Separator", lower: "lower case", upper: "UPPER CASE", title: "Title Case", sentence: "Sentence case",
    newExt: "New extension (empty keeps it)", keepCase: "Keep", previewSummary: "{0} renamed, {1} problems", moveUp: "Up", moveDown: "Down", removeRule: "Remove Rule",
  },
});

const BatchRename = (() => {
  const TYPES = ["replace", "insert", "remove", "number", "parent", "case", "ext"];
  const DEFAULTS = {
    replace: { find: "", with: "", regex: false, caseInsensitive: false, scope: "name" },
    insert: { text: "", at: "end", index: 0 },
    remove: { from: 0, count: 1, fromEnd: false },
    number: { start: 1, step: 1, pad: 2, at: "end", sep: " " },
    parent: { at: "start", sep: " " },
    case: { mode: "lower" },
    ext: { set: null, case: null },
  };
  let rules = [{ type: "replace", ...DEFAULTS.replace }];
  let target = null;
  let timer = 0;
  let canApply = false;

  const panel = LZ.sheet.create("renameSheet");
  panel.classList.add("rename-panel");
  panel.innerHTML = `
    <h2 class="rename-title"></h2>
    <div class="rules"></div>
    <div class="rule-add"><button class="push" data-act="add"></button></div>
    <div class="rename-summary"></div>
    <div class="rename-preview"></div>
    <div class="buttons"><button class="push" data-act="cancel" data-t="cancel"></button><button class="push primary" data-act="apply" data-t="doRename"></button></div>`;
  const list = panel.querySelector(".rules");
  const preview = panel.querySelector(".rename-preview");
  const summary = panel.querySelector(".rename-summary");

  const opt = (value, label, current) => `<option value="${value}"${String(current) === String(value) ? " selected" : ""}>${LZ.esc(t(label))}</option>`;
  const num = (key, value, label, min = 0) => `<label class="field-l"><span>${LZ.esc(t(label))}</span><input type="number" data-k="${key}" value="${value}" min="${min}"></label>`;
  const txt = (key, value, label, wide = false) => `<label class="field-l${wide ? " wide" : ""}"><span>${LZ.esc(t(label))}</span><input type="text" data-k="${key}" value="${LZ.esc(value ?? "")}" spellcheck="false"></label>`;
  const chk = (key, value, label) => `<label class="check"><input type="checkbox" data-k="${key}"${value ? " checked" : ""}> ${LZ.esc(t(label))}</label>`;
  const at = (rule) => `<select data-k="at">${opt("start", "atStart", rule.at)}${opt("end", "atEnd", rule.at)}${opt("index", "atIndex", rule.at)}</select>`;

  function fields(rule) {
    switch (rule.type) {
      case "replace":
        return txt("find", rule.find, "find", true) + txt("with", rule.with, "replaceWith", true) + chk("regex", rule.regex, "regex") + chk("caseInsensitive", rule.caseInsensitive, "ignoreCase") +
          `<select data-k="scope">${opt("name", "scopeName", rule.scope)}${opt("ext", "scopeExt", rule.scope)}${opt("all", "scopeAll", rule.scope)}</select>`;
      case "insert":
        return txt("text", rule.text, "text", true) + at(rule) + (rule.at === "index" ? num("index", rule.index, "position") : "");
      case "remove":
        return num("count", rule.count, "count", 1) + num("from", rule.from, "position") + chk("fromEnd", rule.fromEnd, "fromEnd");
      case "number":
        return num("start", rule.start, "start", -999999) + num("step", rule.step, "step", -9999) + num("pad", rule.pad, "digits") + at(rule) + (rule.at === "index" ? num("index", rule.index ?? 0, "position") : "") + txt("sep", rule.sep, "separator");
      case "parent":
        return `<select data-k="at">${opt("start", "atStart", rule.at)}${opt("end", "atEnd", rule.at)}</select>` + txt("sep", rule.sep, "separator");
      case "case":
        return `<select data-k="mode">${["lower", "upper", "title", "sentence"].map((m) => opt(m, m, rule.mode)).join("")}</select>`;
      case "ext":
        return txt("set", rule.set, "newExt", true) + `<select data-k="case">${opt("", "keepCase", rule.case ?? "")}${opt("lower", "lower", rule.case)}${opt("upper", "upper", rule.case)}</select>`;
    }
    return "";
  }

  function render() {
    list.innerHTML = rules
      .map(
        (rule, i) => `<div class="rule" data-i="${i}">
          <select data-k="type">${TYPES.map((type) => opt(type, `r.${type}`, rule.type)).join("")}</select>
          <div class="rule-fields">${fields(rule)}</div>
          <div class="rule-tools">
            <button class="mini" data-act="up" title="${LZ.esc(t("moveUp"))}"${i === 0 ? " disabled" : ""}>${icon("chevron.up")}</button>
            <button class="mini" data-act="down" title="${LZ.esc(t("moveDown"))}"${i === rules.length - 1 ? " disabled" : ""}>${icon("chevron.down")}</button>
            <button class="mini" data-act="drop" title="${LZ.esc(t("removeRule"))}">${icon("xmark")}</button>
          </div>
        </div>`,
      )
      .join("");
    panel.querySelector('[data-act="add"]').textContent = `+ ${t("addRule")}`;
  }

  // The rules as the app takes them: empty strings of the extension rule mean "keep".
  const payload = () =>
    rules.map((r) => {
      const out = { ...r };
      if (r.type === "ext") {
        out.set = r.set === null || r.set === undefined || r.set === "" ? null : r.set;
        out.case = r.case || null;
      }
      return out;
    });

  function refresh() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!target) return;
      LZ.call("rename.preview", { ...target, rules: payload() })
        .then((d) => {
          canApply = d.problems === 0 && d.changed > 0;
          panel.querySelector('[data-act="apply"]').disabled = !canApply;
          summary.textContent = t("previewSummary", d.changed, d.problems);
          summary.classList.toggle("bad", d.problems > 0);
          preview.innerHTML = d.rows
            .map((r) => `<div class="pr${r.problem ? " bad" : ""}${r.to !== r.from ? " changed" : ""}"><span>${LZ.esc(r.from)}</span><i>${icon("chevron.right")}</i><span title="${LZ.esc(r.problem || "")}">${LZ.esc(r.to)}</span></div>`)
            .join("");
        })
        .catch((error) => {
          canApply = false;
          panel.querySelector('[data-act="apply"]').disabled = true;
          summary.textContent = String(error);
          summary.classList.add("bad");
        });
    }, 120);
  }

  list.addEventListener("input", (e) => {
    const row = e.target.closest(".rule");
    const key = e.target.dataset.k;
    if (!row || !key) return;
    const i = Number(row.dataset.i);
    const el = e.target;
    if (key === "type") {
      rules[i] = { type: el.value, ...DEFAULTS[el.value] };
      render();
    } else {
      rules[i][key] = el.type === "checkbox" ? el.checked : el.type === "number" ? Number(el.value) || 0 : el.value;
      if (key === "at") render();
    }
    refresh();
  });
  panel.addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    const i = Number(e.target.closest(".rule")?.dataset.i);
    if (act === "add") {
      rules.push({ type: "number", ...DEFAULTS.number });
      render();
      refresh();
    } else if (act === "up" || act === "down") {
      const j = act === "up" ? i - 1 : i + 1;
      [rules[i], rules[j]] = [rules[j], rules[i]];
      render();
      refresh();
    } else if (act === "drop") {
      rules.splice(i, 1);
      if (!rules.length) rules.push({ type: "replace", ...DEFAULTS.replace });
      render();
      refresh();
    } else if (act === "cancel") LZ.sheet.close();
    else if (act === "apply" && canApply) {
      LZ.call("rename.apply", { ...target, rules: payload() }).then(() => LZ.sheet.close(), LZ.say);
    }
  });

  function open(pane) {
    const tab = pane.tab;
    if (!tab.selCount() || !isLocal(tab.uri)) return;
    target = tab.selection();
    panel.querySelector(".rename-title").textContent = t("batchTitle", tab.selCount());
    render();
    preview.innerHTML = "";
    summary.textContent = "";
    LZ.sheet.open("renameSheet");
    refresh();
    setTimeout(() => list.querySelector('input[type="text"]')?.focus(), 30);
  }

  // Return renames, as the default button of a Mac dialog does.
  list.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.target.tagName !== "INPUT") return;
    e.preventDefault();
    clearTimeout(timer);
    LZ.call("rename.preview", { ...target, rules: payload() })
      .then((d) => {
        if (d.problems === 0 && d.changed > 0) return LZ.call("rename.apply", { ...target, rules: payload() }).then(() => LZ.sheet.close());
        refresh();
      })
      .catch(LZ.say);
  });

  Panes.actions.batchRename = open;
  Keys.add({ "Cmd+Alt+R": "batchRename" });
  LZ.menu.add({ id: "batchRename", label: "batchRename", icon: "pencil.and.list.clipboard", group: 20, order: 2.5, action: "batchRename", when: (c) => c.count > 1 && c.tab.capabilities.rename && isLocal(c.tab.uri), run: (c) => open(c.pane) });
  return { open };
})();
</script>
