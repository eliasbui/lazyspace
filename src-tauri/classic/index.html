<script>
// The Enhanced Archiver (W6): an archive opens as a folder (read only), "Extract Here" and "Extract To" take it out
// beside it or anywhere, items inside it are extracted where you choose, and "Compress" makes a zip, 7z or tar archive,
// with a password and split volumes where the format allows. An archive that wants a password asks for it.
LZ.words({
  vi: {
    extractHere: "Giải nén tại đây", extractTo: "Giải nén vào...", extractSelected: "Giải nén mục đã chọn vào...", compress: "Nén...", compressTitle: "Nén {0} mục",
    archiveName: "Tên", archiveFormat: "Định dạng", archivePassword: "Mật khẩu (không bắt buộc)", archivePasswordAgain: "Nhập lại mật khẩu", archiveLevel: "Mức nén",
    levelFast: "Nhanh", levelNormal: "Bình thường", levelBest: "Nhỏ nhất", splitVolumes: "Chia nhỏ", splitNone: "Không chia", passwordMismatch: "Hai mật khẩu không khớp",
    passwordOnlyZip7z: "Chỉ zip và 7z đặt được mật khẩu", chooseExtractFolder: "Chọn thư mục để giải nén", archivePasswordTitle: "Tệp nén có mật khẩu", doCompress: "Nén",
  },
  en: {
    extractHere: "Extract Here", extractTo: "Extract To...", extractSelected: "Extract Selected Items To...", compress: "Compress...", compressTitle: "Compress {0} Items",
    archiveName: "Name", archiveFormat: "Format", archivePassword: "Password (optional)", archivePasswordAgain: "Password again", archiveLevel: "Compression",
    levelFast: "Fast", levelNormal: "Normal", levelBest: "Smallest", splitVolumes: "Split", splitNone: "Do not split", passwordMismatch: "The two passwords differ",
    passwordOnlyZip7z: "Only zip and 7z take a password", chooseExtractFolder: "Choose a folder to extract into", archivePasswordTitle: "This archive has a password", doCompress: "Compress",
  },
});

const Archiver = (() => {
  const EXT = /\.(zip|7z|rar|tar|tgz|gz|tbz2?|bz2|txz|xz|lzma|tlz|iso|cab|cpio|xar|lha|lzh|jar|war|apk|ipa|cbz|cbr|z)$/i;
  const isArchive = (e) => e && e.kind === "file" && isLocal(e.uri) && EXT.test(e.name);

  // The top of an archive is called by the archive's name, without the "!" its address ends in.
  placeNames.archive = (uri) => nameOf(uri).replace(/!$/, "");

  // An archive opens as a folder.
  LZ.vfs.opener((entry) => (isArchive(entry) ? archiveUri(pathOf(entry.uri), "") : null));

  const chooseFolder = () => LZ.call("settings.choose_folder", { prompt: t("chooseExtractFolder") }).then((path) => (path ? fileUri(path) : null));

  function extract(ctx, to) {
    const uris = ctx.entries.filter(isArchive).map((e) => e.uri);
    if (uris.length) LZ.call("archive.extract", { uris, to }).catch(LZ.say);
  }

  // The compress sheet.
  const panel = LZ.sheet.create("compressSheet", { small: true });
  panel.innerHTML = `
    <h2 class="cz-title"></h2>
    <div class="cz-grid">
      <label data-t="archiveName"></label><input class="cz-name" spellcheck="false">
      <label data-t="archiveFormat"></label><select class="cz-format"><option>zip</option><option>7z</option><option>tar.gz</option><option>tar.xz</option><option>tar.bz2</option></select>
      <label data-t="archiveLevel"></label><select class="cz-level"><option value="1" data-t="levelFast"></option><option value="5" selected data-t="levelNormal"></option><option value="9" data-t="levelBest"></option></select>
      <label data-t="archivePassword"></label><input class="cz-pw" type="password">
      <label data-t="archivePasswordAgain"></label><input class="cz-pw2" type="password">
      <label data-t="splitVolumes"></label><select class="cz-split"><option value="0" data-t="splitNone"></option><option value="100">100 MB</option><option value="700">700 MB</option><option value="1024">1 GB</option><option value="4096">4 GB</option></select>
    </div>
    <div class="cz-note"></div>
    <div class="buttons"><button class="push" data-cz="cancel" data-t="cancel"></button><button class="push primary" data-cz="go" data-t="doCompress"></button></div>`;
  let target = null;
  const q = (s) => panel.querySelector(s);

  function paintFormat() {
    const passworded = ["zip", "7z"].includes(q(".cz-format").value);
    for (const el of [q(".cz-pw"), q(".cz-pw2")]) el.disabled = !passworded;
    q(".cz-split").disabled = !passworded;
  }
  q(".cz-format").addEventListener("change", paintFormat);

  function compress(ctx) {
    const entries = ctx.entries.filter((e) => isLocal(e.uri));
    if (!entries.length) return;
    target = ctx.tab.selection();
    q(".cz-title").textContent = t("compressTitle", ctx.count);
    q(".cz-name").value = entries.length === 1 ? entries[0].name.replace(/\.[^.]+$/, "") || entries[0].name : "";
    q(".cz-pw").value = q(".cz-pw2").value = "";
    q(".cz-note").textContent = "";
    paintFormat();
    LZ.sheet.open("compressSheet");
    setTimeout(() => q(".cz-name").select(), 30);
  }

  panel.addEventListener("click", (e) => {
    const act = e.target.closest("[data-cz]")?.dataset.cz;
    if (act === "cancel") return LZ.sheet.close();
    if (act !== "go") return;
    const password = q(".cz-pw").value;
    if (password && password !== q(".cz-pw2").value) return (q(".cz-note").textContent = t("passwordMismatch"));
    LZ.call("archive.create", {
      ...target,
      format: q(".cz-format").value,
      name: q(".cz-name").value.trim() || null,
      password: password || null,
      level: Number(q(".cz-level").value),
      splitMb: Number(q(".cz-split").value),
    })
      .then(() => LZ.sheet.close())
      .catch((error) => (q(".cz-note").textContent = String(error)));
  });

  // A folder of an archive that wants a password: ask, then list it again.
  LZ.on("view.error", async (d) => {
    if (!String(d.error).startsWith("LZ-PASSWORD:")) return;
    const found = Panes.findTab(d.view);
    if (!found) return;
    const [pane, tab] = found;
    if (!tab.uri?.startsWith("archive://")) return;
    const password = await LZ.prompt(t("archivePasswordTitle"), { text: String(d.error).replace(/^LZ-PASSWORD:/, ""), secret: true });
    if (password == null) return;
    LZ.call("archive.password", { uri: tab.uri, password })
      .then(() => pane.refresh())
      .catch(LZ.say);
  });

  const local = (c) => isLocal(c.tab.uri);
  LZ.menu.add({ id: "extractHere", label: "extractHere", icon: "archivebox", group: 45, order: 1, when: (c) => c.count > 0 && c.entries.some(isArchive), run: (c) => extract(c, null) });
  LZ.menu.add({
    id: "extractTo",
    label: "extractTo",
    icon: "archivebox.circle",
    group: 45,
    order: 2,
    when: (c) => c.count > 0 && c.entries.some(isArchive),
    run: async (c) => {
      const to = await chooseFolder();
      if (to) extract(c, to);
    },
  });
  LZ.menu.add({ id: "compress", label: "compress", icon: "shippingbox", group: 45, order: 3, when: (c) => c.count > 0 && local(c), run: compress });
  LZ.menu.add({
    id: "extractSelected",
    label: "extractSelected",
    icon: "square.and.arrow.down",
    group: 45,
    order: 4,
    when: (c) => c.count > 0 && c.tab.uri?.startsWith("archive://"),
    run: async (c) => {
      const to = await chooseFolder();
      if (to) LZ.call("fs.copy", { from: c.entries.map((e) => e.uri), to, mode: "copy" }).catch(LZ.say);
    },
  });
  return { compress };
})();
</script>

<script>
// The Stash Shelf (W7). In the main window: a sidebar entry that opens the shelf in a pane, a toolbar button that shows
// the floating shelf, and "Add to Shelf" / "Remove from Shelf" in the context menu. In the shelf's own window: a
// compact basket that takes files dropped from anywhere, text, links and pictures from a browser or the clipboard,
// and gives its items back by dragging them out.
LZ.words({
  vi: {
    stash: "Khay tạm", stashShow: "Hiện hoặc ẩn khay tạm", stashAdd: "Thêm vào khay tạm", stashRemove: "Bỏ khỏi khay", stashClear: "Dọn khay",
    stashPaste: "Lấy từ bảng nhớ tạm", stashEmpty: "Thả tệp, ảnh, liên kết hay văn bản vào đây", stashClose: "Đóng khay", stashAdded: "Đã thêm {0} mục vào khay",
    revealFinder: "Hiện trong Finder", openItem: "Mở", downloadLanes: "Tải bằng Lanes", lanesSent: "Đã gửi {0} liên kết cho Lanes",
  },
  en: {
    stash: "Stash", stashShow: "Show or hide the shelf", stashAdd: "Add to Shelf", stashRemove: "Remove from Shelf", stashClear: "Clear the Shelf",
    stashPaste: "Take from the Clipboard", stashEmpty: "Drop files, pictures, links or text here", stashClose: "Close the Shelf", stashAdded: "{0} items added to the shelf",
    revealFinder: "Show in Finder", openItem: "Open", downloadLanes: "Download with Lanes", lanesSent: "{0} links sent to Lanes",
  },
});
LZ.icons.add({
  tray: "tray",
  clipboard: "doc.on.clipboard",
});

const Stash = (() => {
  const STASH = "stash://";
  let count = 0;
  placeNames.stash = () => t("stash");
  placeCrumbs.stash = (uri) => [[uri, t("stash"), null]];

  // The main window's pieces.
  const section = LZ.sidebar.section({
    id: "stash",
    render(el) {
      if (S.window.role !== "main") return;
      el.innerHTML = `<button class="side-item" data-uri="${STASH}"><span class="ico" data-ico="tray">${icon("tray")}</span><span class="label">${LZ.esc(t("stash"))}</span><span class="side-count">${count || ""}</span></button>`;
      Sidebar.mark();
    },
  });
  // The shelf reads as one more favourite, right under them, rather than as an item of the section above it.
  section.el.parentElement.prepend(section.el);

  function changed(d) {
    count = d.count;
    section.refresh();
    for (const pane of Panes.all()) if (pane.tab.uri === STASH) pane.refresh();
    if (S.window.role === "shelf") Shelf.load();
  }
  LZ.on("stash.changed", changed);

  // Links kept as files go to Lanes, the download manager by the same author, when it is installed.
  let hasLanes = false;
  const isLink = (uri) => /\.(webloc|url|txt)$/i.test(uri);
  const download = (uris) =>
    LZ.call("lanes.send", { uris: uris.filter(isLink) })
      .then((d) => LZ.toast(t("lanesSent", d.sent)))
      .catch(LZ.say);

  const add = (uris) =>
    LZ.call("stash.add", { uris })
      .then((d) => d.added && S.window.role === "main" && LZ.toast(t("stashAdded", d.added)))
      .catch(LZ.say);

  LZ.toolbar.add({ id: "stash", side: "right", icon: "tray", label: "stashShow", run: () => Panes.action("toggleShelf") });
  Panes.actions.toggleShelf = () => LZ.call("stash.show", {}).catch(LZ.say);
  Keys.add({ "Cmd+Alt+T": "toggleShelf" });
  LZ.menu.add({ id: "stashAdd", label: "stashAdd", icon: "tray.and.arrow.down", group: 46, order: 1, when: (c) => c.count > 0 && isLocal(c.tab.uri), run: (c) => add(c.entries.map((e) => e.uri)) });
  LZ.menu.add({ id: "stashRemove", label: "stashRemove", icon: "tray.and.arrow.up", group: 46, order: 2, when: (c) => c.count > 0 && c.tab.uri === STASH, run: (c) => LZ.call("stash.remove", { uris: c.entries.map((e) => e.uri) }).catch(LZ.say) });
  LZ.menu.add({ id: "stashClear", label: "stashClear", icon: "trash", group: 46, order: 3, when: (c) => c.count === 0 && c.tab.uri === STASH, run: () => LZ.call("stash.clear").catch(LZ.say) });

  LZ.menu.add({ id: "downloadLanes", label: "downloadLanes", icon: "arrow.down.circle", group: 47, order: 1, when: (c) => hasLanes && c.count > 0 && (isLocal(c.tab.uri) || c.tab.uri === STASH) && c.entries.some((e) => isLink(e.uri)), run: (c) => download(c.entries.map((e) => e.uri)) });

  LZ.on("app.hello", () => {
    LZ.call("lanes.available").then((on) => (hasLanes = !!on)).catch(() => {});
    LZ.call("stash.count")
      .then((n) => {
        count = n;
        section.refresh();
      })
      .catch(() => {});
  });

  // The shelf's own window: everything but the basket is hidden.
  const Shelf = {
    items: [],
    selected: new Set(),
    el: null,
    build() {
      document.documentElement.classList.add("shelf-mode");
      const el = document.createElement("div");
      el.className = "shelf";
      el.innerHTML = `<div class="shelf-head drag"><span class="shelf-title">${LZ.esc(t("stash"))} <b class="shelf-count"></b></span>
        <span class="shelf-tools"><button class="mini" data-sh="paste" title="${LZ.esc(t("stashPaste"))}">${icon("clipboard")}</button><button class="mini" data-sh="clear" title="${LZ.esc(t("stashClear"))}">${icon("trash")}</button><button class="mini" data-sh="close" title="${LZ.esc(t("stashClose"))}">${icon("xmark")}</button></span></div>
        <div class="shelf-items"></div>`;
      document.body.appendChild(el);
      this.el = el;
      el.addEventListener("click", (e) => this.click(e));
      el.addEventListener("dblclick", (e) => {
        const item = this.itemAt(e);
        if (item) item.isDir ? LZ.call("app.new_window", { uri: item.uri }).catch(LZ.say) : LZ.call("native.open", { uris: [item.uri] }).catch(LZ.say);
      });
      el.addEventListener("mousedown", (e) => {
        const item = this.itemAt(e);
        if (!item || e.button !== 0) return;
        if (!this.selected.has(item.uri)) {
          if (!e.metaKey) this.selected.clear();
          this.selected.add(item.uri);
          this.paint();
        }
        // Dragging an item out takes the selection with it.
        LZ.call("drag.arm", { uris: [...this.selected] }).catch(() => {});
      });
      el.addEventListener("contextmenu", async (e) => {
        e.preventDefault();
        const item = this.itemAt(e);
        if (!item) return;
        if (!this.selected.has(item.uri)) {
          this.selected = new Set([item.uri]);
          this.paint();
        }
        const uris = [...this.selected];
        const choice = await LZ.choose(
          [
            { id: "open", label: t("openItem"), icon: "arrow.up.forward.app" },
            { id: "reveal", label: t("revealFinder"), icon: "macwindow" },
            { id: "revealHere", label: t("revealHere"), icon: "folder" },
            ...(hasLanes && uris.some(isLink) ? [{ id: "lanes", label: t("downloadLanes"), icon: "arrow.down.circle" }] : []),
            { separator: true },
            { id: "remove", label: t("stashRemove"), icon: "tray.and.arrow.up" },
          ],
          e.clientX,
          e.clientY,
        );
        if (choice === "open") LZ.call("native.open", { uris }).catch(LZ.say);
        else if (choice === "reveal") LZ.call("native.reveal", { uris }).catch(LZ.say);
        // The shelf has no panes: the app shows the items in a main window, opening one if none is open.
        else if (choice === "revealHere") Viewer.reveal(null, uris);
        else if (choice === "lanes") download(uris);
        else if (choice === "remove") LZ.call("stash.remove", { uris }).catch(LZ.say);
      });
      // Text, links and pictures from a browser come as an HTML5 drop (files come through the app, as `drop`).
      document.addEventListener("dragover", (e) => {
        e.preventDefault();
        el.classList.add("over");
      });
      document.addEventListener("dragleave", () => el.classList.remove("over"));
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        el.classList.remove("over");
        this.fromData(e.dataTransfer);
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") LZ.call("stash.show", { on: false }).catch(() => {});
        if (e.key === "v" && e.metaKey) LZ.call("stash.add_clipboard").catch(LZ.say);
      });
      this.load();
    },
    async fromData(data) {
      const files = [...(data?.files || [])].filter((f) => f.type.startsWith("image/") && f.size < 64 << 20);
      for (const file of files) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        let binary = "";
        for (let i = 0; i < bytes.length; i += 32768) binary += String.fromCharCode(...bytes.subarray(i, i + 32768));
        LZ.call("stash.add_data", { name: file.name || null, base64: btoa(binary) }).catch(LZ.say);
      }
      if (files.length) return;
      const url = data?.getData("text/uri-list")?.split("\n").find((l) => /^https?:\/\//.test(l.trim()));
      const text = data?.getData("text/plain");
      if (url) LZ.call("stash.add_data", { url: url.trim() }).catch(LZ.say);
      else if (text) LZ.call("stash.add_data", { text }).catch(LZ.say);
    },
    async load() {
      this.items = await LZ.call("stash.items").catch(() => this.items);
      const uris = new Set(this.items.map((i) => i.uri));
      this.selected = new Set([...this.selected].filter((u) => uris.has(u)));
      this.paint();
    },
    paint() {
      this.el.querySelector(".shelf-count").textContent = this.items.length || "";
      const list = this.el.querySelector(".shelf-items");
      list.innerHTML = this.items.length
        ? this.items
            .map((item, i) => {
              const thumb = thumbUrl(item, 48);
              const pic = thumb ? thumbImg(thumb, iconUrl(item, 48), "thumb") : `<img src="${LZ.esc(iconUrl(item, 48))}" alt="">`;
              return `<div class="shelf-item${this.selected.has(item.uri) ? " sel" : ""}" data-i="${i}">${pic}<span>${LZ.esc(item.name)}</span></div>`;
            })
            .join("")
        : `<div class="shelf-empty">${LZ.esc(t("stashEmpty"))}</div>`;
    },
    itemAt(e) {
      const el = e.target.closest(".shelf-item");
      return el ? this.items[Number(el.dataset.i)] : null;
    },
    click(e) {
      const act = e.target.closest("[data-sh]")?.dataset.sh;
      if (act === "close") return LZ.call("stash.show", { on: false }).catch(() => {});
      if (act === "clear") return LZ.call("stash.clear").catch(LZ.say);
      if (act === "paste") return LZ.call("stash.add_clipboard").catch(LZ.say);
      if (!this.itemAt(e) && !e.target.closest(".shelf-head")) {
        this.selected.clear();
        this.paint();
      }
    },
  };

  LZ.on("app.hello", (d) => {
    if (d.windowRole === "shelf" && !Shelf.el) Shelf.build();
  });
  // Files dropped on the shelf window go on the shelf.
  LZ.on("drop", (d) => {
    if (S.window.role === "shelf") add(d.uris);
  });
  LZ.on("drop.over", () => S.window.role === "shelf" && Shelf.el?.classList.add("over"));
  LZ.on("drop.leave", () => Shelf.el?.classList.remove("over"));
  return { add };
})();
</script>

  const SERVER_SCHEMES = ["sftp", "ftp", "ftps", "s3", "oss"];
  const PASSWORD = "LZ-PASSWORD:";
  const TRUST = "LZ-HOSTKEY:";
  // The kinds of the sheet: [kind, scheme, label]. "s3c" is S3 at an address of its own.
  const KINDS = [
    ["sftp", "sftp", "SFTP"],
    ["ftp", "ftp", "FTP"],
    ["ftps", "ftps", "FTPS (TLS)"],
    ["s3", "s3", "Amazon S3"],
    ["s3c", "s3", "s3Compatible"],
    ["oss", "oss", "Aliyun OSS"],
    ["smb", "smb", "SMB"],
    ["afp", "afp", "AFP"],
    ["nfs", "nfs", "NFS"],
    ["davs", "davs", "WebDAV (HTTPS)"],
    ["dav", "dav", "WebDAV (HTTP)"],
    ["rclone", "rclone", "cloudRclone"],
  ];
  // The labels of KINDS that are words to translate rather than names.
  const WORDS = new Set(["s3Compatible", "cloudRclone"]);
  const PORTS = { sftp: 22, ftp: 21, ftps: 21, smb: 445, afp: 548, nfs: 2049, dav: 80, davs: 443 };
  // The clouds rclone signs in to, by the kinds of src/features/remote/rclone.rs: a name, or a word to translate.
  const CLOUDS = { drive: "Google Drive", dropbox: "Dropbox", onedrive: "OneDrive", onedrive_work: "onedriveWork", sharepoint: "SharePoint", box: "Box", pcloud: "pCloud", mega: "MEGA", yandex: "Yandex Disk", koofr: "Koofr", jottacloud: "Jottacloud", sharefile: "ShareFile" };
  const CLOUD_WORDS = new Set(["onedriveWork"]);
  const cloudLabel = (kind) => (CLOUD_WORDS.has(CLOUDS[kind]) ? t(CLOUDS[kind]) : CLOUDS[kind] || kind);
  // The service a remote is shown as in the sidebar, beside its account; the remote's own name a user may have given
  // stays in its tooltip.
  const SERVICES = { onedrive_work: "OneDrive", sharepoint: "SharePoint" };
  const serviceName = (kind) => SERVICES[kind] || cloudLabel(kind);
  // The name a sign in gives a remote when none is typed: "OneDriveWork", then "OneDriveWork2".
  const BASES = { onedrive_work: "OneDriveWork", sharepoint: "SharePoint" };
  const MICROSOFT = ["onedrive", "onedrive_work", "sharepoint"];
  let conns = [];
  let rclone = { installed: false, remotes: [], kinds: [] };
  // The folders of the clouds' own apps: { name, account, service, uri }.
  let local = [];
  let loaded = null;

  const byId = (id) => conns.find((c) => c.id === id);
  const kindOf = (c) => (c.scheme === "s3" && c.endpoint ? "s3c" : c.scheme);
  const iconOf = (c) => (["s3", "oss"].includes(c.scheme) ? "bucket" : ["smb", "afp", "nfs", "dav", "davs"].includes(c.scheme) ? "share" : "server");

  function load() {
    loaded = Promise.all([LZ.call("remote.list"), LZ.call("remote.clouds").catch(() => [])])
      .then(([d, clouds]) => {
        conns = d.connections;
        rclone = d.rclone;
        local = clouds;
        cloudSection.refresh();
        section.refresh();
        for (const pane of Panes.all()) if (SERVER_SCHEMES.includes(schemeOf(pane.tab.uri))) pane.renderPath();
      })
      .catch(() => {});
    return loaded;
  }

  // Names and crumbs of places on servers: the connection's name at the top, then the folders.
  const rootName = (uri) => (schemeOf(uri) === "rclone" ? authorityOf(uri) : byId(authorityOf(uri))?.name || authorityOf(uri));
  for (const scheme of [...SERVER_SCHEMES, "rclone"]) {
    placeNames[scheme] = (uri) => (pathOf(uri) === "/" ? rootName(uri) : nameOf(uri));
    placeCrumbs[scheme] = (uri) => {
      const items = [[withPath(uri, "/"), rootName(uri), null]];
      let at = "";
      for (const part of pathOf(uri).split("/").filter(Boolean)) items.push([withPath(uri, (at = `${at}/${part}`)), part, null]);
      return items;
    };
  }

  // The web page of a cloud, to see there what its folder on this Mac does not hold (what was shared with you, the
  // web's Recent): a work or school OneDrive goes to Microsoft 365, which finds the organisation's own.
  function webOf(service, name, account) {
    const office = "https://www.microsoft365.com/onedrive";
    if (service === "onedrive_work") return office;
    // The app's folders are "OneDrive - Personal" and "OneDrive - <organisation>"; rclone's personal one is "OneDrive".
    if (service === "onedrive") return / - /.test(name) && !/personal/i.test(name) ? office : "https://onedrive.live.com/";
    if (service === "drive") return account && account.includes("@") ? `https://drive.google.com/drive/my-drive?authuser=${encodeURIComponent(account)}` : "https://drive.google.com/";
    if (service === "dropbox") return "https://www.dropbox.com/home";
    if (service === "box") return "https://app.box.com/";
    if (service === "icloud") return "https://www.icloud.com/iclouddrive/";
    return "";
  }

  // The Cloud section, above Servers: what the clouds' own apps keep on this Mac, then what rclone signed in to, each
  // with its account on a second line, so two accounts of one cloud are told apart. With nothing yet it offers the two
  // clouds most asked for, so signing in is found without opening a sheet. Each is a place files can be dropped on.
  const cloudSection = LZ.sidebar.section({
    id: "cloud",
    render(el) {
      if (S.window.role !== "main") return;
      const item = (uri, name, sub, title, web = "") =>
        `<button class="side-item${sub ? " cl-two" : ""}" data-uri="${LZ.esc(uri)}"${web ? ` data-web="${LZ.esc(web)}"` : ""} title="${LZ.esc(title)}"><span class="ico" data-ico="icloud">${icon("icloud")}</span><span class="label"><span class="cl-name">${LZ.esc(name)}</span>${sub ? `<span class="cl-sub">${LZ.esc(sub)}</span>` : ""}</span></button>`;
      const head = `<div class="side-head"><span>${LZ.esc(t("clouds"))}</span><span class="end" data-cl-add title="${LZ.esc(t("addCloud"))}">${icon("plus")}</span></div>`;
      const remote = (r) => {
        const a = (rclone.accounts || {})[r] || {};
        const name = a.kind ? serviceName(a.kind) : r;
        const sub = a.account || (name !== r ? r : "");
        return item(`rclone://${encodeURIComponent(r)}/`, name, sub, `${a.account ? `${name} - ${a.account}` : name} (rclone: ${r})`, webOf(a.kind === "onedrive_work" || a.kind === "sharepoint" ? "onedrive_work" : a.kind, name, a.account));
      };
      // Each cloud of an app with a way to its web page, and OneDrive with the files used lately in it on this Mac, as
      // the web's Recent has them (Spotlight's recent items under its folder).
      const recent = (c) =>
        `<button class="side-item cl-recent" data-uri="${LZ.esc(`search://recent=1${c.uri.slice("file://".length)}`)}"><span class="ico" data-ico="clock">${icon("clock")}</span><span class="label">${LZ.esc(t("cloudRecent"))}</span></button>`;
      const items = [
        ...local.flatMap((c) => [item(c.uri, c.name, c.account, c.account ? `${c.name} - ${c.account}` : c.name, webOf(c.service, c.name, c.account)), ...(c.service === "onedrive" ? [recent(c)] : [])]),
        ...(rclone.remotes || []).map(remote),
      ];
      const offer = (kind, label) => `<button class="side-item offer" data-cl-kind="${kind}"><span class="ico">${icon("plus")}</span><span class="label">${LZ.esc(label)}</span></button>`;
      const offers = ["drive", "onedrive"].map((kind) => offer(kind, t("addService", CLOUDS[kind]))).join("") + offer("onedrive_app", t("addService", t("onedriveWork")));
      el.innerHTML = head + (items.length ? items.join("") : offers);
      Sidebar.mark();
    },
  });

  // Resolves with whether the job `id` went through once it ends; its error, if any, is shown by the jobs panel.
  function finished(id) {
    return new Promise((resolve) => {
      const done = (d) => {
        if (d.id !== id) return;
        handlers["jobs.finished"] = handlers["jobs.finished"].filter((f) => f !== done);
        resolve(!!d.ok);
      };
      LZ.on("jobs.finished", done);
    });
  }

  // Signs in to a cloud through rclone, installing rclone first when it is not there, then opens the cloud in a tab.
  async function signIn(kind, name = "", advanced = {}) {
    try {
      if (!rclone.installed) {
        if (!(await LZ.confirm(t("rcloneNeeded"), t("rcloneNeededText"), t("installRclone")))) return;
        if (!(await finished((await LZ.call("remote.rclone_install")).job))) return;
        await load();
        if (!rclone.installed) return;
      }
      if (!name) {
        const base = BASES[kind] || CLOUDS[kind].replace(/[^A-Za-z0-9]/g, "");
        name = base;
        for (let i = 2; rclone.remotes.includes(name); i++) name = `${base}${i}`;
      }
      const { job } = await LZ.call("remote.rclone_add", { kind, name, advanced });
      LZ.toast(t("signInBrowser"));
      if (!(await finished(job))) return;
      await load();
      Panes.open(`rclone://${encodeURIComponent(name)}/`);
    } catch (e) {
      LZ.say(e);
    }
  }

  cloudSection.el.addEventListener("click", async (e) => {
    const offer = e.target.closest("[data-cl-kind]");
    if (offer) return offer.dataset.clKind === "onedrive_app" ? oneDriveApp() : signIn(offer.dataset.clKind);
    const add = e.target.closest("[data-cl-add]");
    if (!add) return;
    const r = add.getBoundingClientRect();
    const choice = await LZ.choose(
      [
        ...["drive", "onedrive"].map((kind) => ({ id: kind, label: cloudLabel(kind), icon: "icloud" })),
        { id: "onedrive_app", label: t("onedriveApp"), icon: "building.2" },
        { id: "dropbox", label: cloudLabel("dropbox"), icon: "icloud" },
        { separator: true },
        { id: "other", label: t("otherCloud"), icon: "ellipsis.circle" },
      ],
      r.left,
      r.bottom + 4,
    );
    // A work or school OneDrive goes through Microsoft's app; rclone's way to it (and to SharePoint) stays under Other
    // Service, for organisations that approve rclone or have an app id of their own.
    if (choice === "onedrive_app") oneDriveApp();
    else if (choice === "other") showCloud("drive");
    else if (choice) signIn(choice);
  });

  // OneDrive for work or school through Microsoft's own app, which no organisation has to approve: the app is opened
  // (or its page in the App Store), and once a OneDrive folder that was not there shows in ~/Library/CloudStorage, it
  // opens in a tab.
  let waitingOneDrive = null;
  async function oneDriveApp() {
    try {
      const { installed } = await LZ.call("remote.onedrive_app");
      const ok = installed
        ? await LZ.confirm(t("onedriveAppTitle"), t("onedriveAppText"), t("openOneDrive"))
        : await LZ.confirm(t("onedriveInstallTitle"), t("onedriveInstallText"), t("openStore"));
      if (!ok) return;
      const before = new Set(local.filter((c) => c.service === "onedrive").map((c) => c.uri));
      await LZ.call("remote.onedrive_open");
      LZ.toast(t("onedriveWaiting"));
      clearInterval(waitingOneDrive);
      const started = Date.now();
      waitingOneDrive = setInterval(async () => {
        // Signing in and installing take a while; after half an hour the folder is left to show by itself.
        if (Date.now() - started > 30 * 60 * 1000) return clearInterval(waitingOneDrive);
        const clouds = await LZ.call("remote.clouds").catch(() => null);
        const fresh = clouds?.find((c) => c.service === "onedrive" && !before.has(c.uri));
        if (!fresh) return;
        clearInterval(waitingOneDrive);
        await load();
        LZ.toast(t("onedriveReady", fresh.name));
        Panes.focused()?.newTab(fresh.uri);
      }, 3000);
    } catch (e) {
      LZ.say(e);
    }
  }
  Panes.actions.addOneDriveApp = oneDriveApp;

  // The sheet open on a cloud to sign in to through rclone.
  function showCloud(kind) {
    show(null);
    q(".rm-kind").value = "rclone";
    q(".rm-cloud").value = kind;
    paint();
  }

  // The sidebar section.
  const section = LZ.sidebar.section({
    id: "remote",
    render(el) {
      if (S.window.role !== "main") return;
      const head = `<div class="side-head"><span>${LZ.esc(t("servers"))}</span><span class="end" data-rm-add title="${LZ.esc(t("connectServer"))}">${icon("plus")}</span></div>`;
      const saved = conns
        .map((c) => {
          const off = c.live ? `<span class="end" data-rm-off="${LZ.esc(c.id)}" title="${LZ.esc(t("disconnect"))}">${icon("eject")}</span>` : "";
          return `<button class="side-item" data-conn="${LZ.esc(c.id)}"><span class="ico" data-ico="${iconOf(c)}">${icon(iconOf(c))}</span><span class="label">${LZ.esc(c.name)}</span>${off}</button>`;
        })
        .join("");
      el.innerHTML = head + saved;
      mark();
    },
  });

  function mark() {
    const here = Panes.current()?.uri || "";
    const id = SERVER_SCHEMES.includes(schemeOf(here)) ? authorityOf(here) : null;
    for (const el of document.querySelectorAll('[data-section="remote"] [data-conn]')) el.classList.toggle("on", el.dataset.conn === id);
  }
  const coreMark = Sidebar.mark;
  Sidebar.mark = () => {
    coreMark();
    mark();
  };

  // What a server asks for on the way in. Resolves true when it is worth trying again. One question at a time per
  // connection, however many panes show it.
  const asking = new Map();
  function resolve(conn, error) {
    if (!asking.has(conn.id)) asking.set(conn.id, ask(conn, error).finally(() => asking.delete(conn.id)));
    return asking.get(conn.id);
  }

  async function ask(conn, error) {
    if (error.startsWith(PASSWORD)) {
      const password = await LZ.prompt(t("passwordFor", conn.name), { text: error.slice(PASSWORD.length), secret: true, ok: t("connect") });
      if (password == null) return false;
      try {
        const d = await LZ.call("remote.password", { id: conn.id, password });
        if (!d.kept) LZ.toast(t("secretNotKept"));
      } catch (e) {
        LZ.say(e);
      }
      return true;
    }
    if (error.startsWith(TRUST)) {
      const fingerprint = error.slice(TRUST.length);
      const ok = await LZ.confirm(t("trustTitle"), t("trustText", conn.port ? `${conn.host}:${conn.port}` : conn.host, fingerprint), t("trust"));
      if (!ok) return false;
      await LZ.call("remote.trust", { host: conn.host, port: conn.port || null, fingerprint }).catch(LZ.say);
      return true;
    }
    return false;
  }

  // Connects and opens the connection's folder in the focused pane, asking what the server needs on the way.
  async function open(conn) {
    for (let tries = 0; tries < 5; tries++) {
      try {
        const d = await LZ.call("remote.connect", { id: conn.id });
        Panes.open(d.uri);
        load();
        // A share mounted just now is a disk of Locations too.
        if (isLocal(d.uri)) Sidebar.loadVolumes();
        return;
      } catch (e) {
        const error = String(e);
        if (!(await resolve(conn, error))) {
          if (!error.startsWith(PASSWORD) && !error.startsWith(TRUST)) LZ.say(error);
          return;
        }
      }
    }
  }

  // A pane on a server that needs something lists again once it was given.
  LZ.on("view.error", async (d) => {
    const found = Panes.findTab(d.view);
    if (!found) return;
    const [pane, tab] = found;
    if (!SERVER_SCHEMES.includes(schemeOf(tab.uri))) return;
    const error = String(d.error);
    if (!error.startsWith(PASSWORD) && !error.startsWith(TRUST)) return;
    if (error.startsWith(TRUST)) {
      tab.error = t("hostKeyNew");
      if (pane.tab === tab) pane.renderAll();
    }
    await loaded;
    const conn = byId(authorityOf(tab.uri));
    if (conn && (await resolve(conn, error))) pane.refresh();
  });

  // The sheet that adds or edits a connection.
  const panel = LZ.sheet.create("serverSheet", { small: true });
  const row = (f, label, input) => `<div class="rm-row" data-f="${f}"><label data-t="${label}"></label>${input}</div>`;
  panel.innerHTML = `
    <h2 class="rm-title"></h2>
    <div class="rm-grid">
      ${row("kind", "serverKind", `<select class="rm-kind">${KINDS.map(([k, , label]) => `<option value="${k}"${WORDS.has(label) ? ` data-t="${label}"` : ""}>${label}</option>`).join("")}</select>`)}
      ${row("name", "serverName", '<input data-v="name" spellcheck="false">')}
      ${row("host", "serverHost", '<input data-v="host" spellcheck="false" placeholder="nas.local">')}
      ${row("port", "serverPort", '<input data-v="port" inputmode="numeric" spellcheck="false">')}
      ${row("endpoint", "serverEndpoint", '<input data-v="endpoint" spellcheck="false" placeholder="https://minio.local:9000">')}
      ${row("region", "serverRegion", '<input data-v="region" spellcheck="false">')}
      ${row("user", "serverUser", '<input data-v="user" spellcheck="false" autocomplete="off">')}
      ${row("secret", "serverPassword", '<input data-v="secret" type="password" autocomplete="off">')}
      ${row("keyFile", "serverKeyFile", '<input data-v="keyFile" spellcheck="false" placeholder="~/.ssh/id_ed25519">')}
      ${row("path", "serverFolder", '<input data-v="path" spellcheck="false">')}
      ${row("bucket", "serverBucket", '<input data-v="bucket" spellcheck="false">')}
      ${row("guest", "serverGuest", '<input data-v="guest" type="checkbox">')}
      ${row("cloud", "cloudKind", `<select class="rm-cloud">${Object.entries(CLOUDS).map(([k, label]) => `<option value="${k}"${CLOUD_WORDS.has(label) ? ` data-t="${label}"` : ""}>${label}</option>`).join("")}</select>`)}
      ${row("cloudName", "cloudName", '<input class="rm-cloud-name" spellcheck="false" placeholder="gdrive">')}
      ${row("site", "cloudSite", '<input class="rm-site" spellcheck="false" data-tp="siteHint">')}
      ${row("advanced", "cloudAdvanced", '<input class="rm-advanced" type="checkbox">')}
      ${row("clientId", "clientId", '<input class="rm-client-id" spellcheck="false" autocomplete="off">')}
      ${row("clientSecret", "clientSecret", '<input class="rm-client-secret" type="password" autocomplete="off">')}
      ${row("tenant", "tenantId", '<input class="rm-tenant" spellcheck="false" autocomplete="off" placeholder="contoso.onmicrosoft.com">')}
    </div>
    <div class="rm-help"></div>
    <div class="rm-note"></div>
    <div class="buttons"><button class="push" data-rm="test" data-t="tryConnect"></button><button class="push" data-rm="cancel" data-t="cancel"></button><button class="push primary" data-rm="save"></button></div>`;
  const q = (s) => panel.querySelector(s);
  const field = (name) => panel.querySelector(`[data-v="${name}"]`);
  let editing = null;

  // Shows the fields of the chosen kind, with the words that kind uses.
  function paint() {
    const kind = q(".rm-kind").value;
    const cloud = q(".rm-cloud").value;
    const advanced = kind === "rclone" && q(".rm-advanced").checked;
    const s3 = ["s3", "s3c", "oss"].includes(kind);
    const mounted = ["smb", "afp", "nfs", "dav", "davs"].includes(kind);
    const shown = {
      name: kind !== "rclone",
      host: !s3 && kind !== "rclone",
      port: !s3 && kind !== "rclone",
      endpoint: kind === "s3c",
      region: s3,
      user: kind !== "rclone" && kind !== "nfs",
      secret: kind !== "rclone" && kind !== "nfs",
      keyFile: kind === "sftp",
      path: kind !== "rclone" && !s3,
      bucket: s3,
      guest: kind === "smb" || kind === "afp",
      cloud: kind === "rclone",
      cloudName: kind === "rclone",
      site: kind === "rclone" && cloud === "sharepoint",
      advanced: kind === "rclone",
      clientId: advanced,
      clientSecret: advanced,
      tenant: advanced && MICROSOFT.includes(cloud),
    };
    for (const el of panel.querySelectorAll(".rm-row")) el.hidden = el.dataset.f !== "kind" && !shown[el.dataset.f];
    const label = (f, word) => (panel.querySelector(`.rm-row[data-f="${f}"] label`).dataset.t = word);
    label("user", s3 ? "serverAccessKey" : "serverUser");
    label("secret", s3 ? "serverSecretKey" : kind === "sftp" ? "serverPassphrase" : "serverPassword");
    label("path", kind === "smb" || kind === "afp" ? "serverShare" : mounted ? "serverPath" : "serverFolder");
    field("port").placeholder = PORTS[kind] ? String(PORTS[kind]) : "";
    field("region").placeholder = kind === "oss" ? "cn-hangzhou" : `us-east-1 (${t("optional")})`;
    field("bucket").placeholder = t("optional");
    field("secret").placeholder = editing ? t("keepSecret") : "";
    field("path").placeholder = kind === "smb" || kind === "afp" ? "Public" : mounted ? "/" : `/ (${t("optional")})`;
    q('[data-rm="test"]').hidden = mounted || kind === "rclone";
    q('[data-rm="save"]').dataset.t = kind === "rclone" ? "signIn" : "saveConnect";
    const notes = kind !== "rclone" ? [] : ["rcloneNote", ...(["onedrive_work", "sharepoint"].includes(cloud) ? ["workNote"] : []), ...(advanced ? ["advancedNote"] : [])];
    q(".rm-help").innerHTML = notes.map((n) => `<p>${LZ.esc(t(n))}</p>`).join("");
    q(".rm-note").textContent = "";
    applyLang();
  }
  for (const s of [".rm-kind", ".rm-cloud", ".rm-advanced"]) q(s).addEventListener("change", paint);

  function show(conn) {
    editing = conn || null;
    q(".rm-title").dataset.t = conn ? "editServer" : "connectServer";
    q(".rm-kind").value = conn ? kindOf(conn) : "sftp";
    q(".rm-kind").disabled = !!conn;
    for (const name of ["name", "host", "endpoint", "region", "user", "keyFile", "path", "bucket"]) field(name).value = conn?.[name] || "";
    field("port").value = conn?.port || "";
    field("secret").value = "";
    field("guest").checked = !!conn?.guest;
    for (const s of [".rm-site", ".rm-client-id", ".rm-client-secret", ".rm-tenant"]) q(s).value = "";
    q(".rm-advanced").checked = false;
    LZ.sheet.open("serverSheet");
    paint();
    // Whether rclone is installed may have changed since the list was loaded.
    load().then(() => q(".rm-kind").value === "rclone" && paint());
    setTimeout(() => (conn ? field("name") : q(".rm-kind")).focus(), 30);
  }

  // The connection the form describes, as remote.save takes it.
  function described() {
    const kind = q(".rm-kind").value;
    const scheme = KINDS.find(([k]) => k === kind)[1];
    const port = parseInt(field("port").value, 10);
    const c = { id: editing?.id || "", scheme, port: port > 0 && port < 65536 ? port : null, guest: field("guest").checked };
    for (const name of ["name", "host", "region", "user", "keyFile", "path", "bucket"]) c[name] = field(name).value.trim();
    c.endpoint = kind === "s3c" ? field("endpoint").value.trim() : "";
    return c;
  }

  async function test() {
    const note = q(".rm-note");
    const connection = described();
    note.classList.remove("good");
    note.textContent = "...";
    for (let tries = 0; tries < 3; tries++) {
      try {
        await LZ.call("remote.test", { connection, secret: field("secret").value || null });
        note.textContent = t("connectionWorks");
        note.classList.add("good");
        return;
      } catch (e) {
        const error = String(e);
        if (error.startsWith(TRUST)) {
          // The question is a sheet of its own, which closes this one until it is answered.
          const trusted = await ask(connection, error);
          LZ.sheet.open("serverSheet");
          if (trusted) continue;
        }
        note.textContent = error.replace(/^LZ-[A-Z]+:/, "");
        return;
      }
    }
  }

  async function save() {
    const kind = q(".rm-kind").value;
    const note = q(".rm-note");
    if (kind === "rclone") {
      const cloud = q(".rm-cloud").value;
      const own = q(".rm-advanced").checked;
      const advanced = {
        site: cloud === "sharepoint" ? q(".rm-site").value.trim() : "",
        clientId: own ? q(".rm-client-id").value.trim() : "",
        clientSecret: own ? q(".rm-client-secret").value : "",
        tenant: own && MICROSOFT.includes(cloud) ? q(".rm-tenant").value.trim() : "",
      };
      LZ.sheet.close();
      return signIn(cloud, q(".rm-cloud-name").value.trim(), advanced);
    }
    if (kind === "s3c" && !field("endpoint").value.trim()) return (note.textContent = `${t("serverEndpoint")}?`);
    try {
      const secret = field("secret").value;
      const d = await LZ.call("remote.save", { connection: described(), secret: secret || null });
      if (!d.kept) LZ.toast(t("secretNotKept"));
      LZ.sheet.close();
      await load();
      open(d.connection);
    } catch (e) {
      note.textContent = String(e);
    }
  }

  panel.addEventListener("click", (e) => {
    const act = e.target.closest("[data-rm]")?.dataset.rm;
    if (act === "cancel") LZ.sheet.close();
    else if (act === "test") test();
    else if (act === "save") save();
  });
  panel.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.target.matches("input")) save();
  });

  section.el.addEventListener("click", (e) => {
    if (e.target.closest("[data-rm-add]")) return show(null);
    const off = e.target.closest("[data-rm-off]");
    if (off) {
      e.stopPropagation();
      return LZ.call("remote.disconnect", { id: off.dataset.rmOff }).then(load, LZ.say);
    }
    const item = e.target.closest("[data-conn]");
    const conn = item && byId(item.dataset.conn);
    if (conn) open(conn);
  });
  section.el.addEventListener("contextmenu", async (e) => {
    const item = e.target.closest("[data-conn]");
    const conn = item && byId(item.dataset.conn);
    if (!conn) return;
    e.preventDefault();
    const choice = await LZ.choose(
      [
        { id: "connect", label: t("connect"), icon: "server.rack" },
        { id: "edit", label: t("editServer"), icon: "pencil" },
        { id: "off", label: t("disconnect"), icon: "eject", enabled: !!conn.live },
        { separator: true },
        { id: "delete", label: t("deleteServer"), icon: "trash" },
      ],
      e.clientX,
      e.clientY,
    );
    if (choice === "connect") open(conn);
    else if (choice === "edit") show(conn);
    else if (choice === "off") LZ.call("remote.disconnect", { id: conn.id }).then(load, LZ.say);
    else if (choice === "delete" && (await LZ.confirm(t("deleteServer"), t("deleteServerText", conn.name), t("deleteServer")))) LZ.call("remote.delete", { id: conn.id }).then(load, LZ.say);
  });

  Panes.actions.connectServer = () => show(null);
  Keys.add({ "Cmd+K": "connectServer" });
  LZ.on("app.hello", () => S.window.role === "main" && load());
  // The accounts of rclone's remotes, found on the network after a listing, are in.
  LZ.on("remote.changed", () => S.window.role === "main" && load());
  // Clouds whose apps were signed in to meanwhile, and connections made in another window, show when the window comes
  // forward.
  window.addEventListener("focus", () => S.window.role === "main" && load());
  return { load, open };
})();
</script>
<script>
// Word, Excel and PowerPoint in the context menu of their documents, when they are on this Mac. A document in the
// folder of OneDrive's app (or of another cloud's app) opened there is edited in place: Office saves it where it is, and
// the cloud's app sends each change up, so co-workers see it as on the web.
words({
  vi: { openInWord: "Mở bằng Word", openInExcel: "Mở bằng Excel", openInPowerPoint: "Mở bằng PowerPoint", officeSyncs: "Sửa xong, OneDrive tự đồng bộ lên mây" },
  en: { openInWord: "Open in Word", openInExcel: "Open in Excel", openInPowerPoint: "Open in PowerPoint", officeSyncs: "Saved changes go up to OneDrive by themselves" },
});

(() => {
  const APPS = [
    ["word", "openInWord", ["doc", "docx", "docm", "dot", "dotx", "rtf", "odt"]],
    ["excel", "openInExcel", ["xls", "xlsx", "xlsm", "xlsb", "xlt", "xltx", "csv", "ods"]],
    ["powerpoint", "openInPowerPoint", ["ppt", "pptx", "pptm", "pot", "potx", "pps", "ppsx", "odp"]],
  ];
  let paths = {};
  const load = () =>
    LZ.call("native.office_apps")
      .then((d) => (paths = d || {}))
      .catch(() => {});
  LZ.on("app.hello", load);
  // An app installed while LazySpace runs is found when the window comes forward.
  window.addEventListener("focus", load);

  const ext = (name) => (name.includes(".") ? name.split(".").pop().toLowerCase() : "");
  // The one app every selected file opens in, or null.
  function appOf(ctx) {
    if (!ctx.count || !ctx.entries.length || ctx.entries.some((e) => e.isDir || !isLocal(e.uri))) return null;
    const found = APPS.find(([, , exts]) => ctx.entries.every((e) => exts.includes(ext(e.name))));
    return found && paths[found[0]] ? found : null;
  }
  const inCloud = (ctx) => ctx.entries.every((e) => /\/Library\/CloudStorage\//.test(decodeURIComponent(e.uri)));

  LZ.menu.add({
    id: "openInOffice",
    label: (ctx) => t(appOf(ctx)?.[1] || "openInWord"),
    icon: "doc.richtext",
    group: 10,
    order: 1.5,
    when: (ctx) => !!appOf(ctx),
    run: (ctx) => {
      const [key] = appOf(ctx);
      LZ.call("native.open_with", { uris: ctx.entries.map((e) => e.uri), app: paths[key] })
        .then(() => inCloud(ctx) && LZ.toast(t("officeSyncs")))
        .catch(LZ.say);
    },
  });
})();
</script>
<style>

<script>
// LazySpace as the desktop (W9). In the desktop's own window: one pane of icons at ~/Desktop on the wallpaper, each
// icon where it was put (desktop.json), with everything a pane does: the context menu, the keys, Quick Look, renaming,
// dragging out and dropping in. A folder opens in a main window. In Settings: the switches that turn it on and hide
// Finder's own icons.
LZ.words({
  vi: {
    desktop: "Màn hình nền", desktopOn: "Dùng LazySpace làm màn hình nền", desktopOnHint: "Hiện các mục của thư mục Màn hình nền trên hình nền, với menu chuột phải, phím tắt và kéo thả của LazySpace.",
    hideFinderIcons: "Ẩn biểu tượng của Finder trên màn hình nền", hideFinderIconsHint: "Finder sẽ khởi động lại để ẩn biểu tượng của nó; tắt màn hình nền LazySpace thì biểu tượng của Finder trở lại.",
    hideFinderIconsAsk: "Finder sẽ khởi động lại", hideFinderIconsText: "Để ẩn hoặc hiện lại biểu tượng của nó, Finder cần khởi động lại. Các cửa sổ Finder sẽ mở lại như cũ.", restartFinder: "Khởi động lại Finder",
  },
  en: {
    desktop: "Desktop", desktopOn: "Use LazySpace as the desktop", desktopOnHint: "Shows the items of the Desktop folder on the wallpaper, with LazySpace's context menu, shortcuts and drag and drop.",
    hideFinderIcons: "Hide Finder's icons on the desktop", hideFinderIconsHint: "Finder restarts to hide its icons; turning the LazySpace desktop off brings Finder's icons back.",
    hideFinderIconsAsk: "Finder will restart", hideFinderIconsText: "To hide or show its icons again, Finder has to restart. Its windows open again as they were.", restartFinder: "Restart Finder",
  },
});

const DesktopMode = (() => {
  // The space kept free around the icons, as Finder keeps it from the screen's edges.
  const MARGIN = 12;
  let pane = null;
  let cells = {};

  const grid = () => ({ cols: Math.max(1, Math.floor((pane.list.clientWidth - 2 * MARGIN) / CELL_W)), rows: Math.max(1, Math.floor((pane.list.clientHeight - 2 * MARGIN) / CELL_H)) });

  // Where an icon goes: its cell counted from the top right; an item not placed yet waits out of sight.
  function placeAt(i, entry) {
    const cell = entry && cells[entry.name];
    if (!cell) return { left: -9999, top: 0 };
    return { left: pane.list.clientWidth - MARGIN - (cell[0] + 1) * CELL_W, top: MARGIN + cell[1] * CELL_H };
  }

  async function arrange() {
    if (!pane?.tab.generation) return;
    const d = await LZ.call("desktop.place", { view: pane.tab.id, ...grid() }).catch(() => null);
    if (!d) return;
    cells = d.cells;
    pane.render();
  }

  // The cell under a point of the window.
  function cellAt(x, y) {
    const r = pane.list.getBoundingClientRect();
    const col = Math.max(0, Math.floor((r.right - MARGIN - x) / CELL_W));
    const row = Math.max(0, Math.floor((y - r.top - MARGIN) / CELL_H));
    return { col, row };
  }

  function start(d) {
    document.documentElement.classList.add("desktop-mode");
    const uri = d.uri || S.places.desktop;
    Panes.start({ layout: "single", panes: [{ tabs: [{ uri, mode: "icons" }] }] }, uri);
    pane = Panes.all()[0];
    pane.placeAt = placeAt;
    new ResizeObserver(arrange).observe(pane.list);
    LZ.on("view.changed", (v) => v.view === pane.tab.id && arrange());
    LZ.on("desktop.screens", arrange);

    // A folder opens in a main window, a file with its app: the desktop itself stays where it is.
    const open = Panes.actions.open;
    Panes.actions.open = (p) => {
      if (p !== pane) return open(p);
      const entries = p.tab.selectedEntries();
      const into = entries.map((e) => (e.isDir ? e.uri : LZ.vfs.browse(e))).filter(Boolean);
      for (const uri of into) LZ.call("app.new_window", { uri }).catch(LZ.say);
      const files = entries.filter((e) => !e.isDir && !LZ.vfs.browse(e));
      if (files.length) LZ.call("native.open", { uris: files.map((e) => e.uri) }).catch(LZ.say);
    };
    for (const name of ["enclosing", "back", "forward"]) {
      const action = Panes.actions[name];
      Panes.actions[name] = (p) => (p === pane ? undefined : action(p));
    }

    // Icons of the desktop dropped on the desktop move to where they are dropped; anything else is copied or moved in
    // by the core, then placed at the drop as it arrives.
    let dropped = null;
    const move = (names, at) =>
      LZ.call("desktop.move", { view: pane.tab.id, names, ...at, ...grid() })
        .then((d) => {
          cells = d.cells;
          pane.render();
        })
        .catch(LZ.say);
    Panes.onDrop = (drop, target) => {
      if (target.uri !== pane.tab.uri) return false;
      const here = pathOf(pane.tab.uri);
      const names = drop.uris.map((u) => pathOf(u)).filter((p) => p.slice(0, p.lastIndexOf("/")) === here).map((p) => p.slice(p.lastIndexOf("/") + 1));
      if (names.length === drop.uris.length) {
        move(names, cellAt(drop.x, drop.y));
        return true;
      }
      dropped = cellAt(drop.x, drop.y);
      return false;
    };
    LZ.on("jobs.finished", (j) => {
      if (!dropped || !j.ok || !samePlace(j.data?.to, pane.tab.uri) || !j.data.names?.length) return;
      move(j.data.names, dropped);
      dropped = null;
    });
  }

  LZ.on("app.hello", async (d) => {
    if (d.windowRole !== "desktop" || pane) return;
    S.places = await LZ.call("native.home").catch(() => ({}));
    start(d);
  });

  // Settings: the desktop and Finder's icons.
  const group = LZ.settings.section({
    id: "desktop",
    title: "desktop",
    build(el) {
      el.innerHTML = `
        <div class="item"><div class="label"><span data-t="desktopOn"></span><small data-t="desktopOnHint"></small></div>
          <div class="control"><label class="switch"><input type="checkbox" data-desk="on" /><span class="knob"></span></label></div></div>
        <div class="item"><div class="label"><span data-t="hideFinderIcons"></span><small data-t="hideFinderIconsHint"></small></div>
          <div class="control"><label class="switch"><input type="checkbox" data-desk="hide" /><span class="knob"></span></label></div></div>`;
    },
  });
  const box = (k) => group.querySelector(`[data-desk="${k}"]`);
  function paint() {
    const desk = S.settings.desktop || {};
    box("on").checked = !!desk.on;
    box("hide").checked = !!desk.hide_finder_icons;
    box("hide").disabled = !desk.on;
  }
  group.addEventListener("change", async (e) => {
    const kind = e.target.dataset?.desk;
    if (!kind) return;
    const desk = S.settings.desktop || {};
    const on = kind === "on" ? e.target.checked : !!desk.on;
    const hide = kind === "hide" ? e.target.checked : !!desk.hide_finder_icons;
    // Finder restarts when its icons go or come back, which is asked first.
    const finderChanges = (on && hide) !== (!!desk.on && !!desk.hide_finder_icons);
    if (finderChanges && !(await LZ.confirm(t("hideFinderIconsAsk"), t("hideFinderIconsText"), t("restartFinder")))) {
      paint();
      openSheet("settingsSheet");
      return;
    }
    LZ.call("desktop.enable", { on, hideFinderIcons: hide }).catch(LZ.say);
    if (finderChanges) openSheet("settingsSheet");
  });
  LZ.on("settings.changed", paint);
  LZ.on("app.hello", paint);
  return { arrange };
})();
</script>
