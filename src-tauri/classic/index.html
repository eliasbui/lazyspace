    else if (i < this.active) this.active--;
    this.renderAll();
    Panes.changed(this);
  }
}

const Panes = (() => {
  const grid = $("paneGrid");
  const panes = [];
  let focused = null;
  let saveTimer;
  const listeners = {};
  const cut = new Set();

  function emit(name, detail) {
    for (const fn of listeners[name] || []) fn(detail);
  }

  // A pane with the tabs `tabs` ({ uri, mode, sort, title, color }), not yet in the layout.
  function makePane(tabs) {
    const pane = new Pane(panes.length);
    for (const saved of tabs) {
      const tab = new Tab(saved.uri, saved.mode);
      tab.sort = saved.sort || null;
      tab.title = typeof saved.title === "string" && saved.title ? saved.title.slice(0, 80) : null;
      tab.color = TAB_COLORS.includes(saved.color) ? saved.color : null;
      pane.tabs.push(tab);
    }
    return pane;
  }

  // Shows a pane that has just been made at the place of its tab.
  function show(pane) {
    const tab = pane.tab;
    const uri = tab.uri;
    tab.uri = null;
    pane.navigate(uri, { history: false });
  }

  // The layout is a tree: a leaf is a pane ({ pane }), a split lays its children in a row or a column ({ dir: "row" |
  // "col", kids, sizes }), each child taking its share of the split (the sizes add up to 1). The panes in the order of
  // the tree, left to right and top to bottom, are `panes`: the order F5 and Tab go through.
  const MAX_PANES = 6;
  let tree = null;
  const leaf = (pane) => ({ pane });
  const split = (dir, kids) => ({ dir, kids: kids.map((k) => (k instanceof Pane ? leaf(k) : k)), sizes: kids.map(() => 1 / kids.length) });
  const PRESETS = {
    single: (p) => leaf(p[0]),
    h2: (p) => split("row", [p[0], p[1]]),
    v2: (p) => split("col", [p[0], p[1]]),
    h3: (p) => split("row", [p[0], p[1], p[2]]),
    l1r2: (p) => split("row", [p[0], split("col", [p[1], p[2]])]),
    grid: (p) => split("col", [split("row", [p[0], p[1]]), split("row", [p[2], p[3]])]),
    h4: (p) => split("row", [p[0], p[1], p[2], p[3]]),
    g6: (p) => split("col", [split("row", [p[0], p[1], p[2]]), split("row", [p[3], p[4], p[5]])]),
  };

  function leaves(node, out = []) {
    if (node.pane) out.push(node.pane);
    else node.kids.forEach((k) => leaves(k, out));
    return out;
  }

  // The split that holds `node`, and where among its children.
  function parentOf(node, from = tree) {
    if (from.pane) return null;
    const i = from.kids.indexOf(node);
    if (i >= 0) return [from, i];
    for (const kid of from.kids) {
      const found = parentOf(node, kid);
      if (found) return found;
    }
    return null;
  }

  function leafOf(pane, from = tree) {
    if (from.pane) return from.pane === pane ? from : null;
    for (const kid of from.kids) {
      const found = leafOf(pane, kid);
      if (found) return found;
    }
    return null;
  }

  // Puts `node` where `old` was in the tree.
  function replace(old, node) {
    const found = parentOf(old);
    if (!found) tree = node;
    else found[0].kids[found[1]] = node;
  }

  // A split left with one child gives way to it; a split inside a split of the same way joins it.
  function tidy(node = tree) {
    if (node.pane) return node;
    node.kids = node.kids.map(tidy);
    const kids = [];
    const sizes = [];
    node.kids.forEach((kid, i) => {
      if (!kid.pane && kid.dir === node.dir) {
        kid.kids.forEach((k, j) => {
          kids.push(k);
          sizes.push(node.sizes[i] * kid.sizes[j]);
        });
      } else {
        kids.push(kid);
        sizes.push(node.sizes[i]);
      }
    });
    const total = sizes.reduce((a, b) => a + b, 0) || 1;
    node.kids = kids;
    node.sizes = sizes.map((x) => x / total);
    return kids.length === 1 ? kids[0] : node;
  }

  // Draws the tree: each split a flex box with a line between its children that is dragged to share the room
  // differently, and double-clicked to share it evenly. The panes keep where their lists were scrolled.
  function renderTree() {
    tree = tidy(tree);
    const scrolled = new Map(leaves(tree).map((p) => [p, p.list.scrollTop]));
    const build = (node) => {
      if (node.pane) return node.pane.el;
      const el = document.createElement("div");
      // The way of a split is an attribute: "row" is already the class of a row of files.
      el.className = "split";
      el.dataset.dir = node.dir;
      node.kids.forEach((kid, i) => {
        if (i) {
          const line = document.createElement("div");
          line.className = "splitter";
          line.addEventListener("mousedown", (e) => dragSplitter(e, node, i, el, line));
          line.addEventListener("dblclick", () => {
            node.sizes = node.kids.map(() => 1 / node.kids.length);
            renderTree();
            saveSoon();
          });
          el.appendChild(line);
        }
        const child = build(kid);
        child.style.flex = `${node.sizes[i]} 1 0px`;
        el.appendChild(child);
      });
      return el;
    };
    const root = build(tree);
    root.style.flex = "1 1 0px";
    grid.replaceChildren(root);
    panes.splice(0, panes.length, ...leaves(tree));
    panes.forEach((p, i) => {
      p.index = i;
      p.el.dataset.pane = `p${i}`;
      p.list.scrollTop = scrolled.get(p) || 0;
      p.renderSoon();
    });
    $("app").classList.toggle("multi", panes.length > 1);
    paintLayoutButton();
  }

  // Drags the line before child `i` of `node`: the two children beside it share their room as the pointer says, each
  // kept at least as wide (or tall) as a pane can be used.
  function dragSplitter(down, node, i, el, line) {
    down.preventDefault();
    const row = node.dir === "row";
    const kids = [...el.children].filter((c) => !c.classList.contains("splitter"));
    const [a, b] = [kids[i - 1], kids[i]];
    const size = (k) => (row ? k.getBoundingClientRect().width : k.getBoundingClientRect().height);
    const [startA, startB] = [size(a), size(b)];
    const share = node.sizes[i - 1] + node.sizes[i];
    const least = row ? 160 : 120;
    const from = row ? down.clientX : down.clientY;
    line.classList.add("active");
    document.body.classList.add(row ? "resizing-col" : "resizing-row");
    const move = (m) => {
      const total = startA + startB;
      const sizeA = Math.min(Math.max(least, startA + (row ? m.clientX : m.clientY) - from), Math.max(least, total - least));
      node.sizes[i - 1] = (share * sizeA) / total;
      node.sizes[i] = share - node.sizes[i - 1];
      a.style.flex = `${node.sizes[i - 1]} 1 0px`;
      b.style.flex = `${node.sizes[i]} 1 0px`;
    };
    const up = () => {
      removeEventListener("mousemove", move);
      removeEventListener("mouseup", up);
      line.classList.remove("active");
      document.body.classList.remove("resizing-col", "resizing-row");
      grid.dataset.layout = "custom";
      paintLayoutButton();
      saveSoon();
    };
    addEventListener("mousemove", move);
    addEventListener("mouseup", up);
  }

  // Splits `target` at its `side` ("left", "right", "top", "bottom") with a new pane that takes tab `i` of `from`; a
  // pane left without tabs closes. Returns the new pane.
  function splitWith(from, i, target, side) {
    const tab = from.tabs[i];
    if (!tab) return null;
    if (panes.length >= MAX_PANES) {
      LZ.toast(t("tooManyPanes", MAX_PANES));
      return null;
    }
    // The only tab of a pane split beside itself would leave the pane empty where it is: nothing changes.
    if (from === target && from.tabs.length < 2) return null;
    const pane = makePane([]);
    const dir = side === "left" || side === "right" ? "row" : "col";
    const first = side === "left" || side === "top";
    const old = leafOf(target);
    const found = parentOf(old);
    if (found && found[0].dir === dir) {
      const [parent, at] = found;
      const half = parent.sizes[at] / 2;
      parent.sizes[at] = half;
      parent.kids.splice(first ? at : at + 1, 0, leaf(pane));
      parent.sizes.splice(first ? at : at + 1, 0, half);
    } else replace(old, split(dir, first ? [pane, target] : [target, pane]));
    grid.dataset.layout = "custom";
    from.tabs.splice(i, 1);
    pane.tabs.push(tab);
    pane.active = -1;
    renderTree();
    if (!from.tabs.length) closePane(from);
    else {
      const left = i < from.active ? from.active - 1 : Math.min(from.active, from.tabs.length - 1);
      from.active = -1;
      from.activate(left);
    }
    pane.activate(0);
    focus(pane);
    saveSoon();
    return pane;
  }

  // Splits `pane` at `side` with a new pane at the same place, its own tab staying where it is.
  function splitNew(pane, side) {
    if (panes.length >= MAX_PANES) return LZ.toast(t("tooManyPanes", MAX_PANES));
    pane.newTab(pane.tab.uri, null, { background: true });
    return splitWith(pane, pane.tabs.length - 1, pane, side);
  }

  // Closes a pane and its tabs; the pane beside it takes its room.
  function closePane(pane) {
    if (panes.length < 2 || !panes.includes(pane)) return;
    for (const tab of pane.tabs) call("view.close", { view: tab.id }).catch(() => {});
    const old = leafOf(pane);
    const [parent, at] = parentOf(old);
    const room = parent.sizes[at];
    parent.kids.splice(at, 1);
    parent.sizes.splice(at, 1);
    parent.sizes[Math.max(0, at - 1)] += room;
    pane.el.remove();
    grid.dataset.layout = "custom";
    const near = leaves(parent.kids[Math.max(0, at - 1)])[0];
    renderTree();
    if (focused === pane) {
      focused = null;
      focus(near);
      near.list.focus({ preventScroll: true });
    }
    saveSoon();
  }

  // Where a tab dragged to (x, y) over a pane's rows would go: near an edge of the pane, a new pane on that side; in
  // the middle of another pane, among its tabs. Nothing over the pane it comes from unless it can be split.
  function paneDropAt(x, y, from, i) {
    for (const pane of panes) {
      const r = pane.el.getBoundingClientRect();
      if (x < r.left || x > r.right || y < r.top || y > r.bottom) continue;
      const top = pane.tabsEl.hidden ? r.top : pane.tabsEl.getBoundingClientRect().bottom;
      const [fx, fy] = [(x - r.left) / r.width, (y - top) / (r.bottom - top)];
      const canSplit = panes.length < MAX_PANES && (pane !== from || from.tabs.length > 1);
      let side = "center";
      if (canSplit) {
        const edge = Math.min(fx, 1 - fx, fy, 1 - fy);
        if (edge < 0.28) side = edge === fx ? "left" : edge === 1 - fx ? "right" : edge === fy ? "top" : "bottom";
      }
      if (side === "center" && pane === from) return null;
      return { pane, side };
    }
    return null;
  }

  // The tree as layout.json keeps it, each pane by its place in `panes`.
  function treeState(node) {
    return node.pane ? { p: panes.indexOf(node.pane) } : { dir: node.dir, sizes: node.sizes.map((x) => Math.round(x * 10000) / 10000), kids: node.kids.map(treeState) };
  }

  // The tree kept in layout.json over the panes `list`, each used once; null when it does not fit them.
  function treeFrom(saved, list) {
    const used = new Set();
    const walk = (node, depth) => {
      if (!node || typeof node !== "object" || depth > 8) throw 0;
      if (Number.isInteger(node.p)) {
        if (!list[node.p] || used.has(node.p)) throw 0;
        used.add(node.p);
        return leaf(list[node.p]);
      }
      if ((node.dir !== "row" && node.dir !== "col") || !Array.isArray(node.kids) || node.kids.length < 2) throw 0;
      const kids = node.kids.map((k) => walk(k, depth + 1));
      const sizes = kids.map((_, i) => (Number(node.sizes?.[i]) > 0.02 ? Number(node.sizes[i]) : 1 / kids.length));
      const total = sizes.reduce((a, b) => a + b, 0);
      return { dir: node.dir, kids, sizes: sizes.map((x) => x / total) };
    };
    try {
      const built = walk(saved, 0);
      return used.size === list.length ? built : null;
    } catch {
      return null;
    }
  }

  function focus(pane) {
    if (focused === pane) return;
    focused?.el.classList.remove("focus");
    focused = pane;
    pane.el.classList.add("focus");
    Toolbar.update();
    Sidebar.mark();
    emit("selection", { pane });
  }

  // The tab of the focused pane.
  const current = () => focused?.tab;

  function findTab(id) {
    for (const pane of panes) {
      const tab = pane.tabs.find((t) => t.id === id);
      if (tab) return [pane, tab];
    }
    return null;
  }

  // The pane's place changed: the window's title, the sidebar and the toolbar follow, and the layout is kept.
  function changed(pane) {
    if (pane === focused) {
      Toolbar.update();
      Sidebar.mark();
    }
    saveSoon();
  }

  function selectionChanged(pane) {
    pane.renderStatus();
    emit("selection", { pane });
  }

  // The window as layout.json and workspaces keep it.
  function state() {
    return {
      layout: grid.dataset.layout,
      tree: tree ? treeState(tree) : null,
      focus: panes.indexOf(focused),
      sidebarWidth: Sidebar.width(),
      sidebarHidden: $("app").classList.contains("no-sidebar"),
      panes: panes.map((p) => ({ active: p.active, cols: p.cols, tabs: p.tabs.map((tab) => ({ uri: tab.uri, mode: tab.mode, sort: tab.sort, title: tab.title, color: tab.color })) })),
    };
  }

  function saveSoon() {
    if (S.window.role !== "main") return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => call("panes.state", { state: state() }).catch(() => {}), 500);
  }

  // Replaces the panes of the window by those of `saved` (a workspace).
  function load(saved) {
    for (const pane of panes) {
      for (const tab of pane.tabs) call("view.close", { view: tab.id }).catch(() => {});
      pane.el.remove();
    }
    panes.length = 0;
    tree = null;
    focused = null;
    $("app").classList.remove("no-sidebar");
    start(saved);
    saveSoon();
  }

  // Builds the panes from the layout the window had (layout.json), or one pane at home.
  function start(saved, uri) {
    const home = S.places.home || "file:///";
    const layouts = Array.isArray(saved?.panes) && saved.panes.length ? saved.panes.slice(0, MAX_PANES) : [{ tabs: [{ uri: home }] }];
    if (saved?.sidebarWidth) $("app").style.setProperty("--side-w", saved.sidebarWidth);
    if (saved?.sidebarHidden) $("app").classList.add("no-sidebar");
    const list = layouts.map((p) => {
      const tabs = (Array.isArray(p.tabs) ? p.tabs : []).filter((t) => typeof t?.uri === "string").slice(0, 30);
      const pane = makePane(tabs.length ? tabs : [{ uri: home }]);
      pane.active = Math.min(Math.max(0, p.active | 0), pane.tabs.length - 1);
      if (p.cols) Object.assign(pane.cols, p.cols);
      pane.applyCols();
      return pane;
    });
    tree = treeFrom(saved?.tree, list);
    if (tree) grid.dataset.layout = typeof saved.layout === "string" ? saved.layout : "custom";
    else if (!PRESETS[saved?.layout] && list.length > 1) {
      // Panes whose tree was lost stand side by side.
      tree = split("row", list);
      grid.dataset.layout = "custom";
    } else {
      // A preset layout (what windows kept before the tree), with panes at home for those that were not saved.
      const layout = PRESETS[saved?.layout] ? saved.layout : "single";
      while (list.length < LAYOUTS[layout]) list.push(makePane([{ uri: home }]));
      list.splice(LAYOUTS[layout]);
      tree = PRESETS[layout](list);
      grid.dataset.layout = layout;
    }
    renderTree();
    if (uri) panes[0].tab.uri = uri;
    api.sizesOn = !!S.settings.folder_sizes;
    focus(panes[Math.min(Math.max(0, saved?.focus | 0), panes.length - 1)]);
    // Every other tab lists when it is first shown.
    panes.forEach(show);
    focused.list.focus({ preventScroll: true });
  }

  // Changes to one of the preset layouts: the panes there are keep their place in order, a new pane opens where the
  // focused one is, a pane that goes closes its tabs.
  function setLayout(layout) {
    const n = LAYOUTS[layout];
    if (!n || !PRESETS[layout]) return;
    const list = [...panes];
    while (list.length < n) {
      const pane = makePane([{ uri: focused?.tab?.uri || S.places.home }]);
      list.push(pane);
      show(pane);
    }
    for (const pane of list.splice(n)) {
      for (const tab of pane.tabs) call("view.close", { view: tab.id }).catch(() => {});
      pane.el.remove();
      if (focused === pane) focused = null;
    }
    tree = PRESETS[layout](list);
    grid.dataset.layout = layout;
    renderTree();
    if (!focused) focus(panes[panes.length - 1]);
    saveSoon();
  }

  function paintLayoutButton() {
    const layout = grid.dataset.layout;
    if (!api.layoutButton) return;
    api.layoutButton.dataset.sym = `layout.${{ single: "single", h2: "h2", h3: "h2", h4: "h2", v2: "v2" }[layout] || "grid"}`;
    api.layoutButton.innerHTML = icon(api.layoutButton.dataset.sym);
  }

  // Moves the focus to the next pane (or the previous one), as Tab does in QSpace.
  function cycle(step) {
    if (panes.length < 2) return;
    const next = panes[(panes.indexOf(focused) + step + panes.length) % panes.length];
    focus(next);
    next.list.focus({ preventScroll: true });
  }

  // Where a tab dragged to (x, y) would go: the pane whose tab bar is under the point, the index among its tabs (the
  // dragged one, `el`, left out) and where the line that shows it goes in that bar.
  function tabDropAt(x, y, el) {
    for (const pane of panes) {
      if (pane.tabsEl.hidden) continue;
      const bar = pane.tabsEl.getBoundingClientRect();
      if (x < bar.left || x > bar.right || y < bar.top - 14 || y > bar.bottom + 14) continue;
      const others = [...pane.tabStrip.children].filter((t) => t !== el);
      let index = others.findIndex((t) => {
        const r = t.getBoundingClientRect();
        return x < r.left + r.width / 2;
      });
      if (index < 0) index = others.length;
      const edge = others[index] ? others[index].getBoundingClientRect().left - 3 : (others[others.length - 1]?.getBoundingClientRect().right ?? bar.left + 8) + 1;
      return { pane, index, x: edge - bar.left };
    }
    return null;
  }

  // Moves tab `i` of `from` to `index` among the tabs of `to`, where it shows. The last tab of a pane is copied, so no
  // pane is left without one.
  function moveTab(from, i, to, index) {
    const tab = from.tabs[i];
    if (!tab) return;
    if (from === to) {
      from.tabs.splice(i, 1);
      from.tabs.splice(index, 0, tab);
      from.active = index;
      from.renderTabs();
      return saveSoon();
    }
    from.tabs.splice(i, 1);
    // A pane whose last tab goes closes, and the pane that takes the tab has its room.
    if (!from.tabs.length) closePane(from);
    else {
      const left = i < from.active ? from.active - 1 : Math.min(from.active, from.tabs.length - 1);
      from.active = -1;
      from.activate(left);
    }
    to.tabs.splice(index, 0, tab);
    to.active = -1;
    to.activate(index);
    focus(to);
    saveSoon();
  }

  // The places back (or forward) of the pane's tab, nearest first, as a menu; the one chosen is gone to as if by that
  // many steps, so the steps between stay on the other side.
  async function stackMenu(pane, way, x, y) {
    const tab = pane.tab;
    const stack = way === "back" ? tab.back : tab.forward;
    if (!stack.length) return;
    const nearest = [...stack].reverse();
    const id = await LZ.choose(nearest.map((uri, k) => ({ id: String(k), label: placeLabel(uri), icon: "folder" })), x, y);
    if (id == null) return;
    const at = stack.length - 1 - Number(id);
    const to = stack[at];
    const passed = stack.splice(at).slice(1).reverse();
    const other = way === "back" ? tab.forward : tab.back;
    other.push(tab.uri, ...passed);
    pane.navigate(to, { history: false, select: way === "back" ? pane.childOf(to) : null });
  }

  // Opens a place in the focused pane.
  function open(uri, options) {
    focused?.navigate(uri, options);
    focused?.list.focus({ preventScroll: true });
  }

  // The actions of the keymap, the menu bar and the toolbar, on a pane (the focused one by default).
  const actions = {
    open(pane) {
      const tab = pane.tab;
      const entries = tab.selectedEntries();
      if (!entries.length) return;
      // A kind a feature opens as a folder (an archive) is browsed into; the rest the system opens.
      const into = entries.map((e) => (e.isDir ? e.uri : LZ.vfs.browse(e))).filter(Boolean);
      const files = entries.filter((e) => !e.isDir && !LZ.vfs.browse(e));
      if (into.length === 1 && !files.length) return pane.navigate(into[0]);
      for (const uri of into) pane.newTab(uri);
      if (files.length) call("native.open", { uris: files.map((f) => f.uri) }).catch(say);
    },
    openInNewTab(pane) {
      for (const e of pane.tab.selectedEntries().filter((e) => e.isDir)) pane.newTab(e.uri);
    },
    quickLook(pane) {
      const tab = pane.tab;
      if (!tab.selCount()) return;
      const lead = tab.rows.get(tab.lead);
      const selected = tab.selectedEntries();
      const index = Math.max(0, selected.findIndex((e) => e === lead));
      call("native.quicklook", { ...tab.selection(), index }).catch(say);
    },
    duplicate(pane) {
      const tab = pane.tab;
      const uris = tab.selectedEntries().map((e) => e.uri);
      if (uris.length && tab.capabilities.write) call("fs.copy", { from: uris, to: tab.uri, mode: "copy" }).catch(say);
    },
    getInfo(pane) {
      if (pane.tab.selCount()) call("native.get_info", pane.tab.selection()).catch(say);
      else call("native.get_info", { uris: [pane.tab.uri] }).catch(say);
    },
    reveal(pane) {
      const sel = pane.tab.selCount() ? pane.tab.selection() : { uris: [pane.tab.uri] };
      call("native.reveal", sel).catch(say);
    },
    copyPath(pane) {
      const entries = pane.tab.selectedEntries();
      const text = (entries.length ? entries.map((e) => pathOf(e.uri)) : [pathOf(pane.tab.uri)]).join("\n");
      call("clipboard.text", { text }).then(() => toast(t("pathCopied")), say);
    },
    nextPane() {
      cycle(1);
    },
    previousPane() {
      cycle(-1);
    },
    layoutSingle: () => setLayout("single"),
    layoutH2: () => setLayout("h2"),
    layoutV2: () => setLayout("v2"),
    layoutH3: () => setLayout("h3"),
    layoutL1R2: () => setLayout("l1r2"),
    layoutGrid: () => setLayout("grid"),
    layoutH4: () => setLayout("h4"),
    layoutG6: () => setLayout("g6"),
    splitRight: (pane) => pane.tabs.length > 1 ? splitWith(pane, pane.active, pane, "right") : splitNew(pane, "right"),
    splitDown: (pane) => pane.tabs.length > 1 ? splitWith(pane, pane.active, pane, "bottom") : splitNew(pane, "bottom"),
    closePane: (pane) => closePane(pane),
    back(pane) {
      const tab = pane.tab;
      if (!tab.back.length) return;
      const from = tab.uri;
      tab.forward.push(from);
      const to = tab.back.pop();
      pane.navigate(to, { history: false, select: pane.childOf(to) });
    },
    forward(pane) {
      const tab = pane.tab;
      if (!tab.forward.length) return;
      tab.back.push(tab.uri);
      pane.navigate(tab.forward.pop(), { history: false });
    },
    enclosing(pane) {
      const uri = pane.tab.uri;
      const path = pathOf(uri);
      if (uri.startsWith("archive://")) {
        const cut = path.indexOf("!");
        const archive = path.slice(0, cut);
        const inside = path.slice(cut + 1).replace(/^\/|\/$/g, "");
        if (!inside) return pane.navigate(fileUri(archive.slice(0, archive.lastIndexOf("/")) || "/"), { select: [archive.split("/").pop()] });
        const up = inside.includes("/") ? inside.slice(0, inside.lastIndexOf("/")) : "";
        return pane.navigate(archiveUri(archive, up), { select: [inside.split("/").pop()] });
      }
      if (path === "/") return;
      const parent = path.slice(0, path.lastIndexOf("/")) || "/";
      pane.navigate(withPath(uri, parent), { select: [path.split("/").pop()] });
    },
    rename(pane) {
      const tab = pane.tab;
      if (tab.selCount() !== 1) return;
      const name = tab.all ? null : [...tab.sel][0];
      if (name) pane.startRename(name);
    },
    trash(pane) {
      const tab = pane.tab;
      if (!tab.selCount()) return;
      if (!tab.capabilities.trash) return actions.delete(pane);
      goOut(pane, "fs.trash");
    },
    async delete(pane) {
      const tab = pane.tab;
      const n = tab.selCount();
      if (!n) return;
      const ok = await confirmSheet(t("deleteTitle", n), t("deleteText"), t("deleteNow"));
      if (ok) goOut(pane, "fs.delete");
    },
    newFolder(pane) {
      const tab = pane.tab;
      if (!tab.capabilities.write) return;
      call("fs.mkdir", { uri: tab.uri })
        .then((entry) => {
          tab.pendingRename = entry.name;
          pane.refresh();
        })
        .catch(say);
    },
    selectAll(pane) {
      pane.selectAll();
    },
    selectNone(pane) {
      pane.tab.clearSel();
      pane.render();
      selectionChanged(pane);
    },
    // Everything not selected becomes selected and the other way round, without loading a huge folder's rows: all but
    // some, turned over, is just those.
    invertSelection(pane) {
      const tab = pane.tab;
      const kept = tab.all ? new Set(tab.except) : null;
      if (kept) {
        tab.clearSel();
        kept.forEach((name) => tab.sel.add(name));
      } else {
        const except = new Set(tab.sel);
        tab.clearSel();
        tab.all = true;
        except.forEach((name) => tab.except.add(name));
      }
      pane.render();
      selectionChanged(pane);
    },
    // Each selected folder, or the pane's own when none is, in a window of its own.
    openInNewWindow(pane) {
      const folders = pane.tab.selectedEntries().filter((e) => e.isDir);
      for (const uri of (folders.length ? folders.map((e) => e.uri) : [pane.tab.uri]).slice(0, 8)) call("app.new_window", { uri }).catch(say);
    },
    copy(pane) {
      if (!pane.tab.selCount()) return;
      flashSelected(pane);
      call("clipboard.copy", pane.tab.selection()).then(updateCut, say);
    },
    cut(pane) {
      if (!pane.tab.selCount()) return;
      flashSelected(pane);
      call("clipboard.cut", pane.tab.selection()).then(updateCut, say);
    },
    paste(pane) {
      call("clipboard.paste", { to: pane.tab.uri }).catch(say);
    },
    undo() {
      call("fs.undo").catch(say);
    },
    toggleHidden() {
      setSetting({ show_hidden: !S.settings.show_hidden });
    },
    viewList(pane) {
      setMode(pane, "list");
    },
    viewIcons(pane) {
      setMode(pane, "icons");
    },
    viewColumns(pane) {
      setMode(pane, "columns");
    },
    viewGallery(pane) {
      setMode(pane, "gallery");
    },
    newTab(pane) {
      pane.newTab();
    },
    closeTab(pane) {
      pane.closeTab(pane.active);
    },
    editAddress(pane) {
      pane.editAddress();
    },
    find() {
      Toolbar.openSearch();
    },
    deselect(pane) {
      pane.tab.clearSel();
      pane.render();
      selectionChanged(pane);
    },
    toggleSidebar() {
      Sidebar.toggle();
    },
    home(pane) {
      pane.navigate(S.places.home);
    },
    desktop(pane) {
      pane.navigate(S.places.desktop);
    },
    downloads(pane) {
      pane.navigate(S.places.downloads);
    },
    applications(pane) {
      pane.navigate(S.places.applications);
    },
  };

  function action(name, pane = focused) {
    const fn = actions[name];
    if (fn && pane) fn(pane);
    return !!fn;
  }

  function setMode(pane, mode) {
    pane.tab.mode = mode;
    pane.list.scrollTop = 0;
    pane.renderAll();
    Toolbar.update();
    saveSoon();
    setSetting({ view_mode: mode });
  }

  // The selection plays out, then goes (`method`: fs.trash or fs.delete); it comes back into sight if that fails. The
  // selection is taken before the motion, which a click during it must not change.
  async function goOut(pane, method) {
    const selection = pane.tab.selection();
    const out = pane.leave(pane.tab.selectedEntries().map((e) => e.name));
    await out.done;
    call(method, selection).catch((error) => {
      out.back();
      say(error);
    });
  }

  function flashSelected(pane) {
    for (const el of pane.pool.values()) if (el.classList.contains("sel")) Motion.flash(el);
  }

  // The items that were cut are drawn faded until they are pasted or the clipboard changes.
  function updateCut() {
    call("clipboard.state")
      .then((d) => {
        cut.clear();
        d.cut.forEach((u) => cut.add(u));
        panes.forEach((p) => p.render());
      })
      .catch(() => {});
  }

  on("view.changed", (d) => {
    const found = findTab(d.view);
    if (!found) return;
    const [pane, tab] = found;
    // A place opened in a main window goes into the path history, once, as typed when it came from the path bar.
    if (S.window.role === "main" && !samePlace(tab.recorded, d.uri)) {
      tab.recorded = d.uri;
      call("history.add", { uri: d.uri, typed: samePlace(tab.typed, d.uri) }).catch(() => {});
      tab.typed = null;
    }
    // The same folder listed again (it changed): its items move rather than jump.
    if (pane.tab === tab && tab.generation && samePlace(tab.uri, d.uri)) pane.snapshot(true);
    tab.uri = d.uri;
    tab.generation = d.generation;
    tab.count = d.count;
    tab.capabilities = d.capabilities;
    tab.groups = d.groups || [];
    tab.free = d.free;
    tab.loading = false;
    tab.error = null;
    tab.rows = new Map();
    tab.byName = new Map();
    if (pane.tab === tab) {
      pane.renderAll();
      if (tab.pendingSelect) pane.seek(tab.pendingSelect);
      if (tab.pendingRename) pane.seek([tab.pendingRename]);
    }
    if (pane === focused) {
      Toolbar.update();
      Sidebar.mark();
    }
  });
  on("view.error", (d) => {
    const found = findTab(d.view);
    if (!found) return;
    const [pane, tab] = found;
    tab.loading = false;
    tab.error = d.error;
    if (pane.tab === tab) pane.renderAll();
  });
  on("view.sizes", (d) => {
    const found = findTab(d.view);
    if (!found) return;
    const [pane, tab] = found;
    if (d.generation !== tab.generation) return;
    for (const [name, size] of Object.entries(d.sizes)) {
      const row = tab.entry(name);
      if (row) row.dirSize = size;
    }
    if (pane.tab === tab) pane.render();
  });
  let shownColumns = null;
  on("settings.changed", (s) => {
    const columns = JSON.stringify(s.columns);
    const recolumn = shownColumns !== null && columns !== shownColumns;
    shownColumns = columns;
    for (const pane of panes) {
      pane.renderTabs();
      if (recolumn) {
        pane.applyCols();
        pane.renderAll();
      }
      for (const tab of pane.tabs) {
        if (pane.tab === tab && tab.generation && !!s.show_hidden !== tab.showHidden) {
          tab.showHidden = !!s.show_hidden;
          call("view.hidden", { view: tab.id, show: tab.showHidden })
            .then((d) => pane.tab === tab && pane.regenerate(d.generation, d.count, d.groups))
            .catch(() => {});
        }
      }
      if (!!s.folder_sizes !== api.sizesOn && pane.tab.generation) call("fs.sizes", { view: pane.tab.id, on: !!s.folder_sizes }).catch(() => {});
    }
    api.sizesOn = !!s.folder_sizes;
  });
  on("jobs.finished", (d) => {
    if (d.ok && d.data?.names?.length && d.data.to) {
      const pane = panes.find((p) => samePlace(p.tab.uri, d.data.to));
      if (pane) pane.tab.pendingSelect = d.data.names;
    }
    // The watcher brings local changes in too; a place it does not follow is brought up to date here.
    for (const pane of panes) if (pane.tab.generation && !isLocal(pane.tab.uri)) pane.refresh();
    updateCut();
  });

  const api = {
    start,
    open,
    setLayout,
    state,
    load,
    focus,
    current,
    focused: () => focused,
    all: () => panes,
    findTab,
    tabDropAt,
    paneDropAt,
    moveTab,
    splitWith,
    splitNew,
    closePane,
    MAX_PANES,
    stackMenu,
    changed,
    selectionChanged,
    saveSoon,
    action,
    actions,
    emit,
    on(name, fn) {
      (listeners[name] ||= []).push(fn);
    },
    cut,
    sizesOn: false,
  };
  return api;
})();

<script>
// The toolbar: back and forward with the folder's name, the view, new folder and Trash, and the filter of the focused
// pane. It follows the focused pane, and the window's title is the names of the panes' folders.
const Toolbar = (() => {
  // Each button keeps the name of its icon, which the overflow menu shows beside it.
  const set = (id, name) => {
    $(id).insertAdjacentHTML("afterbegin", icon(name));
    $(id).dataset.sym = name;
  };
  set("tbBack", "chevron.left");
  set("tbForward", "chevron.right");
  set("tbNewFolder", "folder.plus");
  set("tbTrash", "trash");
  set("tbMore", "chevron.right.2");
  $("tbSearchIcon").innerHTML = icon("search");
  // The four views of Finder, in Finder's order; the action of each is "view" and its name.
  const VIEWS = { icons: ["grid", "viewIcons"], list: ["list", "viewList"], columns: ["columns", "viewColumns"], gallery: ["gallery", "viewGallery"] };
  for (const b of $("tbView").querySelectorAll("[data-view]")) {
    b.dataset.sym = VIEWS[b.dataset.view][0];
    b.insertAdjacentHTML("afterbegin", icon(b.dataset.sym));
  }

  // Too narrow a toolbar folds as NSToolbar does: the title goes first, then the search becomes a button, then the
  // groups of buttons go into the overflow menu one by one, the actions before the view. Each width is worked out
  // from nothing, so the toolbar unfolds as it widens.
  const FOLDS = ["fold-title", "fold-search", "fold-actions", "fold-view", "fold-right"];
  const GROUPS = { "fold-actions": () => $("tbActions"), "fold-view": () => $("tbView"), "fold-right": () => document.querySelector('.toolbar > [data-slot="toolbar.right"]') };
  function fit() {
    const bar = $("toolbar");
    bar.classList.remove(...FOLDS);
    $("tbOverflow").hidden = true;
    for (const fold of FOLDS) {
      if (bar.scrollWidth <= bar.clientWidth) break;
      bar.classList.add(fold);
      if (GROUPS[fold]) $("tbOverflow").hidden = false;
    }
  }
  new ResizeObserver(fit).observe($("toolbar"));
  // Buttons that features add come after this part.
  window.addEventListener("DOMContentLoaded", fit);

  // The SF Symbol of an icon's name, for a native menu.
  const symbolOf = (name) => {
    const value = ICONS[name] || "";
    return value && !value.startsWith("<") ? value.split("/").pop().split(",")[0] : undefined;
  };
  // The folded buttons as a native menu, a line between groups; the one chosen runs as if clicked, its own menu (if it
  // has one) opening under the overflow button.
  $("tbMore").addEventListener("click", async () => {
    const bar = $("toolbar");
    const buttons = [];
    const choices = [];
    for (const fold of FOLDS) {
      if (!GROUPS[fold] || !bar.classList.contains(fold)) continue;
      const group = [...GROUPS[fold]().querySelectorAll(".tb")];
      if (!group.length) continue;
      if (choices.length) choices.push({ separator: true });
      for (const b of group) {
        choices.push({ id: String(buttons.length), label: b.title || b.getAttribute("aria-label") || "", icon: symbolOf(b.dataset.sym), enabled: !b.disabled, checked: b.classList.contains("on") });
        buttons.push(b);
      }
    }
    const r = $("tbMore").getBoundingClientRect();
    const id = await LZ.choose(choices, r.left, r.bottom + 6);
    const b = id == null ? null : buttons[Number(id)];
    if (!b) return;
    if (b.run) b.run(new MouseEvent("click"), $("tbMore"));
    else b.click();
  });

  // A folded search is a button that opens the field over the end of the toolbar.
  function openSearch() {
    if ($("toolbar").classList.contains("fold-search")) $("tbSearch").classList.add("open");
    $("searchInput").focus();
    $("searchInput").select();
  }
  $("tbSearch").addEventListener("mousedown", (e) => {
    if (!$("toolbar").classList.contains("fold-search") || $("tbSearch").classList.contains("open")) return;
    e.preventDefault();
    openSearch();
  });
  $("searchInput").addEventListener("blur", () => {
    if (!$("searchInput").value) $("tbSearch").classList.remove("open");
  });

  let shownTitle = null;
  function update() {
    const pane = Panes.focused();
    const tab = pane?.tab;
    if (!tab) return;
    const title = tab.uri ? placeName(tab.uri) : "LazySpace";
    $("title").textContent = title;
    if (title !== shownTitle) {
      shownTitle = title;
      fit();
    }
    $("tbBack").disabled = !tab.back.length;
    $("tbForward").disabled = !tab.forward.length;
    for (const b of $("tbView").querySelectorAll("[data-view]")) b.classList.toggle("on", b.dataset.view === tab.mode);
    $("tbNewFolder").disabled = !tab.capabilities.write;
    $("tbTrash").disabled = !tab.selCount();
    // Search results show their words in the field.
    const words = schemeOf(tab.uri) === "search" ? new URLSearchParams(authorityOf(tab.uri)).get("q") || "" : "";
    if (document.activeElement !== $("searchInput")) $("searchInput").value = tab.filter || words;
    document.title = Panes.all().map((p) => (p.tab?.uri ? placeName(p.tab.uri) : "")).filter(Boolean).join(" | ") || "LazySpace";
  }

  $("tbBack").addEventListener("click", () => Panes.action("back"));
  $("tbForward").addEventListener("click", () => Panes.action("forward"));
  // Right-clicked, they list where they go, as Finder's do.
  for (const [id, way] of [["tbBack", "back"], ["tbForward", "forward"]]) {
    $(id).addEventListener("contextmenu", (e) => {
      e.preventDefault();
      const r = $(id).getBoundingClientRect();
      if (Panes.focused()) Panes.stackMenu(Panes.focused(), way, r.left, r.bottom + 6);
    });
  }
  $("tbNewFolder").addEventListener("click", () => Panes.action("newFolder"));
  $("tbTrash").addEventListener("click", () => Panes.action("trash"));
  $("tbView").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (b) Panes.action(VIEWS[b.dataset.view][1]);
  });

  // The filter narrows the focused pane to the items whose name holds what is typed.
  let filterTimer;
  $("searchInput").addEventListener("input", () => {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(() => {
      const pane = Panes.focused();
      const tab = pane?.tab;
      if (!tab?.generation) return;
      // Search results are searched again with Enter (19-search.js): filtered as typed, they would lose the matches
      // found without their accents.
      if (schemeOf(tab.uri) === "search") return;
      tab.filter = $("searchInput").value;
      call("view.filter", { view: tab.id, text: tab.filter })
        .then((d) => pane.tab === tab && pane.regenerate(d.generation, d.count, d.groups))
        .catch(say);
    }, 120);
  });
  $("searchInput").addEventListener("keydown", (e) => {
    // The offers of a search under the field take their keys first (19-search.js).
    if (typeof Search !== "undefined" && Search.keydown(e)) return;
    if (e.key === "Escape") {
      $("searchInput").value = "";
      $("searchInput").dispatchEvent(new Event("input"));
      $("tbSearch").classList.remove("open");
      Panes.focused()?.list.focus();
    } else if (e.key === "Enter" || e.key === "ArrowDown") {
      e.preventDefault();
      Panes.focused()?.list.focus();
      Panes.focused()?.move(1, false);
    }
  });

  // What the menu bar asks for, by the ids of src/menus.rs.
  const MENU = {
    "file.new_tab": "newTab",
    "file.new_folder": "newFolder",
    "file.eject": "eject",
    "file.close_tab": "closeTab",
    "view.list": "viewList",
    "view.icons": "viewIcons",
    "view.columns": "viewColumns",
    "view.gallery": "viewGallery",
    "view.hidden": "toggleHidden",
    "go.back": "back",
    "go.forward": "forward",
    "go.enclosing": "enclosing",
    "go.home": "home",
    "go.desktop": "desktop",
    "go.downloads": "downloads",
    "go.applications": "applications",
  };
  on("menu.action", (d) => {
    if (MENU[d.id]) Panes.action(MENU[d.id]);
  });
  Panes.on("selection", update);

  return { update, fit, openSearch };
})();

<script>
// The keys of the list, as data: a chord ("Cmd+Shift+N") names an action of Panes. The Mac keys are the default; the
// Windows ones (Ctrl+C, Enter opens, F2 renames) follow settings.keymap. A feature adds keys with Keys.add.
const KEYMAPS = {
  mac: {
    Enter: "rename",
    Space: "quickLook",
    Tab: "nextPane",
    "Shift+Tab": "previousPane",
    "Cmd+1": "viewIcons",
    "Cmd+2": "viewList",
    "Cmd+3": "viewColumns",
    "Cmd+4": "viewGallery",
    "Cmd+Alt+1": "layoutSingle",
    "Cmd+Alt+2": "layoutH2",
    "Cmd+Alt+3": "layoutV2",
    "Cmd+Alt+4": "layoutH3",
    "Cmd+Alt+5": "layoutL1R2",
    "Cmd+Alt+6": "layoutGrid",
    "Cmd+Alt+7": "layoutH4",
    "Cmd+Alt+8": "layoutG6",
    "Cmd+\\": "splitRight",
    "Cmd+Shift+\\": "splitDown",
    "Cmd+D": "duplicate",
    "Cmd+I": "getInfo",
    "Cmd+Alt+C": "copyPath",
    "Cmd+Shift+R": "reveal",

    "Cmd+ArrowUp": "enclosing",

    "Cmd+]": "forward",
    "Cmd+Backspace": "trash",
    "Cmd+Alt+Backspace": "delete",
    "Cmd+Shift+N": "newFolder",
    "Cmd+A": "selectAll",
    "Cmd+C": "copy",
    "Cmd+X": "cut",
    "Cmd+V": "paste",
    "Cmd+Z": "undo",
    "Cmd+Shift+.": "toggleHidden",
    "Cmd+T": "newTab",
    "Cmd+W": "closeTab",
    "Cmd+L": "editAddress",
    "Cmd+Shift+G": "editAddress",
    "Cmd+F": "find",
    "Cmd+Alt+S": "toggleSidebar",
    "Cmd+Shift+H": "home",
    "Cmd+Shift+D": "desktop",
    "Cmd+Alt+L": "downloads",
    "Cmd+Shift+A": "applications",
    Escape: "deselect",
  },
  windows: {
    Enter: "open",
    Space: "quickLook",
    Tab: "nextPane",
    "Shift+Tab": "previousPane",
    "Ctrl+1": "viewIcons",
    "Ctrl+2": "viewList",
    "Ctrl+3": "viewColumns",
    "Ctrl+4": "viewGallery",
    "Cmd+Alt+1": "layoutSingle",
    "Cmd+Alt+2": "layoutH2",
    "Cmd+Alt+3": "layoutV2",
    "Cmd+Alt+4": "layoutH3",
    "Cmd+Alt+5": "layoutL1R2",
    "Cmd+Alt+6": "layoutGrid",
    "Cmd+Alt+7": "layoutH4",
    "Cmd+Alt+8": "layoutG6",
    "Cmd+\\": "splitRight",
    "Cmd+Shift+\\": "splitDown",
    "Ctrl+D": "duplicate",
    "Alt+Enter": "getInfo",
    "Ctrl+Shift+C": "copyPath",
    F2: "rename",
    Delete: "trash",
    "Shift+Delete": "delete",
    Backspace: "enclosing",
    "Alt+ArrowUp": "enclosing",
    "Alt+ArrowLeft": "back",
    "Alt+ArrowRight": "forward",
    "Ctrl+Shift+N": "newFolder",
    "Ctrl+A": "selectAll",
    "Ctrl+C": "copy",

    "Ctrl+L": "editAddress",
    "Ctrl+F": "find",
    "Cmd+Alt+S": "toggleSidebar",
    Escape: "deselect",
  },
};

const Keys = (() => {
  // The keys features add, for both keymaps or for one.
  const extra = { all: {}, mac: {}, windows: {} };
  const PUNCT = { Period: ".", Comma: ",", BracketLeft: "[", BracketRight: "]", Slash: "/", Backslash: "\\", Minus: "-", Equal: "=", Semicolon: ";", Quote: "'", Backquote: "`" };

  // The chord of a key event: modifiers in a fixed order, then the key by its place on the keyboard, so Shift+. is
  // not read as ">" and a Vietnamese layout gives the same chords.
  function chord(e) {
    let key = e.code.startsWith("Key") ? e.code.slice(3) : e.code.startsWith("Digit") ? e.code.slice(5) : PUNCT[e.code] || e.key;
    if (key === " ") key = "Space";
    return `${e.metaKey ? "Cmd+" : ""}${e.ctrlKey ? "Ctrl+" : ""}${e.altKey ? "Alt+" : ""}${e.shiftKey ? "Shift+" : ""}${key}`;
  }

  const keymap = () => (S.settings.keymap === "windows" ? "windows" : "mac");
  const map = () => ({ ...KEYMAPS[keymap()], ...extra.all, ...extra[keymap()] });

  // Moves in the list: the arrows, Home, End and the pages, by one row in a list and by a line of icons in a grid.
  function moveKey(pane, e) {
    const mode = pane.tab.mode;
    // The column view goes out to the folder on the left and into the folder selected on the right.
    if (mode === "columns" && (e.key === "ArrowLeft" || e.key === "ArrowRight") && !e.metaKey && !e.ctrlKey && !e.altKey) {
      Panes.action(e.key === "ArrowLeft" ? "columnOut" : "columnIn", pane);
      return true;
    }
    // A gallery's strip runs sideways: every arrow moves by one.
    if (mode === "gallery" && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey) {
      pane.move(e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 1, e.shiftKey);
      return true;
    }
    const icons = mode === "icons";
    const per = icons ? pane.per || 1 : 1;
    const page = Math.max(1, Math.floor(pane.list.clientHeight / (pane.rowH || ROW_H)) - 1) * per;
    const steps = {
      ArrowDown: per,
      ArrowUp: -per,
      ArrowRight: icons ? 1 : 0,
      ArrowLeft: icons ? -1 : 0,
      PageDown: page,
      PageUp: -page,
      Home: -Infinity,
      End: Infinity,
    };
    const step = steps[e.key];
    if (step === undefined || e.metaKey || e.ctrlKey || e.altKey) return false;
    if (step === 0) return true;
    if (!Number.isFinite(step)) {
      pane.tab.lead = step > 0 ? pane.tab.count : -1;
      pane.move(step > 0 ? -1 : 1, e.shiftKey);
    } else pane.move(step, e.shiftKey);
    return true;
  }

  document.addEventListener("keydown", (e) => {
    if (sheetOpen() || e.isComposing) return;
    const field = e.target.closest?.("input, textarea, select");
    if (field) return;
    const pane = Panes.focused();
    if (!pane) return;
    if (moveKey(pane, e)) {
      e.preventDefault();
      return;
    }
    const name = map()[chord(e)];
    if (name && Panes.action(name, pane)) {
      e.preventDefault();
      return;
    }
    // Typing a name finds it.
    if (e.key.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey && e.key !== " ") {
      e.preventDefault();
      pane.find(e.key.toLowerCase());
    }
  });

  // Selection is drawn in the accent colour only while the window is in front, as macOS draws it.
  window.addEventListener("blur", () => document.body.classList.add("inactive"));
  window.addEventListener("focus", () => document.body.classList.remove("inactive"));

  return {
    chord,
    map,
    add(chords, only = "all") {
      Object.assign(extra[only] || extra.all, chords);
    },
    keymap,
  };
})();
</script>
<script>
// Jobs on the page: a row with a bar for each one that takes more than a moment, and the questions a job asks while it
// waits (an item already there, a password, a yes or no).
words({
  vi: {
    conflictTitle: "Đã có một mục tên \"{0}\" ở đây.", conflictText: "Bạn muốn thay thế nó, giữ cả hai, hay bỏ qua mục này?",
    conflictFolder: "Đã có một thư mục tên \"{0}\" ở đây. Gộp sẽ đưa nội dung vào thư mục có sẵn và hỏi với từng mục trùng tên.",
    incoming: "Mục mới", existing: "Mục đang có", applyAll: "Áp dụng cho tất cả", stop: "Dừng", skip: "Bỏ qua", merge: "Gộp",
    pauseJob: "Tạm dừng", resumeJob: "Chạy tiếp", jobPaused: "Đã tạm dừng",
    replace: "Thay thế", keepBoth: "Giữ cả hai", working: "Đang làm...", password: "Nhập mật khẩu cho {0}", ok: "OK", yes: "Có",
  },
  en: {
    conflictTitle: "An item named \"{0}\" is already here.", conflictText: "Do you want to replace it, keep both, or skip this item?",
    conflictFolder: "A folder named \"{0}\" is already here. Merging puts the contents into it and asks about each item with the same name.",
    incoming: "Incoming", existing: "Already here", applyAll: "Apply to all", stop: "Stop", skip: "Skip", merge: "Merge",
    pauseJob: "Pause", resumeJob: "Resume", jobPaused: "Paused",
    replace: "Replace", keepBoth: "Keep Both", working: "Working...", password: "Enter the password for {0}", ok: "OK", yes: "Yes",
  },
});

const Jobs = (() => {
  const rows = new Map();
  const questions = [];
  let asking = null;
  $("conflictSheet").dataset.modal = "1";

  function row(id) {
    return rows.get(id);
  }

  on("jobs.started", (d) => {
    const el = document.createElement("div");
    el.className = "job";
    el.innerHTML = `<div class="what"></div><div class="job-tools"><button class="stop pause" title="${esc(t("pauseJob"))}">${icon("pause")}</button><button class="stop" data-stop title="${esc(t("stop"))}">${icon("xmark")}</button></div><div class="bar wait"><i></i></div><div class="now"></div>`;
    el.querySelector(".what").textContent = d.title;
    el.querySelector("[data-stop]").addEventListener("click", () => call("jobs.cancel", { id: d.id }).catch(() => {}));
    // A job is paused at its next step and goes on where it was.
    el.querySelector(".pause").addEventListener("click", () => call("jobs.pause", { id: d.id, paused: !el.classList.contains("paused") }).catch(() => {}));
    // A job over in a moment never shows.
    const timer = setTimeout(() => $("jobs").appendChild(el), 450);
    rows.set(d.id, { el, timer });
  });

  on("jobs.paused", (d) => {
    const r = row(d.id);
    if (!r) return;
    r.el.classList.toggle("paused", d.paused);
    const b = r.el.querySelector(".pause");
    b.innerHTML = icon(d.paused ? "play" : "pause");
    b.title = t(d.paused ? "resumeJob" : "pauseJob");
    if (d.paused) r.el.querySelector(".now").textContent = t("jobPaused");
  });

  on("jobs.progress", (d) => {
    const r = row(d.id);
    if (!r) return;
    const bar = r.el.querySelector(".bar");
    if (d.total > 0) {
      bar.classList.remove("wait");
      bar.querySelector("i").style.width = `${Math.min(100, (100 * d.done) / d.total)}%`;
    }
    r.el.querySelector(".now").textContent = d.current || "";
  });

  on("jobs.finished", (d) => {
    const r = row(d.id);
    if (r) {
      clearTimeout(r.timer);
      r.el.remove();
      rows.delete(d.id);
    }
    if (!d.ok && !d.cancelled && d.error) say(d.error);
    // A question of a job that ended is no longer asked.
    for (let i = questions.length - 1; i >= 0; i--) if (questions[i].id === d.id) questions.splice(i, 1);
    if (asking?.id === d.id) {
      asking = null;
      closeSheets();
      next();
    }
  });

  on("jobs.ask", (d) => {
    questions.push(d);
    if (!asking) next();
  });

  function answer(value, all = false) {
    const q = asking;
    asking = null;
    closeSheets();
    if (q) call("jobs.answer", { id: q.id, answer: value, applyAll: all }).catch(say);
    setTimeout(next, 30);
  }

  function next() {
    if (asking || !questions.length) return;
    asking = questions.shift();
    const q = asking.question;
    if (q.type === "conflict") {
      $("conflictTitle").textContent = t("conflictTitle", q.name);
      $("conflictText").textContent = q.folder ? t("conflictFolder", q.name) : t("conflictText");
      const side = (x) => (x ? `${x.isDir ? "--" : fmtSize(x.size)}, ${fmtDate(x.mtime)}` : "");
      $("conflictCompare").innerHTML = `<span>${esc(t("incoming"))}</span><b>${esc(side(q.source))}</b><span>${esc(t("existing"))}</span><b>${esc(side(q.target))}</b>`;
      $("conflictSheet").querySelector('[data-answer="merge"]').hidden = !q.folder;
      $("conflictAll").checked = false;
      openSheet("conflictSheet");
      setTimeout(() => $("conflictSheet").querySelector('[data-answer="keepBoth"]').focus(), 30);
    } else if (q.type === "confirm") {
      confirmSheet(q.text, "", t("yes")).then((yes) => answer(yes ? "yes" : "no"));
    } else if (q.type === "password") {
      LZ.prompt(t("password", q.what), { secret: true }).then((text) => answer(text == null ? "stop" : { text }));
    }
  }

  $("conflictSheet").addEventListener("click", (e) => {
    const b = e.target.closest("[data-answer]");
    if (b) answer(b.dataset.answer, $("conflictAll").checked);
  });
  document.addEventListener("keydown", (e) => {
    if (!asking || !$("conflictSheet").classList.contains("open")) return;
    if (e.key === "Escape") answer("stop");
  });

  return { answer };
})();
</script>
<script>
// What features build on (design.md section 6.4): the context menu as a registry of items shown as a native menu,
// toolbar buttons, sidebar sections, settings sections, ways to open a kind of item, and the pane layouts, drag and
// drop and Quick Look of the core.
words({
  vi: {
    layout: "Bố cục", "layout.single": "Một khung", "layout.h2": "Hai khung cạnh nhau", "layout.v2": "Hai khung trên dưới",
    "layout.h3": "Ba khung cạnh nhau", "layout.l1r2": "Một trái, hai phải", "layout.grid": "Bốn khung (lưới 2x2)",
    "layout.h4": "Bốn khung cạnh nhau", "layout.g6": "Sáu khung (lưới 3x2)", "layout.custom": "Bố cục tự chia",
  },
  en: {
    layout: "Layout", "layout.single": "One Pane", "layout.h2": "Two Panes Side by Side", "layout.v2": "Two Panes Stacked",
    "layout.h3": "Three Panes Side by Side", "layout.l1r2": "One Left, Two Right", "layout.grid": "Four Panes (2x2 Grid)",
    "layout.h4": "Four Panes Side by Side", "layout.g6": "Six Panes (3x2 Grid)", "layout.custom": "Your Own Split",
  },
});

const LAYOUTS = { single: 1, h2: 2, v2: 2, h3: 3, l1r2: 3, grid: 4, h4: 4, g6: 6 };

const LZ = (() => {
  const items = [];
  const openers = [];
  let menuCtx = null;
  let menuItems = new Map();

  // The keymap's chord for an action, to show beside a menu item.
  function shortcutOf(action) {
    if (!action) return undefined;
    const map = Keys.map();
    return Object.keys(map).find((chord) => map[chord] === action);
  }

  // The items that fit `ctx`, in their groups, as the tree src/contextmenu.rs takes; each item is kept by id for the
  // answer.
  function nodes(list, ctx) {
    const fits = list.filter((item) => !item.when || item.when(ctx)).sort((a, b) => (a.group ?? 50) - (b.group ?? 50) || (a.order ?? 50) - (b.order ?? 50));
    const out = [];
    let group = null;
    for (const item of fits) {
      if (group !== null && item.group !== group) out.push({ separator: true });
      group = item.group;
      menuItems.set(item.id, item);
      const sub = typeof item.submenu === "function" ? item.submenu(ctx) : item.submenu;
      out.push({
        id: item.id,
        label: typeof item.label === "function" ? item.label(ctx) : t(item.label),
        icon: item.icon,
        enabled: item.enabled ? !!item.enabled(ctx) : true,
        checked: item.checked ? !!item.checked(ctx) : false,
        shortcut: shortcutOf(item.action),
        submenu: sub ? nodes(sub, ctx) : [],
      });
    }
    return out;
  }

  const menu = {
    // An item of the context menu: { id, label, icon (an SF Symbol), group, order, when(ctx), run(ctx), action (the
    // keymap action whose chord is shown), checked(ctx), enabled(ctx), submenu }.
    add(item) {
      const at = items.findIndex((i) => i.id === item.id);
      if (at >= 0) items.splice(at, 1);
      items.push(item);
    },
    // Every top-level item, in the order of the groups, for the menu editor.
    list() {
      return [...items].sort((a, b) => (a.group ?? 50) - (b.group ?? 50) || (a.order ?? 50) - (b.order ?? 50)).map((i) => ({ id: i.id, label: t(typeof i.label === "string" ? i.label : i.id), icon: i.icon, group: i.group ?? 50 }));
    },
    // Shows the menu for `ctx` at the point of `event` (or `x`, `y`).
    show(ctx, x, y) {
      menuItems = new Map();
      const tree = nodes(items, ctx);
      if (!tree.length) return;
      menuCtx = ctx;
      const uris = (ctx.entries || []).map((e) => e.uri);
      call("menu.show", { items: tree, x, y, uris }).catch(say);
    },
  };
  on("menu.chosen", (d) => {
    const item = menuItems.get(d.id);
    if (item?.run && menuCtx) item.run(menuCtx);
    menuCtx = null;
  });
  on("menu.closed", () => (menuCtx = null));

  // A small native menu of choices (the layout button, a sort): `choices` are { id, label, icon, checked, enabled,
  // submenu }, a submenu being a list of choices too.
  function choose(choices, x, y) {
    return new Promise((resolve) => {
      const done = (id) => {
        off();
        resolve(id);
      };
      const chosen = (d) => done(d.id);
      const closed = () => done(null);
      const off = () => {
        handlers["menu.chosen"] = (handlers["menu.chosen"] || []).filter((f) => f !== chosen);
        handlers["menu.closed"] = (handlers["menu.closed"] || []).filter((f) => f !== closed);
      };
      on("menu.chosen", chosen);
      on("menu.closed", closed);
      const node = (c) => (c.separator ? { separator: true } : { id: c.id, label: c.label, icon: c.icon, checked: !!c.checked, enabled: c.enabled !== false, submenu: (c.submenu || []).map(node) });
      const items = choices.map(node);
      call("menu.show", { items, x, y }).catch(() => done(null));
    });
  }

  const toolbar = {
    // A button in the toolbar: { id, side: "left" | "right", icon, label, run }. Returns the button.
    add({ id, side = "right", icon: iconName, label, run }) {
      const slot = document.querySelector(`[data-slot="toolbar.${side}"]`);
      const b = document.createElement("button");
      b.className = "tb";
      b.id = `tb-${id}`;
      b.dataset.tt = label;
      b.dataset.sym = iconName;
      b.innerHTML = icon(iconName);
      // The overflow menu of a folded toolbar runs it from its own button (04-core-toolbar.js).
      b.run = run;
      b.addEventListener("click", (e) => run(e, b));
      slot.appendChild(b);
      applyLang();
      return b;
    },
  };

  const sidebar = {
    // A section of the sidebar between the bookmarks and the disks: render(el) fills it, and again on refresh().
    section({ id, render }) {
      const el = document.createElement("div");
      el.dataset.section = id;
      document.querySelector('[data-slot="sidebar.sections"]').appendChild(el);
      // What a section draws follows the places hidden from the sidebar.
      const refresh = () => {
        render(el);
        Sidebar.applyHidden(el);
      };
      refresh();
      return { el, refresh };
    },
  };

  const settings = {
    // A group of Settings: build(el) fills it.
    section({ id, title, build }) {
      const slot = document.querySelector('[data-slot="settings.sections"]');
      const head = document.createElement("div");
      head.className = "group-title";
      head.dataset.t = title;
      const el = document.createElement("div");
      el.className = "group";
      el.dataset.section = id;
      slot.append(head, el);
      build(el);
      applyLang();
      return el;
    },
  };

  const sheet = {
    // A sheet of its own: the panel element, to fill and to open with LZ.sheet.open(id).
    create(id, { small = false, modal = false } = {}) {
      const wrap = document.createElement("div");
      wrap.className = "modal";
      wrap.id = id;
      if (modal) wrap.dataset.modal = "1";
      wrap.innerHTML = `<div class="panel${small ? " small" : ""}" role="dialog"></div>`;
      document.querySelector('[data-slot="sheets"]').appendChild(wrap);
      return wrap.firstElementChild;
    },
    open: (id) => {
      applyLang();
      openSheet(id);
    },
    close: () => closeSheets(),
  };

  const vfs = {
    // A way to open a kind of item that is not a folder (an archive opens as a folder): opener(entry) returns the URI
    // to browse, or null to let the next one, and in the end the system, open it.
    opener(fn) {
      openers.push(fn);
    },
    browse(entry) {
      for (const fn of openers) {
        const uri = fn(entry);
        if (uri) return uri;
      }
      return null;
    },
  };

  // A question with a typed answer, as a sheet: resolves the text, or null when cancelled. `secret` hides what is
  // typed (a password). The page has no prompt() of its own in the app's web view.
  const promptPanel = sheet.create("promptSheet", { small: true, modal: true });
  promptPanel.innerHTML = `<h2></h2><p></p><input class="prompt-input" spellcheck="false"><div class="buttons"><button class="push" data-a="no"></button><button class="push primary" data-a="yes"></button></div>`;
  function prompt(title, { text = "", value = "", secret = false, ok = t("ok") } = {}) {
    return new Promise((resolve) => {
      const input = promptPanel.querySelector("input");
      promptPanel.querySelector("h2").textContent = title;
      promptPanel.querySelector("p").textContent = text;
      promptPanel.querySelector('[data-a="no"]').textContent = t("cancel");
      promptPanel.querySelector('[data-a="yes"]').textContent = ok;
      input.type = secret ? "password" : "text";
      input.value = value;
      openSheet("promptSheet");
      setTimeout(() => {
        input.focus();
        input.select();
      }, 30);
      const done = (answer) => {
        promptPanel.onclick = input.onkeydown = null;
        closeSheets();
        resolve(answer);
      };
      promptPanel.onclick = (e) => {
        const a = e.target.closest("[data-a]")?.dataset.a;
        if (a) done(a === "yes" ? input.value : null);
      };
      input.onkeydown = (e) => {
        e.stopPropagation();
        if (e.key === "Enter") done(input.value);
        if (e.key === "Escape") done(null);
      };
    });
  }

  return { menu, choose, prompt, toolbar, sidebar, settings, sheet, vfs, words, icons, on, call, t, esc, toast, say, confirm: confirmSheet };
})();

// The layout button: a native menu of the layouts, the current one checked.
(() => {
  const b = LZ.toolbar.add({
    id: "layout",
    side: "left",
    icon: "layout.single",
    label: "layout",
    run: async (_, button) => {
      const r = button.getBoundingClientRect();
      const now = $("paneGrid").dataset.layout;
      const id = await LZ.choose(
        Object.keys(LAYOUTS).map((l) => ({ id: l, label: t(`layout.${l}`), icon: { single: "rectangle", h2: "rectangle.split.2x1", v2: "rectangle.split.1x2", h3: "rectangle.split.3x1", l1r2: "rectangle.righthalf.inset.filled", grid: "rectangle.split.2x2", h4: "rectangle.split.3x1", g6: "square.grid.3x2" }[l], checked: l === now })),
        r.left,
        r.bottom + 6,
      );
      if (id) Panes.setLayout(id);
    },
  });
  // The toolbar slot of the layout button sits before the actions.
  document.querySelector('[data-slot="toolbar.layout"]').appendChild(b);
  Panes.layoutButton = b;
})();

// Dragging out: a press on a selected item readies a native drag of the selection; dropping in: files dragged over a
// window light up the folder under the pointer and are copied or moved there.
(() => {
  Panes.on("pointerdown", ({ pane, event, index }) => {
    if (event.button !== 0 || event.shiftKey || event.metaKey) return;
    const tab = pane.tab;
    const e = tab.rows.get(index);
    if (!e || !tab.isSel(e.name) || !isLocal(e.uri)) return;
    call("drag.arm", tab.selection()).catch(() => {});
  });
  let lit = null;
  const light = (el) => {
    if (lit === el) return;
    lit?.classList.remove("drop");
    lit = el;
    lit?.classList.add("drop");
  };
  // The folder under the point: a folder row, else the folder of the pane, a tab, or a place of the sidebar.
  function targetAt(x, y) {
    const el = document.elementFromPoint(x, y);
    if (!el) return null;
    const side = el.closest(".side-item[data-uri]");
    if (side) return { el: side, uri: side.dataset.uri };
    // Over Quick Access but not on one of its folders: what is dropped is pinned there.
    const quick = el.closest("#sideQuick");
    if (quick) return { el: quick.querySelector(".quick-empty") || quick, quick: true };
    const paneEl = el.closest(".pane");
    const pane = paneEl && Panes.all().find((p) => p.el === paneEl);
    if (!pane) return null;
    const tabEl = el.closest(".tab");
    if (tabEl) {
      const tab = pane.tabs[Number(tabEl.dataset.i)];
      return tab ? { el: tabEl, uri: tab.uri } : null;
    }
    const rowEl = el.closest("[data-index]");
    const entry = rowEl && pane.tab.rows.get(Number(rowEl.dataset.index));
    if (entry?.isDir) return { el: rowEl, uri: entry.uri };
    return pane.tab.capabilities.write ? { el: pane.list, uri: pane.tab.uri } : null;
  }
  on("drop.over", (d) => light(targetAt(d.x, d.y)?.el || null));
  on("drop.leave", () => light(null));
  on("drop", (d) => {
    const target = targetAt(d.x, d.y);
    light(null);
    if (!target) return;
    // A feature may take a drop itself: the desktop moves its own icons where they are dropped.
    if (Panes.onDrop?.(d, target)) return;
    if (target.quick) return Sidebar.pinDropped(d.uris);
    if (!target.el.classList.contains("list")) Motion.take(target.el);
    call("fs.copy", { from: d.uris, to: target.uri, mode: d.mode }).catch(say);
  });

  // Items not on this Mac (in a cloud through rclone, on a server, in an archive) have no file a drag of the system
  // could carry; within the window the page drags them itself, onto the same targets: a pane, a folder, a tab, a
  // place of the sidebar. As with a drop of files, Option copies, Command moves, and otherwise a move stays on one
  // disk and anything else is copied.
  Panes.on("pointerdown", ({ pane, event, index }) => {
    if (event.button !== 0 || event.shiftKey || event.metaKey) return;
    const tab = pane.tab;
    const e = tab.rows.get(index);
    if (!e || !tab.isSel(e.name) || isLocal(e.uri)) return;
    const from = tab.selectedEntries().map((x) => x.uri);
    const source = tab.uri;
    let ghost = null;
    const fits = (target) => target && !samePlace(target.uri, source) && !from.some((u) => samePlace(u, target.uri));
    const move = (m) => {
      if (!ghost && Math.hypot(m.clientX - event.clientX, m.clientY - event.clientY) < 4) return;
      if (!ghost) {
        ghost = document.createElement("div");
        ghost.textContent = from.length > 1 ? `${e.name} +${from.length - 1}` : e.name;
        ghost.style.cssText =
          "position:fixed;z-index:1000;pointer-events:none;max-width:240px;padding:3px 8px;border-radius:6px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--accent);color:#fff;opacity:0.9";
        document.body.appendChild(ghost);
        ghost.animate?.([{ transform: "scale(0.8)", opacity: 0 }, { transform: "none", opacity: 0.9 }], { duration: 160, easing: "ease-out" });
      }
      ghost.style.left = `${m.clientX + 12}px`;
      ghost.style.top = `${m.clientY + 8}px`;
      const target = targetAt(m.clientX, m.clientY);
      light(fits(target) ? target.el : null);
    };
    const end = (u) => {
      removeEventListener("mousemove", move);
      removeEventListener("mouseup", end);
      removeEventListener("keydown", escape, true);
      light(null);
      if (!ghost) return;
      ghost.remove();
      if (u.type !== "mouseup") return;
      const target = targetAt(u.clientX, u.clientY);
      if (!fits(target)) return;
      const mode = u.altKey ? "copy" : u.metaKey ? "move" : "auto";
      if (!target.el.classList.contains("list")) Motion.take(target.el);
      call("fs.copy", { from, to: target.uri, mode }).catch(say);
    };
    const escape = (k) => {
      if (k.key !== "Escape" || !ghost) return;
      k.stopPropagation();
      end(k);
    };
    addEventListener("mousemove", move);
    addEventListener("mouseup", end);
    addEventListener("keydown", escape, true);
  });
})();
</script>
<script>
// The items of the core in the context menu. Features add theirs with LZ.menu.add; the user arranges all of them
// (menu.json, the menu editor of Settings).
words({
  vi: {
    "m.open": "Mở", "m.openWith": "Mở bằng", "m.openTab": "Mở trong tab mới", "m.quickLook": "Xem nhanh", "m.getInfo": "Lấy thông tin",
    "m.rename": "Đổi tên", "m.duplicate": "Nhân bản", "m.copyPath": "Sao chép đường dẫn", "m.copy": "Sao chép", "m.cut": "Cắt", "m.paste": "Dán",
    "m.trash": "Chuyển vào Thùng rác", "m.delete": "Xóa hẳn", "m.newFolder": "Thư mục mới", "m.reveal": "Hiện trong Finder",
    "m.view": "Xem dạng", "m.sort": "Sắp xếp theo", "m.hidden": "Hiện tệp ẩn", "m.asList": "Danh sách", "m.asIcons": "Biểu tượng",
    "m.byName": "Tên", "m.byDate": "Ngày sửa đổi", "m.bySize": "Kích thước", "m.byKind": "Loại", "m.groups": "Nhóm",
  },
  en: {
    "m.open": "Open", "m.openWith": "Open With", "m.openTab": "Open in New Tab", "m.quickLook": "Quick Look", "m.getInfo": "Get Info",
    "m.rename": "Rename", "m.duplicate": "Duplicate", "m.copyPath": "Copy Path", "m.copy": "Copy", "m.cut": "Cut", "m.paste": "Paste",
    "m.trash": "Move to Trash", "m.delete": "Delete Immediately", "m.newFolder": "New Folder", "m.reveal": "Show in Finder",
    "m.view": "View as", "m.sort": "Sort by", "m.hidden": "Show Hidden Files", "m.asList": "List", "m.asIcons": "Icons",
    "m.byName": "Name", "m.byDate": "Date Modified", "m.bySize": "Size", "m.byKind": "Kind", "m.groups": "Groups",
  },
});

(() => {
  const act = (name) => (ctx) => Panes.action(name, ctx.pane);
  const one = (ctx) => ctx.count === 1;
  const some = (ctx) => ctx.count > 0;
  const none = (ctx) => ctx.count === 0;
  // Items of this Mac: those selected (search results and the shelf hold items of many folders), or the folder itself.
  const local = (ctx) => (ctx.count ? ctx.entries.length > 0 && ctx.entries.every((e) => isLocal(e.uri)) : isLocal(ctx.tab.uri));
  const file = (ctx) => one(ctx) && ctx.entry && !ctx.entry.isDir && isLocal(ctx.entry.uri);
  const sortItem = (by, label) => ({
    id: `sort.${by}`,
    label,
    checked: (ctx) => ctx.pane.sortOf(ctx.tab).by === by,
    run: (ctx) => ctx.pane.sortBy(by),
  });
  const items = [
    { id: "open", label: "m.open", icon: "arrow.up.forward.app", group: 10, order: 1, when: some, action: "open", run: act("open") },
    { id: "openWith", label: "m.openWith", icon: "square.and.arrow.up.on.square", group: 10, order: 2, when: file, submenu: [] },
    { id: "openTab", label: "m.openTab", icon: "plus.rectangle.on.rectangle", group: 10, order: 3, when: (c) => some(c) && c.entries.every((e) => e.isDir), run: act("openInNewTab") },
    { id: "quickLook", label: "m.quickLook", icon: "eye", group: 10, order: 4, when: some, action: "quickLook", run: act("quickLook") },
    { id: "getInfo", label: "m.getInfo", icon: "info.circle", group: 20, order: 1, when: local, action: "getInfo", run: act("getInfo") },
    { id: "rename", label: "m.rename", icon: "pencil", group: 20, order: 2, when: (c) => one(c) && c.tab.capabilities.rename, run: act("rename") },
    { id: "duplicate", label: "m.duplicate", icon: "plus.square.on.square", group: 20, order: 3, when: (c) => some(c) && c.tab.capabilities.write, action: "duplicate", run: act("duplicate") },
    { id: "copyPath", label: "m.copyPath", icon: "link", group: 20, order: 4, when: local, action: "copyPath", run: act("copyPath") },
    { id: "copy", label: "m.copy", icon: "doc.on.doc", group: 30, order: 1, when: (c) => some(c) && local(c), action: "copy", run: act("copy") },
    { id: "cut", label: "m.cut", icon: "scissors", group: 30, order: 2, when: (c) => some(c) && local(c) && c.tab.capabilities.write, action: "cut", run: act("cut") },
    { id: "paste", label: "m.paste", icon: "doc.on.clipboard", group: 30, order: 3, when: (c) => c.tab.capabilities.write, action: "paste", run: act("paste") },
    { id: "trash", label: "m.trash", icon: "trash", group: 40, order: 1, when: (c) => some(c) && c.tab.capabilities.trash, action: "trash", run: act("trash") },
    { id: "delete", label: "m.delete", icon: "trash.slash", group: 40, order: 2, when: (c) => some(c) && c.tab.capabilities.write, action: "delete", run: act("delete") },
    { id: "newFolder", label: "m.newFolder", icon: "folder.badge.plus", group: 50, order: 1, when: (c) => c.tab.capabilities.write, action: "newFolder", run: act("newFolder") },
    { id: "reveal", label: "m.reveal", icon: "macwindow", group: 50, order: 2, when: local, action: "reveal", run: act("reveal") },
    {
      id: "view",
      label: "m.view",
      icon: "square.grid.2x2",
      group: 60,
      order: 1,
      when: none,
      submenu: [
        { id: "view.list", label: "m.asList", icon: "list.bullet", checked: (c) => c.tab.mode === "list", action: "viewList", run: act("viewList") },
        { id: "view.icons", label: "m.asIcons", icon: "square.grid.2x2", checked: (c) => c.tab.mode === "icons", action: "viewIcons", run: act("viewIcons") },
        { id: "view.columns", label: "m.asColumns", icon: "rectangle.split.3x1", checked: (c) => c.tab.mode === "columns", action: "viewColumns", run: act("viewColumns") },
        { id: "view.gallery", label: "m.asGallery", icon: "photo.on.rectangle", checked: (c) => c.tab.mode === "gallery", action: "viewGallery", run: act("viewGallery") },
      ],
    },
    { id: "sort", label: "m.sort", icon: "arrow.up.arrow.down", group: 60, order: 2, when: none, submenu: [sortItem("name", "m.byName"), sortItem("mtime", "m.byDate"), sortItem("size", "m.bySize"), sortItem("kind", "m.byKind")] },
    {
      id: "groups",
      label: "m.groups",
      icon: "rectangle.grid.1x2",
      group: 60,
      order: 2.5,
      when: (c) => none(c) && c.tab.mode === "list",
      submenu: GROUPS.map(([g, word]) => ({ id: `group.${g || "none"}`, label: word, checked: (c) => (c.pane.sortOf(c.tab).group || "") === g, run: (c) => c.pane.groupBy(g) })),
    },
    { id: "hidden", label: "m.hidden", icon: "eye.slash", group: 60, order: 3, when: none, checked: () => !!S.settings.show_hidden, action: "toggleHidden", run: act("toggleHidden") },
  ];
  for (const item of items) LZ.menu.add(item);

  // A right click: on an item, the menu of the selection (the item is selected first if it was not); on nothing, the
  // menu of the folder.
  Panes.on("contextmenu", ({ pane, event, index }) => {
    const tab = pane.tab;
    if (index == null) {
      tab.clearSel();
      pane.render();
    }
    const entries = tab.selectedEntries();
    const ctx = { pane, tab, entries, entry: entries[0] || null, count: index == null ? 0 : tab.selCount(), where: index == null ? "empty" : "item", x: event.clientX, y: event.clientY };
    LZ.menu.show(ctx, event.clientX, event.clientY);
  });
})();
</script>
<script>
// The window starts once the app has said hello: the sidebar learns the well-known folders, then the panes come back
// as they were (layout.json) or open at home.
on("app.hello", async (d) => {
  if (d.windowRole !== "main" || Panes.all().length) return;
  await Sidebar.start();
  Panes.start(d.layout, d.uri);
  Toolbar.update();
  // The window comes back as it was without moving; from the next frame on, showing the sidebar and the like move.
  requestAnimationFrame(() => requestAnimationFrame(() => $("app").classList.remove("still")));
  // The window, made hidden, shows now that the sidebar and the panes are in (src/main.rs, page_drawn). Not from a
  // frame: a hidden window may draw none.
  setTimeout(() => call("app.drawn").catch(() => {}), 0);
});
</script>
<script>
// Workspaces (W1): the window's layout, panes, tabs and places saved under a name in the sidebar, and brought back
// with a click; a right click renames, saves over or deletes one.
LZ.words({
  vi: {
    workspaces: "Workspace", saveWorkspace: "Lưu workspace", workspaceName: "Tên workspace", workspaceNameText: "Lưu bố cục, các khung và tab hiện tại với tên này.",
    renameWorkspace: "Đổi tên", overwriteWorkspace: "Lưu đè bằng cửa sổ hiện tại", deleteWorkspace: "Xóa workspace", workspaceSaved: "Đã lưu workspace \"{0}\"",
  },
  en: {
    workspaces: "Workspaces", saveWorkspace: "Save Workspace", workspaceName: "Workspace name", workspaceNameText: "Saves the layout, the panes and the tabs of this window under this name.",
    renameWorkspace: "Rename", overwriteWorkspace: "Save This Window Over It", deleteWorkspace: "Delete Workspace", workspaceSaved: "Workspace \"{0}\" saved",
  },
});
LZ.icons.add({
  workspace: "rectangle.3.group,square.stack.3d.up",
});

const Workspaces = (() => {
  let all = [];
  const section = LZ.sidebar.section({
    id: "workspaces",
    render(el) {
      el.innerHTML =
        `<div class="side-head"><span>${LZ.esc(t("workspaces"))}</span><span class="end" data-ws-save title="${LZ.esc(t("saveWorkspace"))}">${icon("plus")}</span></div>` +
        all.map((w) => `<button class="side-item" data-ws="${LZ.esc(w.id)}"><span class="ico" data-ico="workspace">${icon("workspace")}</span><span class="label">${LZ.esc(w.name)}</span></button>`).join("");
    },
  });

  async function load() {
    all = await LZ.call("workspaces.list").catch(() => all);
    section.refresh();
  }

  async function save(name) {
    const value = name ?? (await LZ.prompt(t("workspaceName"), { text: t("workspaceNameText"), ok: t("saveWorkspace") }));
    if (!value) return;
    LZ.call("workspaces.save", { name: value, state: Panes.state() })
      .then(() => {
        LZ.toast(t("workspaceSaved", value));
        load();
      })
      .catch(LZ.say);
  }

  section.el.addEventListener("click", (e) => {
    if (e.target.closest("[data-ws-save]")) return save();
    const item = e.target.closest("[data-ws]");
    const w = item && all.find((x) => x.id === item.dataset.ws);
    if (w) Panes.load(w.state);
  });
  section.el.addEventListener("contextmenu", async (e) => {
    const item = e.target.closest("[data-ws]");
    const w = item && all.find((x) => x.id === item.dataset.ws);
    if (!w) return;
    e.preventDefault();
    const choice = await LZ.choose(
      [
        { id: "rename", label: t("renameWorkspace"), icon: "pencil" },
        { id: "over", label: t("overwriteWorkspace"), icon: "square.and.arrow.down" },
        { separator: true },
        { id: "delete", label: t("deleteWorkspace"), icon: "trash" },
      ],
      e.clientX,
      e.clientY,
    );
    if (choice === "rename") {
      const name = await LZ.prompt(t("workspaceName"), { value: w.name, ok: t("renameWorkspace") });
      if (name) LZ.call("workspaces.rename", { id: w.id, name }).then(load, LZ.say);
    } else if (choice === "over") save(w.name);
    else if (choice === "delete") LZ.call("workspaces.delete", { id: w.id }).then(load, LZ.say);
  });

  Panes.actions.saveWorkspace = () => save();
  Keys.add({ "Cmd+Alt+W": "saveWorkspace" });
  LZ.on("app.hello", load);
  return { load, save };
})();
</script>
