<script>
// The context menu editor (W1), in Settings: every item of the menu with a box to show or hide it, buttons to move
// it, a line after it, and an SF Symbol of the user's choice; saved as menu.json, which the menu follows at once.
LZ.words({
  vi: {
    contextMenu: "Menu chuột phải", contextMenuHint: "Ẩn hoặc hiện, sắp xếp lại và đổi biểu tượng của từng mục.", resetMenu: "Mặc định",
    lineAfter: "Vạch ngăn sau mục này", line: "Vạch", chooseIcon: "Chọn biểu tượng", editMenu: "Sửa menu...",
  },
  en: {
    contextMenu: "Context Menu", contextMenuHint: "Show or hide, reorder and change the icon of each item.", resetMenu: "Defaults",
    lineAfter: "Line after this item", line: "Line", chooseIcon: "Choose an Icon", editMenu: "Edit Menu...",
  },
});

const MenuEditor = (() => {
  const SYMBOLS = [
    "folder", "folder.fill", "folder.badge.plus", "doc", "doc.text", "doc.badge.plus", "doc.on.doc", "doc.on.clipboard", "scissors", "trash", "trash.slash", "pencil",
    "pencil.and.list.clipboard", "eye", "eye.slash", "info.circle", "link", "star", "star.fill", "heart", "tag", "bookmark", "paperplane", "square.and.arrow.up",
    "square.and.arrow.down", "arrow.up.forward.app", "arrow.up.right.square", "macwindow", "terminal", "chevron.left.forwardslash.chevron.right", "curlybraces", "number",
    "lock", "lock.open", "key", "archivebox", "shippingbox", "externaldrive", "internaldrive", "server.rack", "network", "globe", "cloud", "icloud", "tray",
    "tray.and.arrow.down", "tray.full", "photo", "film", "music.note", "magnifyingglass", "gearshape", "slider.horizontal.3", "wand.and.stars", "sparkles", "bolt",
    "flag", "bell", "clock", "calendar", "plus.square.on.square", "square.grid.2x2", "list.bullet", "arrow.up.arrow.down", "arrow.triangle.2.circlepath", "plus.rectangle.on.rectangle",
  ];
  let layout = { order: [], hidden: [], icons: {}, separators: [] };
  const symbolUrl = (name) => `lazy://symbol/${16 * pixelRatio()}/${encodeURIComponent(name)}`;

  const panel = LZ.sheet.create("menuEditSheet");
  panel.classList.add("menuedit-panel");
  panel.innerHTML = `<h2 data-t="contextMenu"></h2><p data-t="contextMenuHint"></p><div class="me-list"></div>
    <div class="buttons"><button class="push" data-me="reset" data-t="resetMenu"></button><button class="push primary" data-me="done" data-t="done"></button></div>`;
  const list = panel.querySelector(".me-list");
  const picker = LZ.sheet.create("iconPickSheet", { small: true });
  picker.innerHTML = `<h2 data-t="chooseIcon"></h2><div class="me-icons">${SYMBOLS.map((s) => `<button class="me-icon" data-sym="${s}" title="${s}"><img src="${symbolUrl(s)}" alt=""></button>`).join("")}</div>`;
  let picking = null;

  // The items in the order the user gave, those the user never placed after them in their groups' order.
  function ordered() {
    const items = LZ.menu.list();
    if (!layout.order.length) return items;
    const rank = (id) => {
      const i = layout.order.indexOf(id);
      return i < 0 ? Infinity : i;
    };
    return [...items].sort((a, b) => rank(a.id) - rank(b.id));
  }

  // Without an order of the user's own, the lines of the menu are where the groups change.
  function defaultSeparators(items) {
    return items.filter((item, i) => items[i + 1] && items[i + 1].group !== item.group).map((item) => item.id);
  }

  function render() {
    const items = ordered();
    const separators = layout.order.length ? layout.separators : defaultSeparators(items);
    list.innerHTML = items
      .map((item, i) => {
        const iconName = layout.icons[item.id] || item.icon;
        return `<div class="me-row${separators.includes(item.id) ? " line" : ""}" data-id="${item.id}">
          <input type="checkbox" data-me="show"${layout.hidden.includes(item.id) ? "" : " checked"}>
          <button class="me-pick" data-me="icon" title="${LZ.esc(t("chooseIcon"))}">${iconName ? `<img src="${symbolUrl(iconName)}" alt="">` : ""}</button>
          <span class="me-label">${LZ.esc(item.label)}</span>
          <label class="check" title="${LZ.esc(t("lineAfter"))}"><input type="checkbox" data-me="line"${separators.includes(item.id) ? " checked" : ""}> ${LZ.esc(t("line"))}</label>
          <button class="mini" data-me="up"${i === 0 ? " disabled" : ""}>${icon("chevron.up")}</button>
          <button class="mini" data-me="down"${i === items.length - 1 ? " disabled" : ""}>${icon("chevron.down")}</button>
        </div>`;
      })
      .join("");
  }

  // Saves the arrangement as it is on screen; the first change of a default menu writes out its full order.
  function save() {
    const rows = [...list.querySelectorAll(".me-row")];
    layout.order = rows.map((r) => r.dataset.id);
    layout.separators = rows.filter((r) => r.querySelector('[data-me="line"]').checked).map((r) => r.dataset.id);
    LZ.call("menuedit.set", { layout }).catch(LZ.say);
  }

  list.addEventListener("change", (e) => {
    const row = e.target.closest(".me-row");
    if (!row) return;
    if (e.target.dataset.me === "show") {
      layout.hidden = layout.hidden.filter((id) => id !== row.dataset.id);
      if (!e.target.checked) layout.hidden.push(row.dataset.id);
    }
    save();
    render();
  });
  panel.addEventListener("click", (e) => {
    const act = e.target.closest("[data-me]")?.dataset.me;
    const row = e.target.closest(".me-row");
    if ((act === "up" || act === "down") && row) {
      const sibling = act === "up" ? row.previousElementSibling : row.nextElementSibling;
      if (sibling) act === "up" ? sibling.before(row) : sibling.after(row);
      save();
      render();
    } else if (act === "icon" && row) {
      picking = row.dataset.id;
      LZ.sheet.open("iconPickSheet");
    } else if (act === "reset") {
      layout = { order: [], hidden: [], icons: {}, separators: [] };
      LZ.call("menuedit.set", { layout }).catch(LZ.say);
      render();
    } else if (act === "done") LZ.sheet.close();
  });
  picker.addEventListener("click", (e) => {
    const b = e.target.closest("[data-sym]");
    if (!b || !picking) return;
    layout.icons[picking] = b.dataset.sym;
    picking = null;
    LZ.call("menuedit.set", { layout }).catch(LZ.say);
    LZ.sheet.open("menuEditSheet");
    render();
  });

  async function open() {
    layout = await LZ.call("menuedit.get").catch(() => layout);
    layout.icons ||= {};
    render();
    LZ.sheet.open("menuEditSheet");
  }

  LZ.settings.section({
    id: "contextmenu",
    title: "contextMenu",
    build(el) {
      el.innerHTML = `<div class="item"><div class="label"><span data-t="contextMenu"></span><small data-t="contextMenuHint"></small></div><div class="control"><button class="push" data-t="editMenu"></button></div></div>`;
      el.querySelector("button").addEventListener("click", open);
    },
  });
  return { open };
})();
</script>

<script>
// The look of the app beyond light and dark: the accent colour, the font of the app's text, the sidebar's icons in grey
// or in colour, the size of icons in the icon view (Cmd+= and Cmd+- too), and the size of the text of lists. Each is a setting, put on the
// root of the page, where the styles of 13-appearance.css read it.
LZ.words({
  vi: {
    colorsIcons: "Màu sắc, chữ và biểu tượng", font: "Phông chữ", fontHint: "Phông của toàn bộ cửa sổ, menu trong trang và bảng.",
    fontSystem: "Hệ thống (SF Pro)", fontRounded: "SF Pro Rounded", fontSerif: "New York", fontMono: "SF Mono", fontsMac: "Đã cài trên máy", fontsApple: "Của Apple",
    accentColor: "Màu nhấn", accentHint: "Màu của mục được chọn, nút bấm và viền tiêu điểm.",
    sidebarIcons: "Biểu tượng thanh bên", sidebarIconsHint: "Xám như Finder, hoặc mỗi nơi một màu.", iconsMono: "Đơn sắc", iconsColor: "Có màu",
    iconSize: "Cỡ biểu tượng", iconSizeHint: "Ở chế độ lưới. Cmd+= và Cmd+- để đổi nhanh.", textSize: "Cỡ chữ danh sách", textSizeHint: "Chữ và chiều cao dòng ở chế độ danh sách.",
    sizeSmall: "Nhỏ", sizeMedium: "Vừa", sizeLarge: "Lớn", sizeHuge: "Rất lớn",
    "accent.system": "Theo hệ thống", "accent.blue": "Xanh dương", "accent.purple": "Tím", "accent.pink": "Hồng", "accent.red": "Đỏ", "accent.orange": "Cam",
    "accent.yellow": "Vàng", "accent.green": "Xanh lá", "accent.graphite": "Than chì",
  },
  en: {
    colorsIcons: "Colours, Text and Icons", font: "Font", fontHint: "The font of the whole window, its menus and its sheets.",
    fontSystem: "System (SF Pro)", fontRounded: "SF Pro Rounded", fontSerif: "New York", fontMono: "SF Mono", fontsMac: "Installed on this Mac", fontsApple: "Apple's",
    accentColor: "Accent colour", accentHint: "The colour of selected items, buttons and focus rings.",
    sidebarIcons: "Sidebar icons", sidebarIconsHint: "Grey as in Finder, or a colour for each place.", iconsMono: "Grey", iconsColor: "Colour",
    iconSize: "Icon size", iconSizeHint: "In the icon view. Cmd+= and Cmd+- change it quickly.", textSize: "List text size", textSizeHint: "The text and the row height of the list view.",
    sizeSmall: "Small", sizeMedium: "Medium", sizeLarge: "Large", sizeHuge: "Huge",
    "accent.system": "System", "accent.blue": "Blue", "accent.purple": "Purple", "accent.pink": "Pink", "accent.red": "Red", "accent.orange": "Orange",
    "accent.yellow": "Yellow", "accent.green": "Green", "accent.graphite": "Graphite",
  },
});

(() => {
  const ACCENTS = { system: "", blue: "#007aff", purple: "#a550a7", pink: "#f74f9e", red: "#e0383e", orange: "#f7821b", yellow: "#e8a500", green: "#62ba46", graphite: "#8c8c8c" };
  const SIZES = [
    [48, "sizeSmall"],
    [64, "sizeMedium"],
    [96, "sizeLarge"],
    [128, "sizeHuge"],
  ];
  // The system's own designs, which CSS names by keyword, then the families installed on the Mac (native.fonts).
  const DESIGNS = [
    ["", "fontSystem"],
    ["ui-rounded", "fontRounded"],
    ["ui-serif", "fontSerif"],
    ["ui-monospace", "fontMono"],
  ];
  const fontValue = (font) => (!font ? "" : font.startsWith("ui-") ? `${font}, ` : `"${font}", `) + "-apple-system, BlinkMacSystemFont, system-ui, sans-serif";
  const seg = (attr, value, word) => `<button type="button" class="seg" data-${attr}="${value}" data-t="${word}"></button>`;
  const group = LZ.settings.section({
    id: "appearance",
    title: "colorsIcons",
    build(el) {
      el.innerHTML = `
        <div class="item"><div class="label"><span data-t="accentColor"></span><small data-t="accentHint"></small></div>
          <div class="control"><div class="swatches">${Object.entries(ACCENTS)
            .map(([name, color]) => `<button type="button" class="swatch" data-accent="${name}" data-tt="accent.${name}" style="${color ? `background:${color};` : ""}--swatch:${color || "#8e8e93"}"></button>`)
            .join("")}</div></div></div>
        <div class="item"><div class="label"><span data-t="font"></span><small data-t="fontHint"></small></div>
          <div class="control"><select class="font-choice"><optgroup data-label="fontsApple">${DESIGNS.map(([value, word]) => `<option value="${value}" data-t="${word}"></option>`).join("")}</optgroup><optgroup class="fonts-mac" data-label="fontsMac"></optgroup></select></div></div>
        <div class="item"><div class="label"><span data-t="sidebarIcons"></span><small data-t="sidebarIconsHint"></small></div>
          <div class="control"><div class="segmented">${seg("sidebar-icons", "mono", "iconsMono")}${seg("sidebar-icons", "color", "iconsColor")}</div></div></div>
        <div class="item"><div class="label"><span data-t="iconSize"></span><small data-t="iconSizeHint"></small></div>
          <div class="control"><div class="segmented">${SIZES.map(([size, word]) => seg("icon-size", size, word)).join("")}</div></div></div>
        <div class="item"><div class="label"><span data-t="textSize"></span><small data-t="textSizeHint"></small></div>
          <div class="control"><div class="segmented">${seg("text-size", "small", "sizeSmall")}${seg("text-size", "medium", "sizeMedium")}${seg("text-size", "large", "sizeLarge")}</div></div></div>`;
    },
  });

  // The group goes right under Appearance, the group of light and dark it goes with.
  document.querySelector('#settingsSheet .group-title[data-t="appearance"]')?.nextElementSibling?.after(group.previousElementSibling, group);

  // Puts the look of the settings on the page, and draws the panes again when a size changed.
  function apply(s) {
    const root = document.documentElement;
    const before = `${root.dataset.iconSize}|${root.dataset.textSize}`;
    root.dataset.accent = s.accent || "system";
    root.dataset.sidebarIcons = s.sidebar_icons || "mono";
    root.dataset.iconSize = String(s.icon_size || 64);
    root.dataset.textSize = s.text_size || "medium";
    if (s.font) root.style.setProperty("--ui-font", fontValue(s.font));
    else root.style.removeProperty("--ui-font");
    showFont(s.font || "");
    for (const b of group.querySelectorAll("[data-accent]")) b.classList.toggle("on", b.dataset.accent === root.dataset.accent);
    for (const b of group.querySelectorAll("[data-sidebar-icons]")) b.classList.toggle("on", b.dataset.sidebarIcons === root.dataset.sidebarIcons);
    for (const b of group.querySelectorAll("[data-icon-size]")) b.classList.toggle("on", b.dataset.iconSize === root.dataset.iconSize);
    for (const b of group.querySelectorAll("[data-text-size]")) b.classList.toggle("on", b.dataset.textSize === root.dataset.textSize);
    setMetrics(s);
    if (before !== `${root.dataset.iconSize}|${root.dataset.textSize}`) for (const pane of Panes.all()) pane.renderAll();
  }

  // The installed families are asked for once, the first time Settings shows them; the chosen one is kept in the list
  // even before then, or when it was removed from the Mac.
  const choice = group.querySelector(".font-choice");
  const mac = group.querySelector(".fonts-mac");
  let families = null;
  function showFont(font) {
    if (font && !choice.querySelector(`option[value="${CSS.escape(font)}"]`)) mac.insertAdjacentHTML("afterbegin", `<option value="${LZ.esc(font)}">${LZ.esc(font)}</option>`);
    choice.value = font;
  }
  function loadFamilies() {
    if (families) return;
    families = LZ.call("native.fonts")
      .then((list) => {
        const kept = choice.value;
        mac.innerHTML = list.map((f) => `<option value="${LZ.esc(f)}">${LZ.esc(f)}</option>`).join("");
        showFont(kept);
      })
      .catch(() => (families = null));
  }
  new MutationObserver(() => $("settingsSheet").classList.contains("open") && loadFamilies()).observe($("settingsSheet"), { attributes: true, attributeFilter: ["class"] });
  choice.addEventListener("change", () => setSetting({ font: choice.value }));
  // Optgroup labels are attributes, which data-t does not reach.
  const labelGroups = () => {
    for (const g of group.querySelectorAll("optgroup[data-label]")) g.label = t(g.dataset.label);
  };
  labelGroups();
  LZ.on("settings.changed", labelGroups);

  group.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.accent) setSetting({ accent: b.dataset.accent });
    else if (b.dataset.sidebarIcons) setSetting({ sidebar_icons: b.dataset.sidebarIcons });
    else if (b.dataset.iconSize) setSetting({ icon_size: Number(b.dataset.iconSize) });
    else if (b.dataset.textSize) setSetting({ text_size: b.dataset.textSize });
  });

  // Bigger and smaller icons from the keyboard, as in Finder.
  const step = (by) => {
    const sizes = SIZES.map(([size]) => size);
    const at = sizes.indexOf(S.settings.icon_size || 64);
    const next = sizes[Math.min(sizes.length - 1, Math.max(0, at + by))];
    if (next !== S.settings.icon_size) setSetting({ icon_size: next });
  };
  Panes.actions.iconsBigger = () => step(1);
  Panes.actions.iconsSmaller = () => step(-1);
  Keys.add({ "Cmd+=": "iconsBigger", "Cmd+-": "iconsSmaller" });

  LZ.on("settings.changed", apply);
  LZ.on("app.hello", (d) => apply(d.settings));
})();
</script>

    ["selectNone", "file", "Bỏ chọn tất cả", "Deselect All"],

    ["openInNewWindow", "panes", "Mở trong cửa sổ mới", "Open in New Window"],

    ["layoutL1R2", "panes", "Bố cục: một trái, hai phải", "Layout: One Left, Two Right"],
    ["layoutGrid", "panes", "Bố cục: lưới bốn khung", "Layout: Grid of Four"],

    ["splitRight", "panes", "Chia khung sang phải", "Split the Pane to the Right"],
    ["splitDown", "panes", "Chia khung xuống dưới", "Split the Pane Down"],
    ["closePane", "panes", "Đóng khung", "Close the Pane"],
    ["pinQuick", "panes", "Ghim thư mục đang mở vào Truy cập nhanh", "Pin the Folder to Quick Access"],
    ["saveWorkspace", "panes", "Lưu workspace", "Save Workspace"],
    ["viewList", "view", "Xem dạng danh sách", "View as List"],
    ["viewIcons", "view", "Xem dạng biểu tượng", "View as Icons"],
    ["iconsBigger", "view", "Biểu tượng to hơn", "Bigger Icons"],
    ["iconsSmaller", "view", "Biểu tượng nhỏ hơn", "Smaller Icons"],
    ["toggleHidden", "view", "Hiện hoặc ẩn tệp ẩn", "Show or Hide Hidden Files"],
    ["toggleSidebar", "view", "Hiện hoặc ẩn thanh bên", "Show or Hide the Sidebar"],
    ["fullDiskAccess", "tools", "Cho phép truy cập toàn bộ ổ đĩa (hết hỏi quyền từng thư mục)", "Allow Full Disk Access (no more questions folder by folder)"],
    ["togglePreview", "view", "Hiện hoặc ẩn khung xem trước", "Show or Hide the Preview"],
    ["refresh", "view", "Tải lại", "Refresh"],
    ["find", "view", "Lọc thư mục này", "Filter This Folder"],
    ["compareFolders", "tools", "So sánh và đồng bộ thư mục", "Compare and Sync Folders"],
    ["diskMap", "tools", "Xem dung lượng thư mục", "Show Disk Usage"],
    ["findTwins", "tools", "Tìm tệp trùng lặp", "Find Duplicate Files"],
    ["toggleShelf", "tools", "Hiện hoặc ẩn khay tạm", "Show or Hide the Shelf"],
    ["openTerminal", "tools", "Mở trong Terminal", "Open in Terminal"],
    ["openEditor", "tools", "Mở trong trình soạn thảo", "Open in Editor"],
    ["settings", "tools", "Cài đặt", "Settings"],
    ["palette", "tools", "Lệnh và phím tắt", "Commands and Shortcuts"],
  ];
  const GROUPS = { go: ["Đi tới", "Go"], file: ["Tệp", "File"], panes: ["Khung và tab", "Panes and Tabs"], view: ["Xem", "View"], tools: ["Công cụ", "Tools"] };
  LZ.words({
    vi: {
      ...Object.fromEntries(COMMANDS.map(([id, , vi]) => [`cmd.${id}`, vi])),
      ...Object.fromEntries(Object.entries(GROUPS).map(([id, [vi]]) => [`cmdGroup.${id}`, vi])),
      commandsTitle: "Lệnh và phím tắt", commandsSearch: "Gõ tên lệnh, có dấu hay không đều được", noCommand: "Không có lệnh nào khớp",
      needTwoPanes: "Cần hai khung: chọn bố cục hai khung bằng Cmd+Option+2", noClosedTab: "Không có tab nào vừa đóng",
    },
    en: {
      ...Object.fromEntries(COMMANDS.map(([id, , , en]) => [`cmd.${id}`, en])),
      ...Object.fromEntries(Object.entries(GROUPS).map(([id, [, en]]) => [`cmdGroup.${id}`, en])),
      commandsTitle: "Commands and Shortcuts", commandsSearch: "Type the name of a command", noCommand: "No command matches",
      needTwoPanes: "Two panes are needed: choose a layout of two with Cmd+Option+2", noClosedTab: "No tab was closed",
    },
  });

  // The new actions.
  const other = (pane) => {
    const all = Panes.all();
    return all.length > 1 ? all[(all.indexOf(pane) + 1) % all.length] : null;
  };
  function toOther(pane, mode) {
    const there = other(pane);
    if (!there) return LZ.toast(t("needTwoPanes"));
    const uris = pane.tab.selectedEntries().map((e) => e.uri);
    if (uris.length) LZ.call("fs.copy", { from: uris, to: there.tab.uri, mode }).catch(LZ.say);
  }
  const closed = [];
  const closeTab = Pane.prototype.closeTab;
  Pane.prototype.closeTab = function (i) {
    if (this.tabs.length > 1 && this.tabs[i]?.uri) {
      closed.push(this.tabs[i].uri);
      if (closed.length > 20) closed.shift();
    }
    closeTab.call(this, i);
  };
  const stepTab = (pane, by) => {
    if (pane.tabs.length > 1) pane.activate((pane.active + by + pane.tabs.length) % pane.tabs.length);
  };
  Object.assign(Panes.actions, {
    pinQuick: () => Sidebar.pinHere(),
    copyToOther: (pane) => toOther(pane, "copy"),
    moveToOther: (pane) => toOther(pane, "move"),
    openInOther(pane) {
      const there = other(pane);
      if (!there) return LZ.toast(t("needTwoPanes"));
      const folder = pane.tab.selectedEntries().find((e) => e.isDir);
      there.navigate(folder ? folder.uri : pane.tab.uri);
    },
    swapPanes(pane) {
      const there = other(pane);
      if (!there) return LZ.toast(t("needTwoPanes"));
      const [a, b] = [pane.tab.uri, there.tab.uri];
      pane.navigate(b);
      there.navigate(a);
    },
    reopenTab(pane) {
      const uri = closed.pop();
      if (uri) pane.newTab(uri);
      else LZ.toast(t("noClosedTab"));
    },
    nextTab: (pane) => stepTab(pane, 1),
    previousTab: (pane) => stepTab(pane, -1),
    refresh: (pane) => pane.refresh(),
    pasteMove: (pane) => LZ.call("clipboard.paste", { to: pane.tab.uri, move: true }).catch(LZ.say),
    documents: (pane) => S.places.documents && pane.navigate(S.places.documents),
    newFile: () => $("tb-newFile")?.click(),
    hash: (pane) => Hash.start(pane),
    openTerminal: (pane) => OpenIn.open(pane, "terminal"),
    openEditor: (pane) => OpenIn.open(pane, "editor"),
    settings: () => openSheet("settingsSheet"),
    palette: () => open(),
  });

  // In the context menu too, when there is another pane to send to.
  const twoPanes = (c) => c.count > 0 && Panes.all().length > 1;
  LZ.menu.add({ id: "copyToOther", label: "cmd.copyToOther", icon: "arrow.right.doc.on.clipboard", group: 30, order: 4, when: twoPanes, action: "copyToOther", run: (c) => Panes.action("copyToOther", c.pane) });
  LZ.menu.add({ id: "moveToOther", label: "cmd.moveToOther", icon: "arrow.right.square", group: 30, order: 5, when: twoPanes, action: "moveToOther", run: (c) => Panes.action("moveToOther", c.pane) });

  Keys.add({
    "Cmd+Ctrl+P": "pinQuick",
    F5: "copyToOther",
    F6: "moveToOther",
    "Ctrl+Tab": "nextTab",
    "Ctrl+Shift+Tab": "previousTab",
    "Cmd+Alt+N": "newFile",
    "Cmd+Alt+H": "hash",
    "Cmd+Alt+O": "openInOther",
    "Cmd+Ctrl+T": "openTerminal",
    "Cmd+Ctrl+E": "openEditor",
  });
  Keys.add(
    {
      "Cmd+Shift+T": "reopenTab",
      "Cmd+Shift+]": "nextTab",
      "Cmd+Shift+[": "previousTab",
      "Cmd+R": "refresh",
      "Cmd+Alt+V": "pasteMove",
      "Cmd+Shift+O": "documents",
      "Cmd+U": "swapPanes",
      "Cmd+P": "palette",
      "Cmd+/": "palette",
    },
    "mac",
  );
  Keys.add(
    {
      "Ctrl+Shift+T": "reopenTab",
      "Ctrl+R": "refresh",
      "Ctrl+Shift+V": "pasteMove",
      "Ctrl+U": "swapPanes",
      "Ctrl+P": "palette",
      "Ctrl+/": "palette",
    },
    "windows",
  );

  // The keys of an action as a person reads them: Option for Alt on a Mac, and the names of the keys.
  function keysOf(action) {
    const mac = Keys.keymap() === "mac";
    const names = { ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Backspace: mac ? "Delete" : "Backspace", Alt: mac ? "Option" : "Alt" };
    return Object.entries(Keys.map())
      .filter(([, name]) => name === action)
      .map(([chord]) => chord.split("+").map((k) => names[k] || k).join("+"))
      .slice(0, 2);
  }

  // Folds a text for matching: lower case, without Vietnamese accents, so "thu muc moi" finds "Thư mục mới".
  const fold = (text) => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/gi, "d").toLowerCase();

  const panel = LZ.sheet.create("paletteSheet", { small: true });
  panel.classList.add("palette");
  panel.innerHTML = `<input class="cmd-input" spellcheck="false" autocomplete="off" data-tp="commandsSearch"><div class="cmd-list"></div>`;
  const input = panel.querySelector(".cmd-input");
  const list = panel.querySelector(".cmd-list");
  let shown = [];
  let at = 0;

  function paint() {
    const q = fold(input.value.trim());
    const words = q.split(/\s+/).filter(Boolean);
    shown = COMMANDS.filter(([id, , vi, en]) => Panes.actions[id] && words.every((w) => fold(`${vi} ${en} ${id}`).includes(w)));
    at = Math.min(at, Math.max(0, shown.length - 1));
    let group = null;
    list.innerHTML =
      shown
        .map(([id, g], i) => {
          const head = !q && g !== group ? `<div class="cmd-group">${LZ.esc(t(`cmdGroup.${(group = g)}`))}</div>` : "";
          const keys = keysOf(id).map((k) => `<kbd>${LZ.esc(k)}</kbd>`).join("");
          return `${head}<div class="cmd${i === at ? " on" : ""}" data-i="${i}"><span>${LZ.esc(t(`cmd.${id}`))}</span><span class="cmd-keys">${keys}</span></div>`;
        })
        .join("") || `<p class="cmd-none">${LZ.esc(t("noCommand"))}</p>`;
    list.querySelector(".cmd.on")?.scrollIntoView({ block: "nearest" });
  }

  function open() {
    input.value = "";
    at = 0;
    LZ.sheet.open("paletteSheet");
    paint();
    setTimeout(() => input.focus(), 30);
  }

  function run(i) {
    const command = shown[i];
    if (!command) return;
    LZ.sheet.close();
    Panes.action(command[0]);
  }

  input.addEventListener("input", () => {
    at = 0;
    paint();
  });
  input.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      at = Math.min(shown.length - 1, Math.max(0, at + (e.key === "ArrowDown" ? 1 : -1)));
      paint();
    } else if (e.key === "Enter") {
      e.preventDefault();
      run(at);
    } else if (e.key === "Escape") LZ.sheet.close();
  });
  list.addEventListener("mousemove", (e) => {
    const row = e.target.closest(".cmd");
    if (row && Number(row.dataset.i) !== at) {
      at = Number(row.dataset.i);
      for (const el of list.querySelectorAll(".cmd")) el.classList.toggle("on", el === row);
    }
  });
  list.addEventListener("click", (e) => {
    const row = e.target.closest(".cmd");
    if (row) run(Number(row.dataset.i));
  });
})();
</script>
<script>
// LazySpace in place of Finder (src/features/viewer.rs). "Show in LazySpace" beside "Show in Finder": the folder of
// each item in a new tab of the focused pane, the item selected. A window without panes of its own (the shelf, the
// desktop) asks the app, which sends the folders to a main window as `viewer.show`, as it does with what macOS sends
// once LazySpace is the Mac's file viewer. In Settings: the switch that makes it so.
LZ.words({
  vi: {
    revealHere: "Hiện trong LazySpace", "m.revealHere": "Hiện trong LazySpace",
    finderTitle: "Finder", viewerOn: "Dùng LazySpace thay Finder",
    viewerOnHint: "Đổi một cài đặt của macOS: khi ứng dụng khác bảo \"Hiện trong Finder\" và khi mở một thư mục, LazySpace sẽ mở thay Finder. Tắt đi thì Finder trở lại như cũ.",
    viewerPartly: "macOS chỉ nhận một phần. Từ macOS 26.4, macOS không cho ứng dụng nào khác mở thư mục thay Finder; khi ứng dụng khác bảo \"Hiện trong Finder\" thì LazySpace vẫn mở. Tắt đi để trả hết cho Finder.",
    viewerUnavailable: "Chỉ bản LazySpace.app (cài từ tệp .app) mới thay được Finder.",
  },
  en: {
    revealHere: "Show in LazySpace", "m.revealHere": "Show in LazySpace",
    finderTitle: "Finder", viewerOn: "Use LazySpace instead of Finder",
    viewerOnHint: "Changes a macOS setting: when another app says \"Show in Finder\" and when a folder is opened, LazySpace opens instead of Finder. Turning it off gives Finder back.",
    viewerPartly: "macOS took only part of it. Since macOS 26.4 no app but Finder may open folders; when another app says \"Show in Finder\", LazySpace still opens. Turn it off to give everything back to Finder.",
    viewerUnavailable: "Only LazySpace.app (installed from the .app) can stand in for Finder.",
  },
});

const Viewer = (() => {
  // The folders that hold `uris`, each with the names to select in it, in the order met.
  function folders(uris) {
    const out = new Map();
    for (const uri of uris) {
      const path = pathOf(uri);
      if (path === "/") {
        out.set(uri, out.get(uri) || []);
        continue;
      }
      const folder = withPath(uri, path.slice(0, path.lastIndexOf("/")) || "/");
      const names = out.get(folder) || [];
      names.push(path.split("/").pop());
      out.set(folder, names);
    }
    return out;
  }

  // Each folder in a new tab of `pane`, its items selected once they are listed.
  function open(pane, uri, names) {
    pane.newTab(uri, names?.length ? names : null);
    Panes.focus(pane);
    pane.list.focus({ preventScroll: true });
  }

  // The items of this Mac: in a main window here, from any other window through a main one.
  function reveal(pane, uris) {
    const local = uris.filter(isLocal);
    if (!local.length) return;
    if (S.window.role !== "main" || !pane) return LZ.call("viewer.reveal", { uris: local }).catch(LZ.say);
    for (const [uri, names] of folders(local)) open(pane, uri, names);
  }

  // What the app sends waits for the panes, which start after the window's hello (09-core-start.js).
  const waiting = [];
  const start = Panes.start;
  Panes.start = (...args) => {
    start(...args);
    for (const d of waiting.splice(0)) open(Panes.focused(), d.uri, d.names);
  };
  LZ.on("viewer.show", (d) => {
    if (S.window.role !== "main") return;
    if (Panes.focused()) open(Panes.focused(), d.uri, d.names);
    else waiting.push(d);
  });

  // The selection, or the folder of the tab itself when nothing is selected.
  const targets = (pane) => (pane.tab.selCount() ? pane.tab.selectedEntries().map((e) => e.uri) : [pane.tab.uri]);
  Panes.actions.revealHere = (pane) => reveal(pane, targets(pane));
  // The items on the shelf's own pane are files of this Mac though the tab is not, so the entries decide.
  const local = (ctx) => (ctx.count ? ctx.entries.length > 0 && ctx.entries.every((e) => isLocal(e.uri)) : isLocal(ctx.tab.uri));
  LZ.menu.add({ id: "revealHere", label: "m.revealHere", icon: "folder", group: 50, order: 3, when: local, action: "revealHere", run: (ctx) => Panes.action("revealHere", ctx.pane) });
  Keys.add({ "Cmd+Ctrl+R": "revealHere" });

  // Settings: LazySpace as the Mac's file viewer and its app for folders. The switch shows what macOS says, not what
  // was last asked for.
  const group = LZ.settings.section({
    id: "viewer",
    title: "finderTitle",
    build(el) {
      el.innerHTML = `
        <div class="item"><div class="label"><span data-t="viewerOn"></span><small data-t="viewerOnHint"></small><small data-viewer="note" hidden></small></div>
          <div class="control"><label class="switch"><input type="checkbox" data-viewer="on" /><span class="knob"></span></label></div></div>`;
    },
  });
  const box = group.querySelector('[data-viewer="on"]');
  const note = group.querySelector('[data-viewer="note"]');
  function paint(state) {
    if (!state) return;
    const both = state.fileViewer && state.folders;
    const some = state.fileViewer || state.folders;
    box.checked = some;
    box.disabled = !state.available && !some;
    const why = !state.available && !some ? "viewerUnavailable" : some && !both ? "viewerPartly" : null;
    note.hidden = !why;
    note.textContent = why ? t(why) : "";
  }
  const refresh = () => LZ.call("viewer.state").then(paint, () => (box.disabled = false));
  box.addEventListener("change", () => {
    box.disabled = true;
    LZ.call("viewer.enable", { on: box.checked }).then(paint, (error) => {
      LZ.say(error);
      refresh();
    });
  });
  // macOS's settings can change outside the app, so they are read again whenever the window comes forward.
  LZ.on("app.hello", refresh);
  window.addEventListener("focus", refresh);

  return { reveal, folders };
})();
</script>

<script>
// Settings in pages, as System Settings has them: each group title of the sheet (the core's and those parts add with
// LZ.settings.section) starts a page, listed on the left with an icon on a coloured tile; the search on top of the
// list shows the settings whose words hold what is typed, from every page at once.
LZ.words({
  vi: { searchSettings: "Tìm cài đặt", noSettingMatch: "Không có cài đặt nào khớp" },
  en: { searchSettings: "Search", noSettingMatch: "No setting matches" },
});
LZ.icons.add({
  "set.general": "gearshape.fill",
  "set.appearance": "circle.lefthalf.filled",
  "set.colours": "paintpalette.fill",
  "set.keyboard": "keyboard.fill",
  "set.menu": "contextualmenu.and.cursorarrow",
  "set.finder": "folder.fill",
  "set.desktop": "menubar.dock.rectangle,desktopcomputer",
  "set.about": "info.circle.fill",
  "set.other": "puzzlepiece.extension.fill",
  "set.search": "magnifyingglass",
  "set.actions": "terminal.fill",
});

const SettingsNav = (() => {
  // The icon and the tile colour of each page, by the word of its title; a page a new part adds gets the last one.
  const LOOK = {
    general: ["set.general", "#8e8e93"],
    appearance: ["set.appearance", "#636366"],
    colorsIcons: ["set.colours", "#ff9500"],
    keyboard: ["set.keyboard", "#8e8e93"],
    contextMenu: ["set.menu", "#007aff"],
    finderTitle: ["set.finder", "#0a84ff"],
    searchTitle: ["set.search", "#8e8e93"],
    actionsTitle: ["set.actions", "#34c759"],
    desktop: ["set.desktop", "#30b0c7"],
    about: ["set.about", "#8e8e93"],
  };
  const OTHER = ["set.other", "#5856d6"];
  const body = $("settingsBody");
  const nav = $("settingsNav");
  const search = $("settingsSearch");
  $("settingsSearchIcon").innerHTML = icon("search");
  let pages = [];
  let current = "general";

  // Accents and case aside, as the command palette compares words.
  const fold = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();

  // The pages from the titles and groups of the sheet, in the order they stand: each title, then the groups after it.
  function build() {
    pages = [];
    for (const el of body.querySelectorAll(".group-title, .group")) {
      if (el.classList.contains("group-title")) pages.push({ key: el.dataset.t || el.textContent, els: [el] });
      else if (pages.length) pages[pages.length - 1].els.push(el);
    }
    for (const page of pages) for (const el of page.els) el.dataset.page = page.key;
    nav.innerHTML = pages
      .map(({ key }) => {
        const [name, colour] = LOOK[key] || OTHER;
        return `<button class="set-item" data-page="${esc(key)}"><span class="set-tile" style="background:${colour}">${icon(name)}</span><span data-t="${esc(key)}"></span></button>`;
      })
      .join("");
    if (!pages.some((p) => p.key === current)) current = pages[0]?.key || "";
    applyLang();
  }

  function show(key) {
    current = key;
    search.value = "";
    filter();
  }

  // One page, or with words in the search, every setting that holds them under the title of its page.
  function filter() {
    const words = fold(search.value.trim());
    body.classList.toggle("searching", !!words);
    let any = false;
    for (const page of pages) {
      let shown = false;
      for (const el of page.els.slice(1)) {
        let groupShown = false;
        for (const item of el.querySelectorAll(".item")) {
          const hit = !words || fold(item.textContent).includes(words) || fold(t(page.key)).includes(words);
          item.hidden = !hit;
          groupShown ||= hit;
        }
        // A group without items (a part's own layout) goes with its page.
        if (!el.querySelector(".item")) groupShown = !words;
        el.hidden = words ? !groupShown : page.key !== current;
        shown ||= !el.hidden;
      }
      page.els[0].hidden = words ? !shown : page.key !== current;
      any ||= shown;
    }
    $("settingsNone").hidden = any;
    $("settingsTitle").dataset.t = words ? "settings" : current;
    for (const b of nav.children) b.classList.toggle("on", !words && b.dataset.page === current);
    applyLang();
    body.scrollTop = 0;
  }

  nav.addEventListener("click", (e) => {
    const b = e.target.closest("[data-page]");
    if (b) show(b.dataset.page);
  });
  search.addEventListener("input", filter);
  search.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Escape" && search.value) {
      e.preventDefault();
      show(current);
    }
  });
  // Up and down move between pages while the list has the focus, as in a sidebar.
  nav.addEventListener("keydown", (e) => {
    if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
    e.preventDefault();
    const i = pages.findIndex((p) => p.key === current) + (e.key === "ArrowDown" ? 1 : -1);
    if (pages[i]) {
      show(pages[i].key);
      nav.querySelector(`[data-page="${CSS.escape(pages[i].key)}"]`)?.focus();
    }
  });

  // Built again each time the sheet opens, from the menu, the palette or a part, so a section a part added late has its
  // page; a search left from before is cleared.
  const sheet = $("settingsSheet");
  let wasOpen = false;
  new MutationObserver(() => {
    const open = sheet.classList.contains("open");
    if (open && !wasOpen) {
      build();
      show(current);
    }
    wasOpen = open;
  }).observe(sheet, { attributes: true, attributeFilter: ["class"] });
  window.addEventListener("DOMContentLoaded", () => build());
  // Opens the settings at a page, by the word of its title.
  return {
    open(page) {
      if (page) current = page;
      if (sheet.classList.contains("open")) show(current);
      else openSheet("settingsSheet");
    },
  };
})();
</script>
<script>
// What File Explorer on Windows has that the core did not: a folder pinned to the sidebar, a folder in a new window,
// the selection turned over or cleared, and a menu of the rest behind a button at the end of the toolbar.
LZ.words({
  vi: {
    "m.openWindow": "Mở trong cửa sổ mới", "m.pin": "Ghim vào Truy cập nhanh", "m.unpin": "Bỏ ghim khỏi Truy cập nhanh",
    "m.select": "Chọn", "m.selectAll": "Chọn tất cả", selectNone: "Bỏ chọn tất cả", invertSelection: "Đảo vùng chọn", moreActions: "Thao tác khác",
  },
  en: {
    "m.openWindow": "Open in New Window", "m.pin": "Pin to Quick Access", "m.unpin": "Unpin from Quick Access",
    "m.select": "Select", "m.selectAll": "Select All", selectNone: "Deselect All", invertSelection: "Invert Selection", moreActions: "More Actions",
  },
});

(() => {
  const act = (name) => (ctx) => Panes.action(name, ctx.pane);
  const folders = (ctx) => ctx.count > 0 && ctx.entries.length > 0 && ctx.entries.every((e) => e.isDir);
  // The folder a pin is about: the one folder selected, or the pane's own on a click beside the items.
  const pinTarget = (ctx) => (ctx.count === 1 && ctx.entry?.isDir ? ctx.entry.uri : ctx.count === 0 ? ctx.tab.uri : null);
  const items = [
    { id: "openWindow", label: "m.openWindow", icon: "macwindow.badge.plus", group: 10, order: 3.5, when: folders, run: act("openInNewWindow") },
    { id: "pin", label: "m.pin", icon: "pin", group: 50, order: 4, when: (ctx) => !!pinTarget(ctx) && !Sidebar.pinned(pinTarget(ctx)), run: (ctx) => Sidebar.pin(pinTarget(ctx), true) },
    { id: "unpin", label: "m.unpin", icon: "pin.slash", group: 50, order: 4, when: (ctx) => !!pinTarget(ctx) && Sidebar.pinned(pinTarget(ctx)), run: (ctx) => Sidebar.pin(pinTarget(ctx), false) },
    {
      id: "select",
      label: "m.select",
      icon: "checklist",
      group: 60,
      order: 4,
      when: (ctx) => ctx.count === 0 && ctx.tab.count > 0,
      submenu: [
        { id: "select.all", label: "m.selectAll", icon: "checkmark.circle", action: "selectAll", run: act("selectAll") },
        { id: "select.none", label: "selectNone", icon: "circle", action: "selectNone", run: act("selectNone") },
        { id: "select.invert", label: "invertSelection", icon: "circle.lefthalf.filled", action: "invertSelection", run: act("invertSelection") },
      ],
    },
  ];
  for (const item of items) LZ.menu.add(item);
  Keys.add({ "Cmd+Alt+A": "selectNone" }, "mac");

  // The menu at the end of the toolbar, as File Explorer's "See more": the selection, what the window shows, and the
  // item's details and the settings. It goes last, after the buttons every other part adds.
  window.addEventListener("DOMContentLoaded", () => {
    LZ.toolbar.add({
      id: "more",
      side: "right",
      icon: "ellipsis",
      label: "moreActions",
      run: async (_, button) => {
        const pane = Panes.focused();
        if (!pane) return;
        const r = button.getBoundingClientRect();
        const has = (action) => !!Panes.actions[action];
        const id = await LZ.choose(

            { id: "invertSelection", label: t("invertSelection"), icon: "circle.lefthalf.filled" },
            { separator: true },
            { id: "toggleHidden", label: t("m.hidden"), icon: "eye", checked: !!S.settings.show_hidden },
            { id: "alwaysTabs", label: t("alwaysTabs"), icon: "rectangle.stack", checked: S.settings.always_tabs !== false },
            ...(has("togglePreview") ? [{ id: "togglePreview", label: t("cmd.togglePreview"), icon: "sidebar.right" }] : []),
            { id: "toggleSidebar", label: t("cmd.toggleSidebar"), icon: "sidebar.left" },
            { separator: true },
            { id: "copyPath", label: t("m.copyPath"), icon: "link" },
            { id: "getInfo", label: t("m.getInfo"), icon: "info.circle" },
            { id: "settings", label: `${t("settings")}...`, icon: "gearshape" },
          ],
          r.left,
          r.bottom + 6,
        );
        if (id === "alwaysTabs") setSetting({ always_tabs: S.settings.always_tabs === false });
        else if (id) Panes.action(id, pane);
      },
    });
    Toolbar.fit();
  });
})();

<script>
// Full Disk Access, asked for once. Without it macOS asks, folder by folder, whether LazySpace may read the Desktop,
// Documents and Downloads, external and network drives; with it, nothing more is asked, and as every build is signed
// with the same certificate (scripts/make-signing-identity.sh), it holds across updates. macOS never offers it in a
// dialog of its own: the window explains it once and opens the pane in System Settings.
words({
  vi: {
    fullDiskTitle: "Cho phép một lần cho mọi thư mục",
    fullDiskText:
      "macOS đang hỏi quyền từng thư mục một (Màn hình nền, Tài liệu, Tải xuống, ổ ngoài, ổ mạng). Cho LazySpace quyền Truy cập toàn bộ ổ đĩa một lần là hết hỏi, kể cả sau khi cập nhật.\n\nTrong Cài đặt sắp mở: bật LazySpace trong danh sách (chưa có thì bấm + rồi chọn LazySpace trong thư mục Ứng dụng), sau đó mở lại LazySpace.",
    fullDiskOpen: "Mở Cài đặt", fullDiskDone: "LazySpace đã có quyền Truy cập toàn bộ ổ đĩa", fullDiskLater: "Lúc khác",
    fullDiskReopen: "Mở lại LazySpace để quyền mới có hiệu lực",
  },
  en: {
    fullDiskTitle: "Allow once for every folder",
    fullDiskText:
      "macOS asks about each folder in turn (Desktop, Documents, Downloads, external and network drives). Give LazySpace Full Disk Access once and nothing more is asked, after updates too.\n\nIn the Settings that open: turn LazySpace on in the list (if it is not there, click + and choose LazySpace in Applications), then open LazySpace again.",
    fullDiskOpen: "Open Settings", fullDiskDone: "LazySpace has Full Disk Access", fullDiskLater: "Later",
    fullDiskReopen: "Open LazySpace again for the new access to take effect",
  },
});

const Access = (() => {
  let waiting = false;

  const granted = () =>
    LZ.call("native.full_disk")
      .then((d) => !!d?.granted)
      .catch(() => true);

  // Explains Full Disk Access and opens its pane; asked at the start until it is given or put off.
  async function ask() {
    if (await granted()) return LZ.toast(t("fullDiskDone"));
    if (!(await LZ.confirm(t("fullDiskTitle"), t("fullDiskText"), t("fullDiskOpen")))) return setSetting({ full_disk_later: true });
    await LZ.call("native.open_full_disk").catch(LZ.say);
    waiting = true;
  }

  // Back from System Settings: macOS gives the access to the next launch of the app.
  window.addEventListener("focus", async () => {
    if (!waiting) return;
    waiting = false;
    LZ.toast(t((await granted()) ? "fullDiskDone" : "fullDiskReopen"));
  });

  LZ.on("app.hello", async (d) => {
    if (d.windowRole !== "main" || S.settings.full_disk_later) return;
    // After the window has drawn, so the question comes over a window that is there.
    setTimeout(async () => {
      if (!(await granted())) ask();
    }, 1500);
  });

  Panes.actions.fullDiskAccess = ask;
  return { ask, granted };
})();
</script>

<script>
// Search (src/features/search.rs, src/features/index.rs). What is typed in the toolbar's field filters the focused pane
// at once, and the items of the quick index that match it best, as fzf matches, show under the field to jump to. Enter,
// or one of the offers above them, searches the pane's folder and every folder in it, or the whole Mac: the results are
// a place of their own (`search://<what>/<folder>`), the best match first, with the folder of each item as a column and
// a bar of filters over them: where, the kind, when it changed, how big, and whether the contents count.
LZ.words({
  vi: {
    searchFor: "Tìm \"{0}\"", searchIn: "Tìm \"{0}\" trong {1} và các thư mục con", searchMac: "Tìm \"{0}\" trên cả máy",
    searchContent: "Tìm \"{0}\" cả trong nội dung tệp", thisMac: "Máy Mac này", recents: "Gần đây", quickHits: "Tệp và thư mục",
    sWhere: "Trong", sKind: "Loại", sDate: "Ngày sửa", sSize: "Kích thước", sContent: "Cả nội dung", sAny: "Bất kỳ",
    "kind.": "Mọi loại", "kind.folder": "Thư mục", "kind.image": "Ảnh", "kind.movie": "Phim", "kind.audio": "Âm thanh", "kind.pdf": "PDF",
    "kind.document": "Tài liệu", "kind.archive": "Tệp nén", "kind.app": "Ứng dụng", "kind.code": "Mã nguồn",
    "date.today": "Hôm nay", "date.week": "7 ngày qua", "date.month": "30 ngày qua", "date.year": "Một năm qua",
    "size.1m": "Trên 1 MB", "size.100m": "Trên 100 MB", "size.1g": "Trên 1 GB",
    searchTitle: "Tìm kiếm", quickIndex: "Chỉ mục tìm nhanh",
    quickIndexHint: "Mọi tệp và thư mục trong thư mục nhà và Ứng dụng, giữ trong bộ nhớ và tự cập nhật, so khớp như fzf (gõ không dấu vẫn ra). Bỏ qua mục ẩn, Library, node_modules và thư mục build.",
    indexCount: "{0} mục", indexBuilding: "Đang lập chỉ mục...", indexNotReady: "Chưa có chỉ mục", reindex: "Lập lại chỉ mục",
  },
  en: {
    searchFor: "Search \"{0}\"", searchIn: "Search \"{0}\" in {1} and its folders", searchMac: "Search \"{0}\" on this Mac",
    searchContent: "Search \"{0}\" in the contents of files too", thisMac: "This Mac", recents: "Recents", quickHits: "Files and Folders",
    sWhere: "In", sKind: "Kind", sDate: "Modified", sSize: "Size", sContent: "Contents too", sAny: "Any",
    "kind.": "Any Kind", "kind.folder": "Folders", "kind.image": "Images", "kind.movie": "Movies", "kind.audio": "Audio", "kind.pdf": "PDF",
    "kind.document": "Documents", "kind.archive": "Archives", "kind.app": "Applications", "kind.code": "Source Code",
    "date.today": "Today", "date.week": "Last 7 Days", "date.month": "Last 30 Days", "date.year": "Last Year",
    "size.1m": "Over 1 MB", "size.100m": "Over 100 MB", "size.1g": "Over 1 GB",
    searchTitle: "Search", quickIndex: "Quick index",
    quickIndexHint: "Every file and folder in the home folder and Applications, held in memory and kept up to date, matched as fzf matches (accents optional). Hidden items, the Library, node_modules and build folders are left out.",
    indexCount: "{0} items", indexBuilding: "Indexing...", indexNotReady: "No index yet", reindex: "Index Again",
  },
});

const Search = (() => {
  const KINDS = ["", "folder", "image", "movie", "audio", "pdf", "document", "archive", "app", "code"];
  const DATES = ["", "today", "week", "month", "year"];
  const SIZES = ["", "1m", "100m", "1g"];
  const ICON_OF = { folder: "folder", image: "photo", movie: "film", audio: "music.note", pdf: "doc.richtext", document: "doc.text", archive: "archivebox", app: "app", code: "chevron.left.forwardslash.chevron.right" };

  // The query of a search URI ({ q, kind, date, size, content, tag, recent, from }), and a search URI of a query and
  // a folder (`/` for the whole Mac). Each value is encoded, then the whole query once more as the authority.
  const isSearch = (uri) => schemeOf(uri) === "search";
  const query = (uri) => Object.fromEntries(new URLSearchParams(authorityOf(uri)));
  function uriOf(q, folder) {
    const text = Object.entries(q)
      .filter(([, v]) => v)
      .map(([k, v]) => `${k}=${encodeURIComponent(v)}`)
      .join("&");
    return `search://${encodeURIComponent(text)}${encodePath(folder || "/")}`;
  }
  const folderOf = (uri) => pathOf(uri);
  const title = (uri) => {
    const q = query(uri);
    if (q.recent === "1") return t("recents");
    if (!q.q && q.tag) return typeof Tags === "undefined" ? q.tag : Tags.label(q.tag);
    return t("searchFor", q.q || "");
  };
  placeNames.search = title;
  placeCrumbs.search = (uri) => {
    const q = query(uri);
    const folder = folderOf(uri);
    const crumbs = [];
    if (q.q) crumbs.push(folder === "/" ? [fileUri("/"), t("thisMac"), "path:/"] : [fileUri(folder), nameOf(fileUri(folder)), `path:${folder}`]);
    crumbs.push([uri, title(uri), null]);
    return crumbs;
  };

  // Where a search from the focused pane looks: its folder on this Mac, the folder of the search it shows, or the home.
  function scopeOf(pane) {
    const uri = pane.tab.uri;
    if (isSearch(uri)) return query(uri).from || folderOf(uri);
    return isLocal(uri) ? pathOf(uri) : pathOf(S.places.home || "file:///");
  }

  function run(pane, text, { mac = false, content = false } = {}) {
    const words = text.trim();
    if (!pane || !words) return;
    const folder = scopeOf(pane);
    const before = isSearch(pane.tab.uri) ? query(pane.tab.uri) : {};
    const q = { ...before, q: words, content: content || before.content ? "1" : "", recent: "", tag: "", from: mac ? folder : "" };
    pane.navigate(uriOf(q, mac ? "/" : folder), { history: !isSearch(pane.tab.uri) });
    pane.list.focus({ preventScroll: true });
  }

  // Under the toolbar's field while it holds text: the offers to search (this folder and those in it, which Enter takes,
  // the whole Mac, the contents too), then the items of the quick index that match best. A folder opens in the pane; a
  // file opens its folder with it selected, or with Command opens in its app.
  let offers = null;
  let at = 0;
  let hits = [];
  let asked = 0;
  const input = $("searchInput");
  function choices() {
    const pane = Panes.focused();
    const text = input.value.trim();
    if (!pane || !text) return [];
    const folder = scopeOf(pane);
    const name = folder === "/" ? t("thisMac") : nameOf(fileUri(folder));
    const list = [
      { label: t("searchIn", text, name), icon: "magnifyingglass", go: () => run(pane, text) },
      { label: t("searchMac", text), icon: "desktopcomputer", go: () => run(pane, text, { mac: true }) },
      { label: t("searchContent", text), icon: "doc.text.magnifyingglass", go: () => run(pane, text, { content: true }) },
    ];
    for (const hit of hits) {
      const uri = fileUri(hit.path);
      const parent = fileUri(hit.path.slice(0, hit.path.lastIndexOf("/")) || "/");
      list.push({
        hit,
        label: hit.path.split("/").pop(),
        where: placeLabel(parent),
        go: (e) => {
          if (hit.folder) return pane.navigate(uri);
          if (e?.metaKey) return LZ.call("native.open", { uris: [uri] }).catch(LZ.say);
          pane.navigate(parent, { select: [hit.path.split("/").pop()] });
        },
      });
    }
    return list;
  }
  function close() {
    offers?.remove();
    offers = null;
  }
  function show() {
    const list = choices();
    if (!list.length || document.activeElement !== input) return close();
    if (!offers) {
      offers = document.createElement("div");
      offers.className = "suggest search-offers";
      document.body.appendChild(offers);
      offers.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const div = e.target.closest("[data-i]");
        if (div) pick(Number(div.dataset.i), e);
      });
    }
    at = Math.min(at, list.length - 1);
    const r = $("tbSearch").getBoundingClientRect();
    const width = Math.max(360, r.width);
    offers.style.left = `${Math.max(8, r.right - width)}px`;
    offers.style.top = `${r.bottom + 6}px`;
    offers.style.width = `${width}px`;
    offers.innerHTML = list
      .map((c, i) => {
        const head = c.hit && !list[i - 1]?.hit ? `<p class="suggest-head">${LZ.esc(t("quickHits"))}</p>` : "";
        const pic = c.hit ? `<img src="lazy://icon/${16 * pixelRatio()}/${encodeURIComponent(`path:${c.hit.path}`)}" alt="" draggable="false">` : icon(c.icon);
        const where = c.where ? `<small>${LZ.esc(c.where)}</small>` : "";
        return `${head}<div data-i="${i}" class="${i === at ? "on" : ""}">${pic}<span>${LZ.esc(c.label)}</span>${where}</div>`;
      })
      .join("");
  }
  function pick(i, e) {
    const choice = choices()[i];
    close();
    choice?.go(e);
  }
  // The best of the quick index for what is typed; an answer to an older text is dropped.
  let timer;
  function ask() {
    clearTimeout(timer);
    const text = input.value.trim();
    if (!text) {
      hits = [];
      return show();
    }
    timer = setTimeout(() => {
      const mine = ++asked;
      LZ.call("index.search", { q: text, limit: 8 })
        .then((d) => {
          if (mine !== asked || input.value.trim() !== text) return;
          hits = d.items;
          show();
        })
        .catch(() => {});
    }, 40);
  }
  LZ.icons.add({ magnifyingglass: "magnifyingglass", desktopcomputer: "desktopcomputer", "doc.text.magnifyingglass": "doc.text.magnifyingglass" });
  input.addEventListener("input", () => {
    at = 0;
    show();
    ask();
  });
  input.addEventListener("focus", () => {
    show();
    ask();
  });
  input.addEventListener("blur", () => setTimeout(close, 100));

  // The keys of the field while offers show (04-core-toolbar.js asks first): Enter takes the one marked (with Command, a
  // file opens in its app), the arrows move the mark. Returns whether the key was taken.
  function keydown(e) {
    if (!offers) return false;
    const n = choices().length;
    if (e.key === "Enter") {
      e.preventDefault();
      pick(at, e);
      return true;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      at = (at + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
      show();
      return true;
    }
    if (e.key === "Escape") close();
    return false;
  }

  // The bar of filters over the results of a search with words, as Finder's search bar: each filter a pill with its
  // menu; a change searches again in place.
  async function filterMenu(pane, which, button) {
    const uri = pane.tab.uri;
    const q = query(uri);
    const folder = folderOf(uri);
    const r = button.getBoundingClientRect();
    const go = (patch, where = folder) => pane.navigate(uriOf({ ...q, ...patch }, where), { history: false });
    if (which === "where") {
      const home = q.from || folder;
      const id = await LZ.choose(
        [
          { id: "here", label: home === "/" ? t("thisMac") : nameOf(fileUri(home)), icon: "folder", checked: folder !== "/" },
          { id: "mac", label: t("thisMac"), icon: "desktopcomputer", checked: folder === "/" },
        ],
        r.left,
        r.bottom + 4,
      );
      if (id === "mac" && folder !== "/") go({ from: folder }, "/");
      else if (id === "here" && folder === "/" && q.from) go({ from: "" }, q.from);
      return;
    }
    if (which === "content") return go({ content: q.content === "1" ? "" : "1" });
    const values = { kind: KINDS, date: DATES, size: SIZES }[which];
    const id = await LZ.choose(
      values.map((v) => ({ id: v || "any", label: v ? t(`${which}.${v}`) : which === "kind" ? t("kind.") : t("sAny"), icon: which === "kind" ? ICON_OF[v] : undefined, checked: (q[which] || "") === v })),
      r.left,
      r.bottom + 4,
    );
    if (id) go({ [which]: id === "any" ? "" : id });
  }

  function paintBar(pane) {
    const uri = pane.tab?.uri;
    const q = isSearch(uri) ? query(uri) : null;
    let bar = pane.el.querySelector(".search-bar");
    if (!q?.q) return bar?.remove();
    if (!bar) {
      bar = document.createElement("div");
      bar.className = "search-bar";
      pane.path.after(bar);
      bar.addEventListener("click", (e) => {
        const b = e.target.closest("[data-filter]");
        if (b) filterMenu(pane, b.dataset.filter, b);
      });
    }
    const folder = folderOf(uri);
    const pill = (which, label, value, on) => `<button class="pill${on ? " on" : ""}" data-filter="${which}"><span>${LZ.esc(label)}</span>${value ? `<b>${LZ.esc(value)}</b>` : ""}${which === "content" ? "" : icon("chevron.down")}</button>`;
    bar.innerHTML = [
      pill("where", t("sWhere"), folder === "/" ? t("thisMac") : nameOf(fileUri(folder)), false),
      pill("kind", t("sKind"), q.kind ? t(`kind.${q.kind}`) : "", !!q.kind),
      pill("date", t("sDate"), q.date ? t(`date.${q.date}`) : "", !!q.date),
      pill("size", t("sSize"), q.size ? t(`size.${q.size}`) : "", !!q.size),
      pill("content", t("sContent"), "", q.content === "1"),
    ].join("");
  }
  Panes.on("render", ({ pane }) => paintBar(pane));

  // Settings: how big the quick index is, and a button to walk the disk again.
  const group = LZ.settings.section({
    id: "search",
    title: "searchTitle",
    build(el) {
      el.innerHTML = `<div class="item"><div class="label"><span data-t="quickIndex"></span><small data-t="quickIndexHint"></small><small data-index="state"></small></div>
        <div class="control"><button class="push" data-index="again" data-t="reindex"></button></div></div>`;
    },
  });
  const note = group.querySelector('[data-index="state"]');
  async function paintIndex() {
    const s = await LZ.call("index.state").catch(() => null);
    if (!s) return;
    note.textContent = s.building && !s.ready ? t("indexBuilding") : s.ready ? t("indexCount", s.count.toLocaleString(locale())) + (s.building ? ` (${t("indexBuilding")})` : "") : t("indexNotReady");
    if (s.building) setTimeout(paintIndex, 1000);
  }
  group.querySelector('[data-index="again"]').addEventListener("click", () => LZ.call("index.rebuild").then(() => setTimeout(paintIndex, 100), LZ.say));
  new MutationObserver(() => $("settingsSheet").classList.contains("open") && paintIndex()).observe($("settingsSheet"), { attributes: true, attributeFilter: ["class"] });

  return { isSearch, query, uriOf, run, keydown };
})();
</script>
<script>
// New files from templates (W2): a toolbar button and a context menu entry list the templates; the new file is
// selected and its name is ready to type, as a new folder's is.
LZ.words({
  vi: { newFile: "Tệp mới", templatesFolder: "Mở thư mục mẫu", addTemplate: "Dùng tệp đã chọn làm mẫu", templateAdded: "Đã thêm mẫu" },
  en: { newFile: "New File", templatesFolder: "Open the Templates Folder", addTemplate: "Use the Selected File as a Template", templateAdded: "Template added" },
});
LZ.icons.add({
  "doc.plus": "doc.badge.plus",
});

const Templates = (() => {
  let list = [];
  const SYMBOL = { txt: "doc.text", md: "doc.plaintext", docx: "doc.richtext", xlsx: "tablecells", sh: "terminal", py: "chevron.left.forwardslash.chevron.right", html: "globe", json: "curlybraces" };

  async function load() {
    list = await LZ.call("templates.list").catch(() => list);
    return list;
  }

  function create(pane, id) {
    const tab = pane.tab;
    LZ.call("templates.create", { uri: tab.uri, id })
      .then((entry) => {
        tab.pendingRename = entry.name;
        pane.refresh();
      })
      .catch(LZ.say);
  }

  const entries = () => list.map((tpl) => ({ id: `tpl:${tpl.id}`, label: tpl.builtin ? tpl.name : `${tpl.name}${tpl.ext ? `.${tpl.ext}` : ""}`, icon: SYMBOL[tpl.ext] || "doc" }));

  // The new-file button sits with the new-folder and Trash buttons.
  $("tbActions").prepend($("tb-newFile"));

  LZ.menu.add({
    id: "newFile",
    label: "newFile",
    icon: "doc.badge.plus",
    group: 50,
    order: 0,

<script>
// The current folder in a terminal or an editor (W2): two toolbar buttons open it in the default of each kind, and
// the context menu lists every one on this Mac; the one used last becomes the default.
LZ.words({
  vi: { openTerminal: "Mở trong Terminal", openEditor: "Mở trong trình soạn thảo", otherApp: "Ứng dụng khác..." },
  en: { openTerminal: "Open in Terminal", openEditor: "Open in Editor", otherApp: "Other App..." },
});
LZ.icons.add({
  terminal: "terminal",
  editor: "chevron.left.forwardslash.chevron.right",
});

const OpenIn = (() => {
  let tools = [];
  const load = async () => (tools = await LZ.call("openin.tools").catch(() => tools));

  // The folder the pane shows, or the selected item for an editor when one is selected.
  function target(pane, kind) {
    const tab = pane.tab;
    const one = tab.selCount() === 1 ? tab.selectedEntries()[0] : null;
    return kind === "editor" && one ? one.uri : tab.uri;
  }

  function open(pane, kind, tool) {
    if (!isLocal(pane.tab.uri)) return;
    LZ.call("openin.open", { kind, tool, uri: target(pane, kind) })
      .then(load)
      .catch(LZ.say);
  }

  async function chooseTool(pane, kind, x, y) {
    await load();
    const own = tools.filter((t) => t.kind === kind);
    const id = await LZ.choose(own.map((tool) => ({ id: tool.id, label: tool.name, checked: tool.default })), x, y);
    if (id) open(pane, kind, id);
  }

  for (const kind of ["terminal", "editor"]) {
    const b = LZ.toolbar.add({
      id: kind,
      side: "left",
      icon: kind,
      label: kind === "terminal" ? "openTerminal" : "openEditor",
      run: (e, button) => {
        const pane = Panes.focused();
        if (!pane) return;
        // Option-click picks another app; a click uses the default.
        if (e.altKey) {
          const r = button.getBoundingClientRect();
          chooseTool(pane, kind, r.left, r.bottom + 6);
        } else open(pane, kind, null);
      },
    });
    b.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      const r = b.getBoundingClientRect();
      chooseTool(Panes.focused(), kind, r.left, r.bottom + 6);
    });
  }

  for (const [kind, label, symbol] of [
    ["terminal", "openTerminal", "terminal"],
    ["editor", "openEditor", "chevron.left.forwardslash.chevron.right"],
  ]) {
    LZ.menu.add({
      id: `openin.${kind}`,
      label,
      icon: symbol,
      group: 55,
      order: kind === "terminal" ? 1 : 2,
      when: (c) => isLocal(c.tab.uri) && tools.some((t) => t.kind === kind),
      submenu: () =>
        tools
          .filter((t) => t.kind === kind)
          .map((tool) => ({ id: `openin.${kind}.${tool.id}`, label: () => tool.name, checked: () => tool.default, run: (c) => open(c.pane, kind, tool.id) })),
    });
  }

  LZ.on("app.hello", load);
  return { load, open };
})();
</script>

<script>
// The hashes of the selected files (W2), in a sheet: every algorithm for each file, a button to copy one, and a field
// to paste a hash into, which marks the one that matches.
LZ.words({
  vi: {
    hashTitle: "Mã băm", hashMenu: "Tính mã băm", hashCompare: "Dán mã băm để đối chiếu", hashMatch: "Khớp {0} của \"{1}\"",
    hashNoMatch: "Không khớp mã nào", hashWorking: "Đang tính...", copied: "Đã sao chép", copy: "Sao chép",
  },
  en: {
    hashTitle: "Hashes", hashMenu: "Calculate Hashes", hashCompare: "Paste a hash to compare", hashMatch: "Matches the {0} of \"{1}\"",
    hashNoMatch: "Matches none of them", hashWorking: "Working...", copied: "Copied", copy: "Copy",
  },
});

const Hash = (() => {
  const ALGOS = [
    ["md5", "MD5"],
    ["sha1", "SHA-1"],
    ["sha224", "SHA-224"],
    ["sha256", "SHA-256"],
    ["sha384", "SHA-384"],
    ["sha512", "SHA-512"],
    ["crc32", "CRC32"],
  ];
  const panel = LZ.sheet.create("hashSheet");
  panel.classList.add("hash-panel");
  panel.innerHTML = `
    <h2 data-t="hashTitle"></h2>
    <input class="hash-compare" type="text" spellcheck="false" data-tp="hashCompare" />
    <div class="hash-verdict"></div>
    <div class="hash-files"></div>
    <div class="buttons"><button class="push primary" data-t="done"></button></div>`;
  const files = panel.querySelector(".hash-files");
  const compare = panel.querySelector(".hash-compare");
  const verdict = panel.querySelector(".hash-verdict");
  let job = null;
  let results = [];

  // A hash as typed or pasted: lower case, without spaces, colons or dashes.
  const normal = (text) => text.toLowerCase().replace(/[\s:-]/g, "");

  function check() {
    const want = normal(compare.value);
    for (const row of panel.querySelectorAll(".hash-row")) row.classList.toggle("match", !!want && row.dataset.value === want);
    if (!want) return (verdict.textContent = "");
    const hit = results.flatMap((r) => ALGOS.filter(([key]) => r.hashes[key] === want).map(([, label]) => [label, r.name]))[0];
    verdict.textContent = hit ? t("hashMatch", hit[0], hit[1]) : t("hashNoMatch");
    verdict.className = `hash-verdict ${hit ? "yes" : "no"}`;
  }

  function add(result) {
    results.push(result);
    const el = document.createElement("div");
    el.className = "hash-file";
    el.innerHTML = `<div class="hash-name"><b>${LZ.esc(result.name)}</b> <span>${fmtSize(result.size)}</span></div>${ALGOS.map(
      ([key, label]) => `<div class="hash-row" data-value="${result.hashes[key]}"><span>${label}</span><code>${result.hashes[key]}</code><button class="push" data-copy="${result.hashes[key]}">${LZ.esc(t("copy"))}</button></div>`,
    ).join("")}`;
    files.querySelector(".hash-wait")?.remove();
    files.appendChild(el);
    check();
  }

  function start(pane) {
    results = [];
    files.innerHTML = `<p class="hash-wait">${LZ.esc(t("hashWorking"))}</p>`;
    compare.value = "";
    verdict.textContent = "";
    LZ.sheet.open("hashSheet");
    LZ.call("hash.start", pane.tab.selection())
      .then((d) => (job = d.job))
      .catch((error) => {
        files.innerHTML = `<p>${LZ.esc(error)}</p>`;
      });
  }

  panel.addEventListener("click", (e) => {
    const copy = e.target.closest("[data-copy]");
    if (copy) LZ.call("clipboard.text", { text: copy.dataset.copy }).then(() => LZ.toast(t("copied")), LZ.say);
    if (e.target.closest(".buttons .push")) LZ.sheet.close();
  });
  compare.addEventListener("input", check);
  LZ.on("hash.started", (d) => (job = d.job));
  LZ.on("hash.result", (d) => {
    if (d.job === job) add(d.result);
  });
  LZ.on("jobs.finished", (d) => {
    if (d.id === job && !d.ok && !d.cancelled) files.innerHTML = `<p>${LZ.esc(d.error || "")}</p>`;
  });

  LZ.menu.add({ id: "hash", label: "hashMenu", icon: "number", group: 20, order: 5, when: (c) => c.count > 0 && c.entries.some((e) => e.kind === "file"), run: (c) => start(c.pane) });
  return { start };
})();
</script>

<script>
// The column view and the gallery, as Finder has them. In the column view the tab's folder is one column after the
// folders above it, each with the way down marked; one folder selected opens in the column after it, and one file shows
// a preview there. The tab's own list is the column of its folder, so selecting, dragging, the menu and the keys work as
// in a list; the other columns are lists of their own, shown only: a click in one goes there. The gallery shows the item
// selected large over a strip of the folder's items.
LZ.words({
  vi: { asColumns: "Dạng cột", asGallery: "Dạng gallery", "m.asColumns": "Cột", "m.asGallery": "Gallery", columnTooBig: "Chỉ hiện {0} mục đầu" },
  en: { asColumns: "as Columns", asGallery: "as Gallery", "m.asColumns": "Columns", "m.asGallery": "Gallery", columnTooBig: "Only the first {0} items" },
});

const Columns = (() => {
  // The most rows a column of its own shows.
  const LIMIT = 2000;
  // The listings of the columns, by URI: listed once, kept while a column shows them, listed again when they change.
  const lists = new Map();
  // What each side of a strip was last drawn from, to draw it again only when that changes.
  const drawn = new WeakMap();
  let seq = 0;

  function listing(pane, uri) {
    let list = lists.get(uri);
    if (list) return list;
    list = { id: `w${S.window.id}col${++seq}`, uri, rows: null, count: 0 };
    lists.set(uri, list);
    call("fs.list", { view: list.id, uri, sort: pane.sortOf(pane.tab), showHidden: !!S.settings.show_hidden }).catch(() => {
      list.rows = [];
      paintAll();
    });
    return list;
  }

  on("view.changed", async (d) => {
    const list = [...lists.values()].find((l) => l.id === d.view);
    if (!list) return;
    const rows = [];
    for (let start = 0; start < Math.min(d.count, LIMIT); start += 500) {
      const got = await call("view.rows", { view: list.id, start, count: 500, generation: d.generation }).catch(() => null);
      if (!got) return;
      rows.push(...got.rows);
    }
    list.rows = rows;
    list.count = d.count;
    paintAll();
  });
  on("view.error", (d) => {
    const list = [...lists.values()].find((l) => l.id === d.view);
    if (!list) return;
    list.rows = [];
    paintAll();
  });

  // The folders above the tab's, from the start of its place (the home folder, the disk, a server's root, an
  // archive's top), the highest first; none for a search or the shelf.
  function above(uri) {
    const scheme = schemeOf(uri);
    if (!uri || scheme === "search" || scheme === "stash") return [];
    const path = pathOf(uri);
    if (scheme === "archive") {
      const cut = path.indexOf("!");
      const archive = path.slice(0, cut);
      const parts = path.slice(cut + 1).split("/").filter(Boolean);
      return parts.map((_, i) => archiveUri(archive, parts.slice(0, i).join("/")));
    }
    const home = S.places.home ? pathOf(S.places.home) : null;
    const start = scheme === "file" && home && (path === home || path.startsWith(`${home}/`)) ? home : "/";
    if (path === start) return [];
    const folders = [start];
    let at = start === "/" ? "" : start;
    for (const part of path.slice(start.length).split("/").filter(Boolean).slice(0, -1)) folders.push((at = `${at}/${part}`));
    return folders.map((p) => (scheme === "file" ? fileUri(p) : withPath(uri, p)));
  }

  // The column of a listing, the row of `marked` shown as the way down.
  function column(list, marked) {
    const rows = list.rows;
    const body = !rows
      ? `<p class="mnote">${esc(t("loading"))}</p>`
      : rows
          .map((e, i) => {
            const opens = e.isDir || LZ.vfs.browse(e) ? icon("chevron.right") : "";
            return `<div class="mrow${e.name === marked ? " on" : ""}" data-i="${i}"><img src="${esc(iconUrl(e, 16))}" alt="" draggable="false"><span>${esc(e.name)}</span>${opens}</div>`;
          })
          .join("") + (list.count > rows.length ? `<p class="mnote">${esc(t("columnTooBig", rows.length))}</p>` : "");
    return `<div class="mcol" data-uri="${esc(list.uri)}">${body}</div>`;
  }

  // The preview of one file, as the last column of Finder's shows it.
  function preview(e) {
    const thumb = thumbUrl(e, 256);
    const pic = thumb ? thumbImg(thumb, iconUrl(e, 128), "mthumb") : `<img class="micon" src="${esc(iconUrl(e, 128))}" alt="" draggable="false">`;
    const facts = [e.type, e.isDir ? null : fmtSize(e.size), fmtDate(e.mtime)].filter(Boolean).map((f) => `<span>${esc(f)}</span>`).join("");
    return `<div class="mcol mpreview">${pic}<b>${esc(e.name)}</b><div class="mfacts">${facts}</div></div>`;
  }

  // Puts the tab's list in a strip of columns in the column view, and back where it was in any other.
  function strip(pane) {
    let el = pane.el.querySelector(".col-strip");
    if (pane.tab?.mode !== "columns") {
      if (el) {
        el.replaceWith(pane.list);
        for (const list of lists.values()) list.panes?.delete(pane);
      }
      return null;
    }
    if (!el) {
      el = document.createElement("div");
      el.className = "col-strip";
      pane.list.replaceWith(el);
      el.appendChild(pane.list);
      el.addEventListener("click", (e) => go(pane, e, false));
      el.addEventListener("dblclick", (e) => go(pane, e, true));
    }
    return el;
  }

  // A click on a row of a column of its own goes to that folder with the row selected; a double click on a file opens it.
  function go(pane, e, twice) {
    const row = e.target.closest(".mcol .mrow");
    const col = row?.closest(".mcol");
    if (!row || !col) return;
    const entry = lists.get(col.dataset.uri)?.rows?.[Number(row.dataset.i)];
    if (!entry) return;
    if (twice && !entry.isDir && !LZ.vfs.browse(entry)) return call("native.open", { uris: [entry.uri] }).catch(say);
    pane.navigate(col.dataset.uri, { select: [entry.name] });
    pane.list.focus({ preventScroll: true });
  }

  function paint(pane) {
    const el = strip(pane);
    stage(pane);
    if (!el) return;
    const tab = pane.tab;
    const folders = above(tab.uri);
    const names = [...folders.slice(1), tab.uri].map((u) => nameOf(u));
    const before = folders.map((uri, i) => column(listing(pane, uri), names[i])).join("");
    const one = tab.selCount() === 1 ? tab.selectedEntries()[0] : null;
    const into = one && pane.browsable(one);
    const after = into ? column(listing(pane, into), null) : one ? preview(one) : "";
    // Only what changed is drawn again, so a column keeps where it was scrolled.
    const parts = { before, after };
    for (const [side, html] of Object.entries(parts)) {
      const holder = el.querySelector(`.mside.${side}`) || el.insertAdjacentElement(side === "before" ? "afterbegin" : "beforeend", Object.assign(document.createElement("div"), { className: `mside ${side}` }));
      if (drawn.get(holder) === html) continue;
      const scrolls = [...holder.querySelectorAll(".mcol")].map((c) => [c.dataset.uri, c.scrollTop]);
      holder.innerHTML = html;
      drawn.set(holder, html);
      for (const [uri, top] of scrolls) {
        const c = holder.querySelector(`.mcol[data-uri="${CSS.escape(uri || "")}"]`);
        if (c) c.scrollTop = top;
      }
      for (const c of holder.querySelectorAll(".mrow.on")) c.scrollIntoView({ block: "nearest" });
    }
    el.scrollLeft = el.scrollWidth;
    tidy();
  }

  // Listings no column shows any more are let go.
  function tidy() {
    const shown = new Set([...document.querySelectorAll(".col-strip .mcol[data-uri]")].map((c) => c.dataset.uri));
    for (const [uri, list] of lists) {
      if (shown.has(uri)) continue;
      lists.delete(uri);
      call("view.close", { view: list.id }).catch(() => {});
    }
  }

  // The gallery's stage: the item selected (or the first) large, its name and what it is under it.
  function stage(pane) {
    let el = pane.el.querySelector(".gallery-stage");
    if (pane.tab?.mode !== "gallery") return el?.remove();
    if (!el) {
      el = document.createElement("div");
      el.className = "gallery-stage";
      pane.list.before(el);
      el.addEventListener("dblclick", () => Panes.action("open", pane));
    }
    const tab = pane.tab;
    const e = tab.rows.get(tab.lead) || tab.selectedEntries()[0] || tab.rows.get(0);
    const key = e ? `${tab.generation}|${e.uri}` : "";
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    if (!e) return (el.innerHTML = "");
    const thumb = thumbUrl(e, 1024);
    const pic = thumb ? thumbImg(thumb, iconUrl(e, 256), "gthumb", "gicon") : `<img class="gicon" src="${esc(iconUrl(e, 256))}" alt="" draggable="false">`;
    const facts = [e.type, e.isDir ? null : fmtSize(e.size), fmtDate(e.mtime)].filter(Boolean).join("  ·  ");
    el.innerHTML = `<div class="gpic">${pic}</div><b>${esc(e.name)}</b><small>${esc(facts)}</small>`;
  }

  function paintAll() {
    for (const pane of Panes.all()) if (pane.tab?.mode === "columns" || pane.tab?.mode === "gallery" || pane.el.querySelector(".col-strip, .gallery-stage")) paint(pane);
  }

  Panes.on("render", ({ pane }) => paint(pane));
  Panes.on("selection", ({ pane }) => pane && paint(pane));

  // Left goes out to the folder above with this one selected; right goes into the one folder selected, at its first item.
  Object.assign(Panes.actions, {
    columnOut(pane) {
      if (above(pane.tab.uri).length) Panes.action("enclosing", pane);
    },
    columnIn(pane) {
      const one = pane.tab.selCount() === 1 ? pane.tab.selectedEntries()[0] : null;
      const into = one && pane.browsable(one);
      if (!into) return;
      const first = lists.get(into)?.rows?.[0]?.name;
      pane.navigate(into, { select: first ? [first] : null });
    },
  });

  return { paint };
})();
</script>

:root { --tag-1: #8e8e93; --tag-2: #34c759; --tag-3: #af52de; --tag-4: #007aff; --tag-5: #ffcc00; --tag-6: #ff3b30; --tag-7: #ff9500; }

<script>
// Finder's colour tags (src/features/tags.rs): dots after a name in every view, a menu of the seven colours on the
// items selected, and a section of the sidebar where each colour is a search of the whole Mac for it.
LZ.words({
  vi: {
    tagsTitle: "Thẻ", "m.tags": "Thẻ", "tag.1": "Xám", "tag.2": "Xanh lá", "tag.3": "Tím", "tag.4": "Xanh dương", "tag.5": "Vàng", "tag.6": "Đỏ", "tag.7": "Cam",
  },
  en: {
    tagsTitle: "Tags", "m.tags": "Tags", "tag.1": "Gray", "tag.2": "Green", "tag.3": "Purple", "tag.4": "Blue", "tag.5": "Yellow", "tag.6": "Red", "tag.7": "Orange",
  },
});

const Tags = (() => {
  // Finder's names of its colours, by number, which a tag is written with (src/native/tags.rs), in Finder's order.
  const NAMES = ["", "Gray", "Green", "Purple", "Blue", "Yellow", "Red", "Orange"];
  const ORDER = [6, 7, 5, 2, 4, 3, 1];
  const colourOf = (name) => NAMES.findIndex((n, i) => i > 0 && n.toLowerCase() === String(name).toLowerCase());
  // A tag's name as the user's language says it: Finder's colours by their colour, any other as it was named.
  const label = (name) => (colourOf(name) > 0 ? t(`tag.${colourOf(name)}`) : name);
  const has = (entry, colour) => (entry.tags || []).some(([name, c]) => Number(c) === colour || colourOf(name) === colour);

  LZ.menu.add({
    id: "tags",
    label: "m.tags",
    icon: "tag",
    group: 50,
    order: 5,
    when: (ctx) => ctx.count > 0 && ctx.entries.length > 0 && ctx.entries.every((e) => isLocal(e.uri)),
    submenu: ORDER.map((colour) => ({
      id: `tag.${colour}`,
      label: `tag.${colour}`,
      checked: (ctx) => ctx.entries.every((e) => has(e, colour)),
      run: (ctx) => {
        const on = !ctx.entries.every((e) => has(e, colour));
        LZ.call("tags.set", { uris: ctx.entries.map((e) => e.uri), colour, on })
          .then(() => ctx.pane.refresh())
          .catch(LZ.say);
      },
    })),
  });

  // The sidebar's tags: each colour opens the search of the Mac for it.
  const section = LZ.sidebar.section({
    id: "tags",
    render(el) {
      el.innerHTML =
        `<div class="side-head"><span>${LZ.esc(t("tagsTitle"))}</span></div>` +
        ORDER.map((colour) => {
          const uri = Search.uriOf({ tag: NAMES[colour] }, "/");
          return `<button class="side-item" data-uri="${LZ.esc(uri)}"><span class="ico"><i class="tag-dot tag-${colour}"></i></span><span class="label">${LZ.esc(t(`tag.${colour}`))}</span></button>`;
        }).join("");
    },
  });
  // At the foot of the sidebar, after the disks, where Finder keeps them.
  $("sideLocations").after(section.el);
  LZ.on("settings.changed", section.refresh);

  return { label, colourOf };
})();
</script>
