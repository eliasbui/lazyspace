<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LazySpace</title>
    <script>
      // The app puts the language, the light or dark and the glass of the settings on the root (main.rs `page`); the
      // classes the styles follow are set from them here, before the first frame, and again when the system changes.
      (() => {
        const root = document.documentElement;
        const system = matchMedia("(prefers-color-scheme: dark)");
        window.paintTheme = () => {
          const theme = root.dataset.theme || "system";
          root.classList.toggle("dark", theme === "dark" || (theme !== "light" && system.matches));
          root.classList.toggle("glass", root.hasAttribute("data-glass"));
        };
        paintTheme();
        system.addEventListener("change", paintTheme);
      })();
    </script>
    <style>
      /* The colours of a Finder window on macOS 26, light and dark; the accent is the user's own. */
      :root {
        color-scheme: light;
        --accent: #007aff;
        --icon: 64px;
        --window: #ffffff;
        --sidebar: rgba(243, 243, 245, 0.96);
        --sidebar-stroke: rgba(0, 0, 0, 0.07);
        --label: rgba(0, 0, 0, 0.86);
        --secondary: rgba(0, 0, 0, 0.5);
        --tertiary: rgba(0, 0, 0, 0.26);
        --separator: rgba(0, 0, 0, 0.09);
        --hover: rgba(0, 0, 0, 0.05);
        --pressed: rgba(0, 0, 0, 0.1);
        --nav-selected: rgba(0, 0, 0, 0.08);
        --stripe: rgba(0, 0, 0, 0.025);
        --row-selected: var(--accent);
        --row-selected-dim: rgba(0, 0, 0, 0.09);
        --capsule: rgba(255, 255, 255, 0.92);
        --capsule-stroke: rgba(0, 0, 0, 0.1);
        --capsule-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.05);
        --field: rgba(0, 0, 0, 0.05);
        --field-bg: #ffffff;
        --field-stroke: rgba(0, 0, 0, 0.14);
        --btn: #ffffff;
        --btn-stroke: rgba(0, 0, 0, 0.13);
        --panel: #f5f5f7;
        --panel-stroke: rgba(0, 0, 0, 0.1);
        --menu: rgba(250, 250, 252, 0.96);
        --group: #ffffff;
        --group-stroke: rgba(0, 0, 0, 0.06);
        --track: rgba(0, 0, 0, 0.1);
        --rim: transparent;
        --red: #ff3b30;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
      }
      @supports (color: -apple-system-control-accent) {
        :root { --accent: -apple-system-control-accent; }
      }
      :root.dark {
        color-scheme: dark;
        --window: #1e1e1e;
        --sidebar: rgba(42, 42, 44, 0.96);
        --sidebar-stroke: rgba(255, 255, 255, 0.07);
        --label: rgba(255, 255, 255, 0.88);
        --secondary: rgba(255, 255, 255, 0.52);
        --tertiary: rgba(255, 255, 255, 0.26);
        --separator: rgba(255, 255, 255, 0.09);
        --hover: rgba(255, 255, 255, 0.06);
        --pressed: rgba(255, 255, 255, 0.12);
        --nav-selected: rgba(255, 255, 255, 0.1);
        --stripe: rgba(255, 255, 255, 0.028);
        --row-selected-dim: rgba(255, 255, 255, 0.12);
        --capsule: rgba(255, 255, 255, 0.09);
        --capsule-stroke: rgba(255, 255, 255, 0.1);
        --capsule-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        --field: rgba(255, 255, 255, 0.08);
        --field-bg: rgba(255, 255, 255, 0.06);
        --field-stroke: rgba(255, 255, 255, 0.12);
        --btn: rgba(255, 255, 255, 0.13);
        --btn-stroke: rgba(255, 255, 255, 0.06);
        --panel: #2a2a2c;
        --panel-stroke: rgba(255, 255, 255, 0.1);
        --menu: rgba(44, 44, 46, 0.96);
        --group: rgba(255, 255, 255, 0.05);
        --group-stroke: rgba(255, 255, 255, 0.05);
        --track: rgba(255, 255, 255, 0.14);
        --red: #ff453a;
        --shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { height: 100%; margin: 0; }
      body {
        font: 13px/1.3 var(--ui-font, -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif);
        color: var(--label);
        background: var(--window);
        overflow: hidden;
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      input, textarea { -webkit-user-select: text; user-select: text; font: inherit; color: inherit; }
      button { font: inherit; color: inherit; cursor: default; }
      svg { display: block; flex: none; }
      :focus { outline: none; }
      :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }

      /* Liquid Glass (beta), as Finder has it on macOS 26: the window is glass the desktop shows through (src/glass.rs
         puts the system's glass, or a vibrancy material before macOS 26, behind the page), the sidebar and the
         toolbar's capsules float on it as panes of their own, and the files lie on a card of the window's colour, a
         little see-through, so they read as on a plain window. Nothing is painted behind the glass: what tints it is
         the wallpaper. */
      :root.glass {
        --window: rgba(246, 246, 248, 0.34);
        --content: rgba(255, 255, 255, 0.86);
        --content-stroke: rgba(255, 255, 255, 0.7);
        --sidebar: rgba(255, 255, 255, 0.36);
        --sidebar-stroke: rgba(255, 255, 255, 0.55);
        --capsule: rgba(255, 255, 255, 0.5);
        --capsule-stroke: rgba(255, 255, 255, 0.6);
        --capsule-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 14px rgba(0, 0, 0, 0.06);
        --panel: rgba(246, 246, 248, 0.84);
        --group: rgba(255, 255, 255, 0.72);
        --rim: rgba(255, 255, 255, 0.85);
        --field-bg: rgba(255, 255, 255, 0.7);
        --menu: rgba(250, 250, 252, 0.88);
      }
      :root.glass.dark {
        --window: rgba(28, 28, 30, 0.4);
        --content: rgba(30, 30, 32, 0.84);
        --content-stroke: rgba(255, 255, 255, 0.08);
        --sidebar: rgba(40, 40, 44, 0.34);
        --sidebar-stroke: rgba(255, 255, 255, 0.12);
        --capsule: rgba(70, 70, 76, 0.42);
        --capsule-stroke: rgba(255, 255, 255, 0.14);
        --capsule-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        --panel: rgba(36, 36, 40, 0.82);
        --group: rgba(255, 255, 255, 0.06);
        --rim: rgba(255, 255, 255, 0.24);
        --field-bg: rgba(255, 255, 255, 0.07);
        --menu: rgba(44, 44, 48, 0.88);
      }
      .glass body { background: var(--window); }
      /* The files' card: inset in the window as the sidebar is, so the two read as a pair on the glass. */
      .glass .workspace {
        margin: 0 8px 8px 0; border-radius: 14px; overflow: hidden; background: var(--content);
        box-shadow: 0 0 0 0.5px var(--content-stroke), 0 2px 10px rgba(0, 0, 0, 0.06);
      }
      .glass .status { box-shadow: none; }
      /* The panes of glass: frosted by the page itself before macOS 26, with a light along their top edge. */
      .glass .sidebar, .glass .capsule, .glass .panel, .glass .toast, .glass .banner, .glass .jobs, .glass .suggest {
        -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
      }
      .glass .sidebar, .glass .capsule, .glass .panel { box-shadow: inset 0 1px 0 var(--rim), 0 0 0 0.5px var(--capsule-stroke), 0 8px 28px rgba(0, 0, 0, 0.1); }
      .glass .sidebar { background: var(--sidebar); }
      /* With the system's glass (src/glass.rs lays a pane of it under each of these), the page only tints them a
         little so text keeps its contrast over a bright or busy wallpaper; the glass draws its own edge and light. */
      .glass.native, .glass.native body { background: transparent; }
      .glass.native .sidebar, .glass.native .capsule { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; }
      .glass.native .sidebar { background: color-mix(in srgb, var(--content) 22%, transparent); }
      .glass.native .capsule { background: transparent; }
      /* A sheet lies over the page itself, which the system's glass behind the page cannot blur: the page frosts it,
         over a deeper dim. */
      .glass .modal { background: rgba(0, 0, 0, 0.22); }
      .glass .set-nav { background: color-mix(in srgb, var(--sidebar) 60%, transparent); }

      .app { display: grid; grid-template-columns: var(--side-w, 220px) minmax(0, 1fr); height: 100%; }
      .app.no-sidebar { grid-template-columns: 0 minmax(0, 1fr); }
      .app.no-sidebar .sidebar { display: none; }

      /* The sidebar floats inset in the window, as on macOS 26, and holds the window's buttons at its top. */
      .sidebar {
        position: relative; margin: 8px 0 8px 8px; border-radius: 16px; background: var(--sidebar);
        box-shadow: 0 0 0 0.5px var(--sidebar-stroke), 0 2px 10px rgba(0, 0, 0, 0.05);
        display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      }
      .side-top { height: 40px; flex: none; }
      .side-scroll { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
      .side-scroll::-webkit-scrollbar { width: 0; }
      .side-head {
        display: flex; align-items: center; justify-content: space-between; height: 26px; margin-top: 8px; padding: 0 8px;
        font-size: 11px; font-weight: 600; color: var(--secondary);
      }
      .side-head:first-child { margin-top: 0; }
      #confirmText { white-space: pre-line; }
      .side-head .end { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; opacity: 0; transition: opacity 0.15s; }
      .side-head:hover .end { opacity: 1; }
      .side-head .end:hover { background: var(--pressed); }
      .side-head .end svg { width: 12px; height: 12px; }
      .side-item {
        display: flex; align-items: center; gap: 7px; width: 100%; height: 26px; padding: 0 8px; border: 0; border-radius: 7px;
        background: transparent; text-align: left; white-space: nowrap;
      }
      .side-item:hover { background: var(--hover); }
      .side-item.on { background: var(--nav-selected); font-weight: 500; }
      .side-item.on .ico { color: var(--accent); }
      .side-item .ico { width: 16px; height: 16px; color: var(--secondary); }
      .side-item .ico svg { width: 16px; height: 16px; }
      .side-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .side-item .end { flex: none; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--secondary); opacity: 0.8; }
      .side-item .end:hover { background: var(--pressed); opacity: 1; }
      .side-item .end svg { width: 12px; height: 12px; }
      .side-foot { flex: none; padding: 6px 8px 8px; }
      .resizer { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 2; }

      main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

      /* The toolbar: capsules of buttons in the strip where a title bar would be. */
      .toolbar { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 12px; }
      .capsule {
        display: flex; align-items: center; gap: 0; height: 32px; padding: 0 2px; flex: none; border-radius: 999px;
        background: var(--capsule); box-shadow: 0 0 0 0.5px var(--capsule-stroke), var(--capsule-shadow);
      }
      .tb {
        height: 28px; min-width: 30px; padding: 0 6px; border: 0; border-radius: 999px; background: transparent;
        display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--label);
      }
      .tb:hover { background: var(--hover); }
      .tb:active { background: var(--pressed); }
      .tb:disabled { opacity: 0.3; background: transparent; }
      .tb.on { background: var(--pressed); }
      .tb svg { width: 17px; height: 17px; }
      .tb .caret { width: 9px; height: 9px; opacity: 0.7; }
      .slot-in { display: contents; }
      /* A hairline parts a feature's buttons from the group's own. */
      .slot-in > :first-child { position: relative; margin-left: 7px; }
      .slot-in > :first-child::before { content: ""; position: absolute; left: -4px; top: 7px; bottom: 7px; width: 1px; background: var(--separator); }
      .title { font-size: 15px; font-weight: 700; padding: 0 6px 0 2px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: -0.1px; }
      .spacer { flex: 1; min-width: 8px; height: 100%; }
      .search { display: flex; align-items: center; gap: 6px; width: 190px; padding: 0 10px; }
      .search svg { width: 14px; height: 14px; color: var(--secondary); }
      .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; }
      .search input::placeholder { color: var(--secondary); }

      /* The panes: each with its own tabs, path bar, columns, rows and status. */
      .workspace { flex: 1; min-height: 0; display: flex; }
      .pane-grid { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; }
      .pane-grid[data-layout="h2"] { grid-template-columns: 1fr 1fr; }
      .pane-grid[data-layout="v2"] { grid-template-rows: 1fr 1fr; }
      .pane-grid[data-layout="h3"] { grid-template-columns: 1fr 1fr 1fr; }
      .pane-grid[data-layout="l1r2"], .pane-grid[data-layout="grid"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
      .pane-grid[data-layout="l1r2"] .pane:first-child { grid-row: 1 / span 2; }
      .pane { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; background: transparent; }
      /* The lines between panes: on the left of every pane not in the first column, on top of every one not in the
         first row. */
      [data-layout="h2"] .pane + .pane, [data-layout="h3"] .pane + .pane, [data-layout="l1r2"] .pane:nth-child(2), [data-layout="grid"] .pane:nth-child(2) { box-shadow: inset 1px 0 0 var(--separator); }
      [data-layout="v2"] .pane + .pane, [data-layout="grid"] .pane:nth-child(3) { box-shadow: inset 0 1px 0 var(--separator); }
      [data-layout="l1r2"] .pane:nth-child(3), [data-layout="grid"] .pane:nth-child(4) { box-shadow: inset 1px 1px 0 var(--separator); }
      /* With more than one pane, the focused one is the one the toolbar and the keys act on: its path bar takes a tint of
         the accent and a bar of it under the path; the others step back. */
      .multi .pane:not(.focus) .pathbar, .multi .pane:not(.focus) .head { opacity: 0.6; }
      .multi .pane.focus .pathbar { background: color-mix(in srgb, var(--accent) 6%, transparent); }
      .multi .pane.focus .pathbar::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 1px; background: var(--accent); }
      .multi .pane.focus .crumb:last-child { color: var(--accent); }
      .list.drop { box-shadow: inset 0 0 0 2px var(--accent); border-radius: 8px; }
      .side-item.drop, .tab.drop { box-shadow: inset 0 0 0 2px var(--accent); }
      .cell-icon.drop .pic { box-shadow: 0 0 0 2px var(--accent); }

      /* Tabs are small pills from the left, each as wide as its name needs up to a limit, rather than bars sharing the
         whole width: two tabs no longer look like two halves of a switch. */
      .tabs { flex: none; display: flex; gap: 4px; padding: 0 10px 6px; overflow: hidden; }
      .tab {
        position: relative; flex: 0 1 180px; min-width: 64px; height: 26px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px;
        border-radius: 999px; color: var(--secondary); font-size: 12px; white-space: nowrap; transition: background 0.15s, color 0.15s;
      }
      .tab span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .tab:hover { background: var(--hover); color: var(--label); }
      .tab.on { background: var(--capsule); color: var(--label); font-weight: 500; box-shadow: 0 0 0 0.5px var(--capsule-stroke), var(--capsule-shadow); }
      .tab .x { order: 2; flex: none; width: 16px; height: 16px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; color: var(--secondary); opacity: 0; transition: opacity 0.15s; }
      .tab:hover .x, .tab.on .x { opacity: 1; }
      .tab .x:hover { background: var(--pressed); }
      .tab .x svg { width: 8px; height: 8px; }

      .pathbar { position: relative; flex: none; height: 30px; display: flex; align-items: center; gap: 2px; margin: 0 8px 2px; padding: 0 4px; border-radius: 8px; color: var(--secondary); }
      /* One pane is driven from the toolbar, which has back, forward and the filter already; its own appear with more
         panes, where each needs them. */
      .app:not(.multi) .pathbar .nav, .app:not(.multi) .pathbar [data-act="filter"] { display: none; }
      .pathbar .nav { width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; color: var(--secondary); }
      .pathbar .nav:hover:not(:disabled) { background: var(--hover); color: var(--label); }
      .pathbar .nav:disabled { opacity: 0.35; }
      .pathbar .nav svg { width: 12px; height: 12px; }
      .crumbs { flex: 1; min-width: 0; height: 22px; display: flex; align-items: center; gap: 0; overflow: hidden; padding-left: 4px; border-radius: 6px; }
      .crumbs:hover { background: var(--hover); }
      .crumb { flex: none; display: flex; align-items: center; gap: 5px; height: 20px; padding: 0 4px; border: 0; border-radius: 5px; background: transparent; color: var(--secondary); font-size: 12px; white-space: nowrap; max-width: 220px; }
      .crumb span { overflow: hidden; text-overflow: ellipsis; }
      .crumb:hover { color: var(--label); background: var(--pressed); }
      .crumb:last-child { color: var(--label); }
      .crumb img { width: 14px; height: 14px; }
      .sep { flex: none; width: 12px; height: 12px; display: grid; place-items: center; color: var(--tertiary); }
      .sep svg { width: 6px; height: 7px; }
      .address { flex: 1; min-width: 0; height: 22px; padding: 0 8px; border: 0; border-radius: 6px; outline: none; background: var(--field-bg); box-shadow: 0 0 0 1px var(--accent), 0 0 0 3.5px color-mix(in srgb, var(--accent) 30%, transparent); font-size: 12px; color: var(--label); }
      .pathbar .tool { width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; display: grid; place-items: center; color: var(--secondary); }
      .pathbar .tool:hover { background: var(--hover); color: var(--label); }
      .pathbar .tool svg { width: 13px; height: 13px; }
      .suggest {
        position: absolute; z-index: 30; min-width: 280px; max-height: 300px; overflow-y: auto; padding: 4px; border-radius: 10px;
        background: var(--menu); box-shadow: 0 0 0 0.5px var(--panel-stroke), 0 10px 30px rgba(0, 0, 0, 0.2);
        -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
      }
      .suggest div { height: 22px; line-height: 22px; padding: 0 8px; border-radius: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
      .suggest div.on { background: var(--accent); color: #fff; }

      .head {
        flex: none; display: grid; grid-template-columns: var(--cols); height: 26px; align-items: center; margin: 0 8px;
        font-size: 11px; font-weight: 500; color: var(--secondary); box-shadow: inset 0 -1px 0 var(--separator);
      }
      .col { position: relative; display: flex; align-items: center; gap: 4px; height: 100%; padding: 0 8px; border: 0; background: transparent; color: inherit; font-weight: inherit; font-size: inherit; text-align: left; min-width: 0; }
      .col span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .col.num { justify-content: flex-end; }
      .col.sorted { color: var(--label); }
      .col svg { width: 8px; height: 8px; opacity: 0.8; }
      .col + .col::before { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 1px; background: var(--separator); opacity: 0; transition: opacity 0.15s; }
      .head:hover .col + .col::before { opacity: 1; }
      .col .grip { position: absolute; left: -4px; top: 0; width: 8px; height: 100%; cursor: col-resize; z-index: 1; }

      .list { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 8px; }
      .list:focus-visible { outline: none; }
      .list::-webkit-scrollbar { width: 11px; }
      .list::-webkit-scrollbar-thumb { background: var(--track); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
      /* The thumb shows while the pointer is over the list, as macOS shows it while scrolling. */
      .list:not(:hover)::-webkit-scrollbar-thumb { background: transparent; }
      .sizer { position: relative; width: 100%; }
      .row {
        position: absolute; left: 0; right: 0; height: 24px; display: grid; grid-template-columns: var(--cols); align-items: center; border-radius: 6px;
        font-size: 13px; white-space: nowrap;
      }
      .row.odd { background: var(--stripe); }
      /* Below the last item the list stays plain: stripes there read as rows still to come. */
      .row.odd:empty { background: none; }
      .row .cell { padding: 0 8px; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--secondary); font-variant-numeric: tabular-nums; font-size: 12px; }
      .row .cell.num { text-align: right; }
      .row .name { display: flex; align-items: center; gap: 6px; color: var(--label); font-size: 13px; }
      .row .name img { width: 16px; height: 16px; flex: none; }
      .row .name span { overflow: hidden; text-overflow: ellipsis; }
      .row.cut { opacity: 0.45; }
      .row.hidden-item .name span { opacity: 0.55; }
      .pane.focus .row.sel { background: var(--row-selected); }
      .pane.focus .row.sel .cell, .pane.focus .row.sel .name { color: #fff; }
      .inactive .pane.focus .row.sel { background: var(--row-selected-dim); }
      .inactive .pane.focus .row.sel .cell { color: var(--secondary); }
      .inactive .pane.focus .row.sel .name { color: var(--label); }
      .row.sel { background: var(--row-selected-dim); }
      .row.drop { box-shadow: inset 0 0 0 2px var(--accent); }
      .rename {
        flex: 1; min-width: 60px; height: 20px; margin-left: -3px; padding: 0 3px; border: 0; border-radius: 3px; outline: none;
        background: var(--field-bg); color: var(--label); box-shadow: 0 0 0 1px var(--accent), 0 0 0 3.5px color-mix(in srgb, var(--accent) 30%, transparent);
      }

      .grid-view .row { display: block; height: auto; border-radius: 10px; background: none; }
      .cell-icon {
        position: absolute; width: calc(var(--icon) + 40px); height: calc(var(--icon) + 40px); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; border-radius: 10px;
      }
      .cell-icon .pic { width: var(--icon); height: var(--icon); display: grid; place-items: center; border-radius: 6px; }

      /* Running jobs float above the panes, bottom right. */
      .jobs {
        position: fixed; right: 14px; bottom: 34px; z-index: 25; width: 300px; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px;

      @keyframes wait { from { margin-left: 0; } to { margin-left: 70%; } }
      .job .now { grid-column: 1 / -1; color: var(--secondary); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      select {

      .panel h2 { margin: 0 0 6px; font-size: 14px; font-weight: 700; }

      .buttons { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
      .buttons .check { margin-right: auto; }

      .compare { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 10px 0 0; font-size: 12px; color: var(--secondary); }
      .compare b { color: var(--label); font-weight: 500; }

      .group-title { font-size: 12px; font-weight: 600; color: var(--secondary); margin: 16px 4px 6px; }

        padding: 8px 8px 8px 16px; border-radius: 999px; background: var(--panel); box-shadow: 0 0 0 0.5px var(--panel-stroke), 0 10px 30px rgba(0, 0, 0, 0.18);

        background: var(--panel); box-shadow: 0 0 0 0.5px var(--panel-stroke), 0 8px 26px rgba(0, 0, 0, 0.16); font-weight: 500; text-align: center;

    <script>
      "use strict";
      // Script errors go to the app's log (stderr), as the page has no console in a release.
      window.addEventListener("error", (e) => window.ipc.postMessage(JSON.stringify({ id: 0, method: "app.log", args: { message: `${e.message} (${e.filename}:${e.lineno})` } })));
      window.addEventListener("unhandledrejection", (e) => window.ipc.postMessage(JSON.stringify({ id: 0, method: "app.log", args: { message: `unhandled: ${e.reason}` } })));
      const $ = (id) => document.getElementById(id);
      const root = document.documentElement;
      const pending = new Map();
      let seq = 1;

      function call(method, args = {}) {
        return new Promise((resolve, reject) => {
          const id = seq++;
          pending.set(id, { resolve, reject });
          window.ipc.postMessage(JSON.stringify({ id, method, args }));
        });
      }

      // Every page event goes to the handlers of its name; parts add theirs with `on`.
      const handlers = {};
      function on(name, fn) {
        (handlers[name] ||= []).push(fn);
      }
      window.app = {
        receive(msg) {
          if (msg.id != null && pending.has(msg.id)) {
            const { resolve, reject } = pending.get(msg.id);
            pending.delete(msg.id);
            msg.ok ? resolve(msg.data) : reject(msg.error);
            return;
          }
          for (const fn of handlers[msg.event] || []) {
            try {
              fn(msg.data);
            } catch (e) {
              console.error(e);
            }
          }
        },
      };

      // The page's words in both languages; {0} and {1} are what goes in them. Parts add theirs with `words`.
      const WORDS = {
        vi: {
          settings: "Cài đặt", done: "Xong", general: "Chung", appearance: "Giao diện", about: "Giới thiệu", cancel: "Hủy",
          language: "Ngôn ngữ", languageHint: "Ngôn ngữ của cửa sổ, menu và thông báo.",
          theme: "Chế độ màu", themeHint: "Theo hệ thống, hoặc luôn sáng, luôn tối.", system: "Hệ thống", light: "Sáng", dark: "Tối",
          glassHint: "Thanh bên, thanh công cụ và các bảng thành kính mờ, như macOS 26. Bật hoặc tắt sẽ mở lại cửa sổ.",
          foldersFirst: "Thư mục lên đầu", foldersFirstHint: "Khi sắp xếp theo tên, thư mục luôn đứng trước tệp.",
          folderSizes: "Tính dung lượng thư mục", folderSizesHint: "Cột Kích thước hiện dung lượng của từng thư mục, tính dần ở chế độ nền.",
          autoUpdate: "Tự kiểm tra bản mới", autoUpdateHint: "Hỏi GitHub một lần mỗi lần mở ứng dụng.",
          checkUpdate: "Kiểm tra cập nhật", checking: "Đang kiểm tra bản mới...", upToDate: "Bạn đang dùng bản mới nhất.",
          updateOut: "Có bản LazySpace {0}. Bạn đang dùng {1}.", update: "Cập nhật", updating: "Đang tải...", updatingPct: "Đang tải {0}%",
          updateReady: "Đã tải xong bản mới. Khởi động lại để dùng.", restart: "Khởi động lại",
          back: "Quay lại", forward: "Tiến tới", asList: "Dạng danh sách", asIcons: "Dạng biểu tượng", newFolder: "Thư mục mới",
          moveToTrash: "Chuyển vào Thùng rác", searchHere: "Lọc thư mục này",
        },
        en: {
          settings: "Settings", done: "Done", general: "General", appearance: "Appearance", about: "About", cancel: "Cancel",
          language: "Language", languageHint: "The language of the window, the menus and the notifications.",
          theme: "Colour mode", themeHint: "As the system, or always light or dark.", system: "System", light: "Light", dark: "Dark",
          glassHint: "The sidebar, the toolbar and the sheets turn to frosted glass, as in macOS 26. Turning it on or off reopens the window.",
          foldersFirst: "Folders on top", foldersFirstHint: "When sorting by name, folders always come before files.",
          folderSizes: "Calculate folder sizes", folderSizesHint: "The Size column shows the size of each folder, worked out in the background.",
          autoUpdate: "Check for new versions", autoUpdateHint: "Asks GitHub once each time the app opens.",
          checkUpdate: "Check for Updates", checking: "Checking for a new version...", upToDate: "You have the latest version.",
          updateOut: "LazySpace {0} is out. You have {1}.", update: "Update", updating: "Downloading...", updatingPct: "Downloading {0}%",
          updateReady: "The new version is ready. Restart to use it.", restart: "Restart",
          back: "Back", forward: "Forward", asList: "as List", asIcons: "as Icons", newFolder: "New Folder",
          moveToTrash: "Move to Trash", searchHere: "Filter this folder",
        },
      };
      function words(more) {
        for (const lang of ["vi", "en"]) Object.assign(WORDS[lang], more[lang] || {});
        applyLang();
      }
      let lang = root.lang === "en" ? "en" : "vi";
      const t = (key, ...args) => String(WORDS[lang][key] ?? WORDS.vi[key] ?? key).replace(/\{(\d)\}/g, (_, i) => args[i]);

      // The static words of the page: data-t is an element's text, data-tp a placeholder, data-tt a button's title and
      // label.
      function applyLang() {
        root.lang = lang;
        for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
        for (const el of document.querySelectorAll("[data-tp]")) el.placeholder = t(el.dataset.tp);
        for (const el of document.querySelectorAll("[data-tt]")) { el.title = t(el.dataset.tt); el.setAttribute("aria-label", t(el.dataset.tt)); }
      }

      // What the page knows of itself; the panes and tabs are kept by 02-core-panes.js.
      const S = {
        window: { role: "main", id: 0 },
        settings: {},
        glassAvailable: false,
        places: {},
      };

      let toastTimer;
      function toast(text) {
        $("toast").textContent = text;
        $("toast").classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => $("toast").classList.remove("show"), 3600);
      }
      const say = (error) => toast(String(error));
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      // The window is dragged by its toolbar and the top of the sidebar, and zoomed by a double click there, as the
      // title bar the window no longer shows would.
      document.addEventListener("mousedown", (e) => {
        if (e.button !== 0 || !e.target.closest(".drag") || e.target.closest("button, input, label, a, select, .capsule")) return;
        call(e.detail === 2 ? "app.zoom" : "app.drag").catch(() => {});
      });

      // The native glass behind the page (src/glass.rs) is told where the page lets it show.
      let glassTimer;
      function reportGlass() {
        clearTimeout(glassTimer);
        glassTimer = setTimeout(() => {
          if (!S.glassAvailable || !root.classList.contains("glass")) return;
          const panes = [];
          for (const el of document.querySelectorAll(".sidebar, .capsule, .modal.open .panel")) {
            const r = el.getBoundingClientRect();
            if (r.width < 1 || r.height < 1) continue;
            panes.push([r.x, r.y, r.width, r.height, parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0]);
          }
          call("glass.panes", { panes }).catch(() => {});
        }, 60);
      }
      new ResizeObserver(reportGlass).observe(document.body);

      function paintLook() {
        paintTheme();
        root.classList.toggle("native", S.glassAvailable && root.classList.contains("glass"));
        reportGlass();
      }

      const setSetting = (patch) => call("settings.set", { patch }).catch(say);
      $("theme").addEventListener("click", (e) => {
        const seg = e.target.closest("[data-theme]");
        if (seg) setSetting({ theme: seg.dataset.theme });
      });
      $("glass").addEventListener("change", () => setSetting({ glass: $("glass").checked }));
      $("language").addEventListener("change", () => setSetting({ language: $("language").value }));
      $("foldersFirst").addEventListener("change", () => setSetting({ sort: { foldersFirst: $("foldersFirst").checked } }));
      $("folderSizes").addEventListener("change", () => setSetting({ folder_sizes: $("folderSizes").checked }));
      $("autoUpdate").addEventListener("change", () => setSetting({ check_updates: $("autoUpdate").checked }));

      // Sheets: one open at a time, closed by Escape or a click beside it (unless it waits for an answer).
      function openSheet(id) {
        closeSheets();
        $(id).classList.add("open");
        setTimeout(reportGlass, 260);
        reportGlass();
      }
      function closeSheets() {
        for (const sheet of document.querySelectorAll(".modal.open")) sheet.classList.remove("open");
        reportGlass();
      }
      const sheetOpen = () => !!document.querySelector(".modal.open");
      $("settingsDone").addEventListener("click", closeSheets);
      document.querySelector(".sheets").addEventListener("mousedown", (e) => {
        if (e.target.classList.contains("modal") && !e.target.dataset.modal) closeSheets();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && sheetOpen() && !document.querySelector(".modal.open[data-modal]")) closeSheets();
      });

      // A question with two answers, as a sheet; resolves true for the first.
      function confirmSheet(title, text, yes) {
        return new Promise((resolve) => {
          $("confirmTitle").textContent = title;
          $("confirmText").textContent = text;
          $("confirmYes").textContent = yes;
          openSheet("confirmSheet");
          const done = (answer) => {
            $("confirmYes").onclick = $("confirmNo").onclick = null;
            closeSheets();
            resolve(answer);
          };
          $("confirmYes").onclick = () => done(true);
          $("confirmNo").onclick = () => done(false);
          setTimeout(() => $("confirmYes").focus(), 30);
        });
      }

      $("checkUpdate").addEventListener("click", () => {
        $("updateNote").textContent = t("checking");
        call("update.check", { manual: true }).catch(say);
      });
      $("bannerBtn").addEventListener("click", () => {
        $("bannerBtn").textContent = t("updating");
        $("bannerBtn").disabled = true;
        call("update.install").catch(say);
      });

      function showSettings(s) {
        S.settings = s;
        lang = s.language === "en" ? "en" : "vi";
        $("language").value = lang;
        applyLang();
        root.dataset.theme = s.theme;
        for (const seg of $("theme").children) seg.classList.toggle("on", seg.dataset.theme === s.theme);
        root.toggleAttribute("data-glass", s.glass);
        $("glass").checked = s.glass;
        $("foldersFirst").checked = s.sort?.foldersFirst !== false;
        $("folderSizes").checked = !!s.folder_sizes;
        $("autoUpdate").checked = s.check_updates !== false;
        paintLook();
      }

      on("app.hello", (d) => {
        S.window = { role: d.windowRole, id: d.windowId };
        S.glassAvailable = !!d.glassAvailable;
        S.hello = d;
        $("version").textContent = d.version;
        showSettings(d.settings);
      });
      on("settings.changed", showSettings);
      on("theme.changed", () => paintLook());
      on("menu.action", (d) => {
        if (d.id === "app.settings") openSheet("settingsSheet");
      });
      on("update.available", (d) => {
        $("bannerTxt").textContent = t("updateOut", d.latest, d.current);
        $("banner").classList.add("show");
      });
      on("update.none", () => ($("updateNote").textContent = t("upToDate")));
      on("update.progress", (percent) => ($("bannerBtn").textContent = t("updatingPct", percent)));
      on("update.ready", () => {
        $("bannerTxt").textContent = t("updateReady");
        $("bannerBtn").textContent = t("restart");
        $("bannerBtn").disabled = false;
        $("bannerBtn").onclick = () => call("update.relaunch").catch(say);
      });
      on("toast", toast);

      applyLang();
      // The page tells the app it is ready once every part has added its handlers (the last script, in ui/parts).
      window.addEventListener("DOMContentLoaded", () => call("app.ready").catch(() => {}));
    </script>
    <!--parts-->
  </body>
</html>
